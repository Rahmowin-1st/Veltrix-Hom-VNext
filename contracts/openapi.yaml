components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    Error:
      description: Stable structured domain error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    RegisterRequest:
      type: object
      required:
      - login
      - password
      - displayName
      properties:
        login:
          type: string
        password:
          type: string
          minLength: 12
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        preferredLanguage:
          type: string
          default: en
        timezone:
          type: string
          default: UTC
    LoginRequest:
      type: object
      required:
      - login
      - password
      properties:
        login:
          type: string
        password:
          type: string
        deviceLabel:
          type:
          - string
          - 'null'
    SessionResponse:
      type: object
      required:
      - sessionToken
      - accountId
      - expiresAt
      properties:
        sessionToken:
          type: string
        accountId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - category
          - message
          - retryable
          properties:
            code:
              type: string
            category:
              type: string
              enum:
              - AUTH
              - PERMISSION
              - VALIDATION
              - NOT_FOUND
              - CONFLICT
              - RATE_LIMIT
              - NETWORK_UPSTREAM
              - AI_PROVIDER
              - SOURCE_PROCESSING
              - STORAGE
              - DATABASE
              - TEMPORARY_UNAVAILABLE
              - INTERNAL
            message:
              type: string
            retryable:
              type: boolean
            requestId:
              type:
              - string
              - 'null'
    ApiObject:
      type: object
      additionalProperties: true
      description: Endpoint-specific JSON DTO. Kotlin @Serializable server DTOs and Android repository contracts are the strongly typed source-level contract; this
        forward-compatible envelope prevents undocumented HTTP fields.
    ApiAck:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
    GenericMutationRequest:
      type: object
      additionalProperties: true
      description: Endpoint-specific mutation DTO. The server serializer and domain validation enforce the concrete fields and constraints.
