  /auth/google:
    post:
      operationId: postAuthGoogle
      summary: Post /auth/google
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleIdentityExchangeRequest'
      description: Trusted Google identity exchange. Returns 201 for a newly created Veltrix account and 200 for an existing linked account. In both cases the body
        is the normal server-minted SessionResponse.
      responses:
        '200':
          description: Existing linked account signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '201':
          description: New Veltrix account created and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
