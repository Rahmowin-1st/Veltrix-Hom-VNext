        '503':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  responses:
    Error:
      description: Stable structured domain error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    RegisterRequest:
      type: object
      required:
      - login
      - password
      - displayName
      properties:
        login:
          type: string
        password:
          type: string
          minLength: 12
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        preferredLanguage:
          type: string
          default: en
        timezone:
          type: string
          default: UTC
    LoginRequest:
      type: object
      required:
      - login
      - password
      properties:
        login:
          type: string
        password:
          type: string
        deviceLabel:
          type:
          - string
          - 'null'
    SessionResponse:
      type: object
      required:
      - sessionToken
      - accountId
      - expiresAt
      properties:
        sessionToken:
          type: string
        accountId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    GoogleIdentityExchangeRequest:
      type: object
      additionalProperties: false
      required:
      - idToken
      - nonce
      properties:
        idToken:
          type: string
          minLength: 32
          maxLength: 16384
          writeOnly: true
        nonce:
          type: string
          minLength: 16
          maxLength: 512
          writeOnly: true
      description: Android Google ID token and client-generated nonce. The server validates Google signature/claims and never persists or logs the raw credential.
    StoreAvailabilityResponse:
      type: object
      required:
      - state
      - reasonCode
      properties:
        state:
          type: string
          enum:
          - OWNED
          - AVAILABLE
          - LOCKED
        reasonCode:
          type: string
        requiredLevel:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 50
        requiredSeasonId:
          type:
          - string
          - 'null'
        requiredAchievementId:
          type:
          - string
          - 'null'
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - category
          - message
          - retryable
          properties:
            code:
              type: string
            category:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            requestId:
              type:
              - string
              - 'null'
    ApiObject:
      type: object
      additionalProperties: true
      description: Endpoint-specific JSON DTO. Kotlin @Serializable server DTOs and Android repository contracts are the strongly typed source-level contract; this
        forward-compatible envelope prevents undocumented HTTP fields.
    ApiAck:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
    GenericMutationRequest:
      type: object
      additionalProperties: true
      description: Endpoint-specific mutation DTO. The server serializer and domain validation enforce the concrete fields and constraints.
