openapi: 3.1.0
info:
  title: Veltrix Hom vNext Backend Final API
  version: 0.4.0-backend-final-closure
  description: Authoritative account-first online Veltrix Hom vNext backend contract. Server owns sessions, Google identity exchange, authorization, progression/economy,
    Store, Map, persistence and deletion truth.
servers:
- url: /v1
security:
- bearerSession: []
