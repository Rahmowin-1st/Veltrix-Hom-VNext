name: Veltrix Part 1 FINAL Gate V6

on:
  push:
    branches: [veltrix-hom-part1-completion]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  final-gate-v6:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_DB: veltrix_vnext_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d veltrix_vnext_test"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      VELTRIX_ENV: test
      VELTRIX_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
      VELTRIX_DATABASE_USER: postgres
      VELTRIX_DATABASE_PASSWORD: postgres
      VELTRIX_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
      VELTRIX_TEST_DATABASE_USER: postgres
      VELTRIX_TEST_DATABASE_PASSWORD: postgres
      VELTRIX_AI_PROVIDER: disabled
      VELTRIX_TEST_AI_MOCK: 'true'
      VELTRIX_EMBEDDING_PROVIDER: disabled
      VELTRIX_TEST_EMBEDDING_MOCK: 'true'
      VELTRIX_EMBEDDING_DIMENSIONS: '64'
      VELTRIX_TEST_OCR_MOCK: 'true'
      VELTRIX_TEST_TRANSLATE_MOCK: 'true'
      VELTRIX_STORAGE_PROVIDER: s3
      VELTRIX_S3_ENDPOINT: http://127.0.0.1:9000
      VELTRIX_S3_REGION: us-east-1
      VELTRIX_S3_BUCKET: veltrix-hom-vnext
      VELTRIX_S3_ACCESS_KEY: veltrixci
      VELTRIX_S3_SECRET_KEY: veltrixci-secret-2026
      VELTRIX_S3_PATH_STYLE: 'true'
      VELTRIX_WORKERS_ENABLED: 'false'
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android-avd

    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Exact provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p evidence/provenance
          printf 'repository=Rahmowin-1st/Veltrix-Hom-VNext\nbranch=%s\ncommit=%s\nrun_id=%s\nfoundation_checkpoint=d47d0876eb2ee30a480549a89b42382b4a31d8ed\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" | tee evidence/provenance/source.txt
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.5.1'}

      - name: MinIO and pgvector runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name veltrix-minio -p 9000:9000 -p 9001:9001 -e MINIO_ROOT_USER="$VELTRIX_S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$VELTRIX_S3_SECRET_KEY" minio/minio:RELEASE.2025-04-22T22-12-26Z server /data --console-address ':9001'
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:9000/minio/health/ready
          docker run --rm --network host --entrypoint /bin/sh minio/mc:RELEASE.2025-04-16T18-13-26Z -c "mc alias set local '$VELTRIX_S3_ENDPOINT' '$VELTRIX_S3_ACCESS_KEY' '$VELTRIX_S3_SECRET_KEY' >/dev/null && mc mb --ignore-existing local/$VELTRIX_S3_BUCKET"
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d veltrix_vnext_test -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d veltrix_vnext_test -c "SELECT version(); SELECT extversion FROM pg_extension WHERE extname='vector';" | tee evidence/postgres-pgvector.txt
          grep -q '0.8.2' evidence/postgres-pgvector.txt

      - name: Backend deterministic integration security gates
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :core:test :server:test | tee evidence/gradle-server-tests.txt
          grep -q 'BUILD SUCCESSFUL' evidence/gradle-server-tests.txt
          bash scripts/run_local_regressions.sh | tee evidence/deterministic-105.txt
          grep -q 'LOCAL_REGRESSION_GATE=PASS total=105' evidence/deterministic-105.txt
          bash scripts/verify_structure.sh | tee evidence/structure.txt
          grep -q 'STRUCTURE_VERIFY=PASS' evidence/structure.txt
          python3 -m pip install --quiet pyyaml
          python3 scripts/verify_openapi_drift.py | tee evidence/openapi-drift.txt
          grep -q 'OPENAPI_DRIFT=PASS' evidence/openapi-drift.txt
          ! grep -R --exclude-dir=.git --exclude-dir=build --exclude='*.md' -nE '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' .
          ! grep -R --exclude-dir=build -n 'SYSTEM_ALERT_WINDOW' android
          echo STATIC_SECURITY_GATE=PASS | tee evidence/security-static.txt

      - name: Real Ktor and cross-feature runtime
        env: {VELTRIX_WORKERS_ENABLED: 'true'}
        shell: bash
        run: |
          set -euo pipefail
          nohup gradle --no-daemon :server:run > evidence/server-run.txt 2>&1 &
          echo $! > evidence/server.pid
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8080/health > evidence/health.json && break; sleep 2; done
          grep -q '"status":"ok"' evidence/health.json
          curl -fsS http://127.0.0.1:8080/ready | tee evidence/ready.json
          grep -q '"ready":true' evidence/ready.json
          grep -q '"database":"ok"' evidence/ready.json
          grep -q '"storageConfigured":true' evidence/ready.json
          grep -q '"embeddingConfigured":true' evidence/ready.json
          grep -q '"testAiConfigured":true' evidence/ready.json
          python3 scripts/http_runtime_smoke.py http://127.0.0.1:8080 | tee evidence/http-runtime-smoke.json
          grep -q '"HTTP_RUNTIME_SMOKE": "PASS"' evidence/http-runtime-smoke.json

      - uses: android-actions/setup-android@v3
      - name: Android 17 API37 toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          # GitHub runner images may carry a newer preview emulator. Remove it first,
          # then install strictly from Android SDK stable channel 0.
          sdkmanager --uninstall 'emulator' >/dev/null 2>&1 || true
          rm -rf "$ANDROID_HOME/emulator"
          sdkmanager --channel=0 'emulator'
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools' 'system-images;android-37.0;google_apis;x86_64'
          sudo apt-get update
          sudo apt-get install -y libpulse0
          "$ANDROID_HOME/emulator/emulator" -version 2>&1 | tee evidence/emulator-version.txt
          grep -q 'Android emulator version 36.6.11' evidence/emulator-version.txt
          echo 'ANDROID_EMULATOR_STABLE_CHANNEL_GATE=PASS version=36.6.11' | tee evidence/emulator-stable-channel.txt

      - name: Build exact APK and androidTest APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :android:app:assembleDebug :android:app:assembleDebugAndroidTest | tee evidence/android-build.txt
          grep -q 'BUILD SUCCESSFUL' evidence/android-build.txt
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find android/app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f -size +0c | head -1)
          test -s "$APK"; test -s "$TEST_APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | tee evidence/android-badging.txt
          grep -q "package: name='com.veltrix.hom.vnext.dev'" evidence/android-badging.txt
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 -v 4 "$APK" | tee evidence/android-zipalign-16k.txt
          grep -q 'Verification successful' evidence/android-zipalign-16k.txt
          sha256sum "$APK" "$TEST_APK" | tee evidence/android-apk-build-sha256.txt

      - name: Boot stable API37 SwiftShader emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n veltrix_vnext_api37 -k 'system-images;android-37.0;google_apis;x86_64' -f
          CFG="$ANDROID_AVD_HOME/veltrix_vnext_api37.avd/config.ini"
          printf '\nhw.ramSize=4096\nhw.cpu.ncore=2\ndisk.dataPartition.size=4G\n' >> "$CFG"
          adb kill-server || true; adb start-server
          nohup "$ANDROID_HOME/emulator/emulator" @veltrix_vnext_api37 -port 5554 -memory 4096 -cores 2 -partition-size 4096 -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > evidence/emulator.log 2>&1 &
          EPID=$!
          SERIAL=''
          for i in $(seq 1 180); do
            kill -0 "$EPID" 2>/dev/null || break
            SERIAL=$(adb devices | awk 'NR>1 && $2=="device"{print $1;exit}')
            [ -n "$SERIAL" ] && break
            [ "$i" -ge 15 ] && adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            sleep 2
          done
          test -n "$SERIAL"; export ANDROID_SERIAL="$SERIAL"
          for i in $(seq 1 180); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 2; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          for i in $(seq 1 90); do adb shell pm path android >/dev/null 2>&1 && adb shell service check activity 2>&1 | grep -q found && break; sleep 2; done
          grep -Fx 17 <(adb shell getprop ro.build.version.release | tr -d '\r')
          grep -Fx 37 <(adb shell getprop ro.build.version.sdk | tr -d '\r')
          AVAIL=$(adb shell df -Pk /data | awk 'NR==2{print $4}' | tr -d '\r'); echo DATA_AVAILABLE_KB=$AVAIL | tee evidence/data-capacity.txt; test "$AVAIL" -ge 524288
          SS1=$(adb shell pidof system_server | tr -d '\r'); SF1=$(adb shell pidof surfaceflinger | tr -d '\r'); test -n "$SS1"; test -n "$SF1"
          sleep 10
          test "$SS1" = "$(adb shell pidof system_server | tr -d '\r')"
          test "$SF1" = "$(adb shell pidof surfaceflinger | tr -d '\r')"
          adb shell service check package | tee evidence/package-service.txt; grep -q found evidence/package-service.txt
          adb shell service check activity | tee evidence/activity-service.txt; grep -q found evidence/activity-service.txt
          grep -qi SwiftShader evidence/emulator.log
          echo ANDROID_API37_STABLE_BOOT_GATE=PASS | tee evidence/android-runtime-boot.txt

      - name: Install APKs and prove cold launch
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find android/app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f -size +0c | head -1)
          adb push "$APK" /data/local/tmp/veltrix-app.apk | tee evidence/push-app.txt
          adb shell pm install -r -t /data/local/tmp/veltrix-app.apk | tee evidence/install-app.txt
          grep -q Success evidence/install-app.txt
          adb push "$TEST_APK" /data/local/tmp/veltrix-test.apk | tee evidence/push-test.txt
          adb shell pm install -r -t /data/local/tmp/veltrix-test.apk | tee evidence/install-test.txt
          grep -q Success evidence/install-test.txt
          PACKAGE=com.veltrix.hom.vnext.dev; COMPONENT=$PACKAGE/com.veltrix.hom.vnext.MainActivity
          OK=0; : > evidence/cold-launch.txt
          for i in $(seq 1 5); do
            adb shell am force-stop "$PACKAGE" || true
            set +e; OUT=$(adb shell am start -W -S -n "$COMPONENT" 2>&1); RC=$?; set -e
            printf 'attempt=%s rc=%s\n%s\n' "$i" "$RC" "$OUT" | tee -a evidence/cold-launch.txt
            if [ "$RC" -eq 0 ] && echo "$OUT" | grep -q 'Status: ok'; then sleep 3; test -n "$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r')" && OK=1 && break; fi
            sleep 3
          done
          test "$OK" -eq 1
          echo ANDROID_COLD_LAUNCH_GATE=PASS | tee evidence/android-cold-launch.txt

      - name: Android real server shell process-death and offline gates
        shell: bash
        run: |
          set -euo pipefail
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.hom.vnext.dev.*/\1/p' | head -1 | tr -d '\r'); test -n "$I"
          adb shell am instrument -w -e class com.veltrix.hom.vnext.ShellInstrumentedTest "$I" | tee evidence/shell-instrumentation.txt; grep -q 'OK (1 test)' evidence/shell-instrumentation.txt
          adb shell am instrument -w -e class com.veltrix.hom.vnext.ServerIntegrationInstrumentedTest "$I" | tee evidence/server-instrumentation.txt; grep -q 'OK (1 test)' evidence/server-instrumentation.txt
          adb shell am instrument -w -e class 'com.veltrix.hom.vnext.PersistenceInstrumentedTest#aSeedProjectForProcessRestart' "$I" | tee evidence/process-seed.txt; grep -q 'OK (1 test)' evidence/process-seed.txt
          adb shell am force-stop com.veltrix.hom.vnext.dev
          adb shell am instrument -w -e class 'com.veltrix.hom.vnext.PersistenceInstrumentedTest#zVerifyProjectAfterProcessRestart' "$I" | tee evidence/process-verify.txt; grep -q 'OK (1 test)' evidence/process-verify.txt
          adb shell cmd connectivity airplane-mode enable || adb shell settings put global airplane_mode_on 1
          adb shell svc wifi disable || true
          adb shell am instrument -w -e class 'com.veltrix.hom.vnext.OfflineDataInstrumentedTest#aSeedOfflineDurableState' "$I" | tee evidence/offline-seed.txt; grep -q 'OK (1 test)' evidence/offline-seed.txt
          adb shell am force-stop com.veltrix.hom.vnext.dev
          adb shell am instrument -w -e class 'com.veltrix.hom.vnext.OfflineDataInstrumentedTest#zVerifyOfflineDurableStateAfterProcessRestart' "$I" | tee evidence/offline-verify.txt; grep -q 'OK (1 test)' evidence/offline-verify.txt
          adb shell cmd connectivity airplane-mode disable || adb shell settings put global airplane_mode_on 0
          adb shell svc wifi enable || true

      - name: Full connected regression and final relaunch
        shell: bash
        run: |
          set -euo pipefail
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.hom.vnext.dev.*/\1/p' | head -1 | tr -d '\r')
          adb shell pm clear com.veltrix.hom.vnext.dev | tee evidence/pre-full-suite-clear.txt; grep -q Success evidence/pre-full-suite-clear.txt
          adb shell am instrument -w "$I" 2>&1 | tee evidence/android-connected.txt
          grep -Eq 'OK \([0-9]+ tests?\)' evidence/android-connected.txt
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          adb push "$APK" /data/local/tmp/veltrix-app-final.apk >/dev/null
          adb shell pm install -r -t /data/local/tmp/veltrix-app-final.apk | tee evidence/reinstall.txt; grep -q Success evidence/reinstall.txt
          OK=0
          for i in $(seq 1 5); do set +e; OUT=$(adb shell am start -W -S -n com.veltrix.hom.vnext.dev/com.veltrix.hom.vnext.MainActivity 2>&1); RC=$?; set -e; echo "$OUT" | tee -a evidence/final-launch.txt; if [ "$RC" -eq 0 ] && echo "$OUT" | grep -q 'Status: ok'; then sleep 3; test -n "$(adb shell pidof com.veltrix.hom.vnext.dev 2>/dev/null)" && OK=1 && break; fi; sleep 3; done
          test "$OK" -eq 1
          echo ANDROID_FINAL_RELAUNCH_GATE=PASS | tee evidence/android-final-relaunch.txt

      - name: Package exact tested deliverables
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final; mkdir -p final/handoff final/provenance
          git archive --format=zip --output=final/Veltrix-Hom-VNext-Part1-EXACT-TESTED-SOURCE.zip HEAD
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find android/app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f -size +0c 2>/dev/null | head -1 || true)
          [ -s "$APK" ] && cp "$APK" final/Veltrix-Hom-VNext-Part1-FINAL.apk || true
          [ -n "$TEST_APK" ] && [ -s "$TEST_APK" ] && cp "$TEST_APK" final/Veltrix-Hom-VNext-Part1-ANDROID-TEST.apk || true
          cp -a docs contracts README.md CHECKPOINT_IMPORT_PROVENANCE.md final/handoff/
          cp docs/FINAL_MANAGER_HANDOFF.md docs/Test_Report.md docs/Security_Report.md docs/Performance_Report.md docs/Known_Limitations.md docs/VERIFIED_CLAIMED_NOT_VERIFIED.md final/
          cp contracts/openapi.yaml final/OpenAPI-final.yaml
          cp docs/Migration_Report.md final/DB_Migration_Report.md
          cp docs/Part2_Integration_Contract.md final/Part2_Integration_Contract.md
          cp docs/Part3_Frontend_Handoff.md final/Part3_Frontend_Handoff.md
          cp -a evidence final/evidence
          (cd final && zip -qr Veltrix-Hom-VNext-Part1-EVIDENCE.zip evidence && zip -qr Veltrix-Hom-VNext-Part1-HANDOFF.zip handoff)
          cp evidence/provenance/source.txt final/provenance/runtime.txt
          find final -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > final/SHA256SUMS
          cat final/SHA256SUMS

      - name: Upload canonical V6 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-hom-part1-final-v6-${{ github.run_id }}
          path: final/
          if-no-files-found: error
          retention-days: 30
