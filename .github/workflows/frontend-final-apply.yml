name: Veltrix Frontend Final Closure Apply

on:
  push:
    branches: [veltrix-hom-frontend-final-closure]
    paths:
      - scripts/frontend-final-closure.patch.gz.b64
      - .github/workflows/frontend-final-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veltrix-frontend-final-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: veltrix-hom-frontend-final-closure
      - name: Apply exact frontend final closure delta
        shell: bash
        run: |
          set -euo pipefail
          ACCEPTED_BACKEND='c93653d1bb48c9e2ecea9fac570f966a5a878ff0'
          git merge-base --is-ancestor "$ACCEPTED_BACKEND" HEAD
          base64 -d scripts/frontend-final-closure.patch.gz.b64 | gzip -dc > /tmp/frontend-final.patch
          git apply --check /tmp/frontend-final.patch
          git apply /tmp/frontend-final.patch
          rm scripts/frontend-final-closure.patch.gz.b64
          rm .github/workflows/frontend-final-apply.yml
          git config user.name 'Veltrix Frontend Master'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(frontend): close final mission defects and wire accepted Google auth'
          git push origin HEAD:veltrix-hom-frontend-final-closure
