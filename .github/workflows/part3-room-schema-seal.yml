name: Veltrix Backend Part 3 Room Schema Seal

on:
  workflow_dispatch:
  push:
    branches: [veltrix-hom-backend-part3-final]
    paths:
      - .github/workflows/part3-room-schema-seal.yml
      - build.gradle.kts
      - android/app/build.gradle.kts
      - android/app/src/main/kotlin/com/veltrix/hom/vnext/Part3LocalDatabase.kt
      - android/app/src/main/kotlin/com/veltrix/hom/vnext/Part3AndroidContracts.kt
      - android/app/src/main/kotlin/com/veltrix/hom/vnext/SyncWorker.kt
      - android/app/src/androidTest/kotlin/com/veltrix/hom/vnext/Part3FinalStateInstrumentedTest.kt

permissions:
  contents: write

concurrency:
  group: veltrix-part3-room-schema-seal
  cancel-in-progress: true

jobs:
  android-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veltrix-hom-backend-part3-final
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Compile Android and generate deterministic Room schemas
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gradle --no-daemon :android:app:testDebugUnitTest :android:app:assembleDebug :android:app:assembleDebugAndroidTest
          test -s android/app/schemas/com.veltrix.hom.vnext.Part3LocalDatabase/1.json
          test -s android/app/schemas/com.veltrix.hom.vnext.VeltrixLocalDatabase/2.json
          find android/app/schemas -type f -name '*.json' -print | sort | tee /tmp/room-schemas.txt
          echo PART3_ANDROID_COMPILE=PASS
          echo PART3_ROOM_SCHEMA_EXPORT=PASS
      - name: Commit generated schemas if changed
        run: |
          set -euo pipefail
          git add android/app/schemas
          if git diff --cached --quiet; then
            echo PART3_ROOM_SCHEMAS_ALREADY_SEALED=PASS
            exit 0
          fi
          git config user.name veltrix-backend-master
          git config user.email actions@users.noreply.github.com
          git commit -m 'build(part3): seal generated Room schemas'
          git push origin HEAD:veltrix-hom-backend-part3-final
          echo PART3_ROOM_SCHEMA_PUSH=PASS
