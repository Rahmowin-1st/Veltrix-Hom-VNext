name: Veltrix Frontend Part 2 Gate

on:
  push:
    branches: [veltrix-hom-frontend-part2]
  workflow_dispatch:

concurrency:
  group: veltrix-frontend-part2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  ACCEPTED_BACKEND_SHA: 4ed13cfcf7d4bb1fe6215b231426e0b4f208343a
  PART1_SHA: ae8499fec896bd8715f5f114fc0eb95f12e8ebe1
  VELTRIX_ENV: test
  VELTRIX_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
  VELTRIX_DATABASE_USER: postgres
  VELTRIX_DATABASE_PASSWORD: postgres
  VELTRIX_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
  VELTRIX_TEST_DATABASE_USER: postgres
  VELTRIX_TEST_DATABASE_PASSWORD: postgres
  VELTRIX_AI_PROVIDER: disabled
  VELTRIX_TEST_AI_MOCK: 'true'
  VELTRIX_EMBEDDING_PROVIDER: disabled
  VELTRIX_TEST_EMBEDDING_MOCK: 'true'
  VELTRIX_EMBEDDING_DIMENSIONS: '64'
  VELTRIX_TEST_OCR_MOCK: 'true'
  VELTRIX_TEST_TRANSLATE_MOCK: 'true'
  VELTRIX_STORAGE_PROVIDER: local
  VELTRIX_WORKERS_ENABLED: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_DB: veltrix_vnext_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d veltrix_vnext_test"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence package
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$ACCEPTED_BACKEND_SHA^{commit}"
          git cat-file -e "$PART1_SHA^{commit}"
          git merge-base --is-ancestor "$ACCEPTED_BACKEND_SHA" "$GITHUB_SHA"
          git merge-base --is-ancestor "$PART1_SHA" "$GITHUB_SHA"
          ! git diff --name-only "$ACCEPTED_BACKEND_SHA" "$GITHUB_SHA" | grep -E '^(server/|database/migrations/|core/src/main/)' || exit 1
          printf 'repo=%s\nbranch=%s\ncommit=%s\naccepted_backend=%s\npart1=%s\nrun=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$ACCEPTED_BACKEND_SHA" "$PART1_SHA" "$GITHUB_RUN_ID" | tee evidence/provenance.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Regressions and Android build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :core:test :server:test | tee evidence/backend-regression.txt
          bash scripts/run_local_regressions.sh | tee evidence/frozen-regressions.txt
          gradle --no-daemon -PVELTRIX_API_BASE_URL=http://127.0.0.1:8080 :android:app:testDebugUnitTest :android:app:assembleDebug :android:app:assembleDebugAndroidTest | tee evidence/android-build.txt
          grep -q 'BUILD SUCCESSFUL' evidence/android-build.txt
          grep -q 'LOCAL_REGRESSION_GATE=PASS total=105' evidence/frozen-regressions.txt
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee evidence/apk-sha256-build.txt
      - name: Start accepted backend for runtime
        shell: bash
        run: |
          set -euo pipefail
          nohup gradle --no-daemon :server:run > evidence/server-runtime.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:8080/ready > evidence/ready.json; then break; fi
            sleep 2
          done
          grep -q '"ready":true' evidence/ready.json
      - uses: android-actions/setup-android@v3
      - name: Android API36 runtime packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'build-tools;37.0.0' 'platforms;android-37.0' 'system-images;android-36;google_apis;x86_64'
      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm | tee evidence/kvm.txt
          else
            echo '/dev/kvm unavailable' | tee evidence/kvm.txt
            exit 1
          fi
      - name: API36 final runtime, visual, motion, A11Y and PF proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          emulator-options: -no-window -gpu auto -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash .github/scripts/frontend-part2-final-proof.sh
      - name: Package exact source and final evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package Veltrix-Hom-Frontend-Part2-EVIDENCE.zip
          mkdir -p package
          git archive --format=zip --output=package/Veltrix-Hom-Frontend-Part2-EXACT-SOURCE.zip "$GITHUB_SHA"
          cp android/app/build/outputs/apk/debug/app-debug.apk package/Veltrix-Hom-Frontend-Part2.apk
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk package/Veltrix-Hom-Frontend-Part2-androidTest.apk
          cp -a evidence package/evidence
          cp evidence/VELTRIX_FRONTEND_PART2_MANAGER_HANDOFF_2026-08-15.md package/
          (cd package && find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          zip -qr Veltrix-Hom-Frontend-Part2-EVIDENCE.zip package
      - name: Verify final package gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f evidence/runtime/final-gate.txt ]; then
            grep -q 'PART1_ACCEPTANCE_CANDIDATE=PASS' evidence/runtime/final-gate.txt
            grep -q 'PART2_ACCEPTANCE_CANDIDATE=PASS' evidence/runtime/final-gate.txt
            grep -q 'SCREENSHOT_ARTIFACT_SET=PASS fresh_matrix=25 total_png=29' evidence/runtime/final-gate.txt
            grep -q 'VISUAL_MATRIX=PASS count=25 semantic=25 complete_render=25 fresh_manifest=PASS' evidence/screens/visual-matrix-gate.txt
            grep -q 'PART2_FINAL_PROOF=PASS' evidence/runtime/final-progress.txt
            test -s evidence/screens/screenshot-sha256.txt
            test "$(wc -l < evidence/screens/screenshot-sha256.txt)" -eq 25
            test "$(find evidence/screens -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 29
            sha256sum -c evidence/screens/screenshot-sha256.txt
            test -s evidence/motion/part2-world-transitions.mp4
            test -s evidence/VELTRIX_FRONTEND_PART2_MANAGER_HANDOFF_2026-08-15.md
            test -s package/Veltrix-Hom-Frontend-Part2-EXACT-SOURCE.zip
            test -s package/Veltrix-Hom-Frontend-Part2.apk
            test -s package/Veltrix-Hom-Frontend-Part2-androidTest.apk
            test -s package/SHA256SUMS.txt
            test "$(find package/evidence/screens -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 29
            (cd package && sha256sum -c evidence/screens/screenshot-sha256.txt)
            (cd package && sha256sum -c SHA256SUMS.txt)
            test -s Veltrix-Hom-Frontend-Part2-EVIDENCE.zip
            unzip -tq Veltrix-Hom-Frontend-Part2-EVIDENCE.zip >/dev/null
            test "$(unzip -Z1 Veltrix-Hom-Frontend-Part2-EVIDENCE.zip | grep -Ec '^package/evidence/screens/[^/]+\.png$')" -eq 29
          else
            echo 'Final gate missing; preserving failure artifact.' >&2
            exit 1
          fi
      - name: Upload Part 2 final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-frontend-part2-${{ github.run_id }}
          path: |
            package/
            evidence/
            Veltrix-Hom-Frontend-Part2-EVIDENCE.zip
          if-no-files-found: error
          retention-days: 30
