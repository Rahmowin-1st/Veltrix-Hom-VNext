name: Veltrix Backend Final Closure Gate

on:
  pull_request:
    branches: [veltrix-hom-backend-final-closure]
  workflow_dispatch:

concurrency:
  group: veltrix-backend-final-closure-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  ACCEPTED_BACKEND_SHA: 4ed13cfcf7d4bb1fe6215b231426e0b4f208343a
  INTEGRATED_FRONTEND_SHA: e7a63faf96bccaa1856f4d4b34d52b81e42ea20a
  TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  IMAGE_PACKAGE: system-images;android-36;google_apis;x86_64
  GPU_MODE: swiftshader_indirect
  VELTRIX_ENV: test
  VELTRIX_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
  VELTRIX_DATABASE_USER: postgres
  VELTRIX_DATABASE_PASSWORD: postgres
  VELTRIX_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
  VELTRIX_TEST_DATABASE_USER: postgres
  VELTRIX_TEST_DATABASE_PASSWORD: postgres
  VELTRIX_AI_PROVIDER: disabled
  VELTRIX_TEST_AI_MOCK: 'true'
  VELTRIX_EMBEDDING_PROVIDER: disabled
  VELTRIX_TEST_EMBEDDING_MOCK: 'true'
  VELTRIX_EMBEDDING_DIMENSIONS: '64'
  VELTRIX_TEST_OCR_MOCK: 'true'
  VELTRIX_TEST_TRANSLATE_MOCK: 'true'
  VELTRIX_STORAGE_PROVIDER: local
  VELTRIX_WORKERS_ENABLED: 'true'
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android-avd

jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_DB: veltrix_vnext_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d veltrix_vnext_test"
          --health-interval 5s --health-timeout 5s --health-retries 30

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0

      - name: Exact provenance and delta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence package artifact
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$ACCEPTED_BACKEND_SHA" "$TESTED_SHA"
          git merge-base --is-ancestor "$INTEGRATED_FRONTEND_SHA" "$TESTED_SHA"
          git diff --name-only "$INTEGRATED_FRONTEND_SHA" "$TESTED_SHA" | sort | tee evidence/final-closure-delta.txt
          test -s evidence/final-closure-delta.txt
          ! grep -E '^android/|^core/|^build.gradle.kts$|^settings.gradle.kts$|^gradle.properties$' evidence/final-closure-delta.txt
          printf 'repo=%s\nbranch=%s\ncommit=%s\naccepted_backend=%s\nintegrated_frontend=%s\nrun=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_HEAD_REF" "$TESTED_SHA" "$ACCEPTED_BACKEND_SHA" "$INTEGRATED_FRONTEND_SHA" "$GITHUB_RUN_ID" | tee evidence/provenance.txt
          echo BACKEND_FINAL_PROVENANCE=PASS | tee evidence/provenance-gate.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Authoritative OpenAPI and stale-truth gate
        shell: bash
        run: |
          set -euo pipefail
          cp contracts/openapi.yaml /tmp/openapi.before
          python3 scripts/generate_openapi_contract.py | tee evidence/openapi-generate.txt
          cmp /tmp/openapi.before contracts/openapi.yaml
          python3 scripts/verify_openapi_drift.py | tee evidence/openapi-drift.txt
          grep -q 'OPENAPI_DRIFT=PASS' evidence/openapi-drift.txt
          grep -q '^  /auth/google:' contracts/openapi.yaml
          grep -q 'GoogleIdentityExchangeRequest' contracts/openapi.yaml
          ! grep -R --line-number -E 'Google auth.*(missing|deferred|placeholder)|Part 3 = Frontend|backend.*not complete' docs/backend-final-closure docs/FINAL_MANAGER_HANDOFF.md 2>/dev/null || exit 1
          echo BACKEND_FINAL_OPENAPI=PASS | tee evidence/openapi-gate.txt

      - name: Real PostgreSQL migrations tests regressions security
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d veltrix_vnext_test -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          gradle --no-daemon :core:test :server:test | tee evidence/backend-tests.txt
          grep -q 'BUILD SUCCESSFUL' evidence/backend-tests.txt
          bash scripts/run_local_regressions.sh | tee evidence/frozen-regressions.txt
          grep -q 'LOCAL_REGRESSION_GATE=PASS total=105' evidence/frozen-regressions.txt
          psql -h 127.0.0.1 -U postgres -d veltrix_vnext_test -Atc "SELECT script||':'||success FROM flyway_schema_history WHERE script IN ('V007__part3_final_capability_expansion.sql','V008__part3_final_depth.sql','V009__backend_final_identity.sql') ORDER BY installed_rank" | tee evidence/migrations.txt
          grep -q 'V009__backend_final_identity.sql:t' evidence/migrations.txt
          grep -q 'post("/auth/google")' server/src/main/kotlin/com/veltrix/hom/vnext/server/Main.kt
          grep -q 'GoogleIdTokenVerifier' server/src/main/kotlin/com/veltrix/hom/vnext/server/GoogleIdentity.kt
          grep -q 'payload.nonce' server/src/main/kotlin/com/veltrix/hom/vnext/server/GoogleIdentity.kt
          grep -q 'FOR UPDATE OF s' server/src/main/kotlin/com/veltrix/hom/vnext/server/Repositories.kt
          grep -q 'external_identity_deletion_tombstone' database/migrations/V009__backend_final_identity.sql
          ! grep -R --line-number -E 'println\(.*idToken|logger.*idToken|log.*idToken' server/src/main/kotlin
          ! git grep -nE 'sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- .env.example build.gradle.kts settings.gradle.kts gradle.properties server/src/main android/app/src/main database scripts contracts
          test -s server/src/test/resources/google-fixture/private-key-pkcs8.pem
          echo BACKEND_FINAL_POSTGRES_SECURITY=PASS | tee evidence/backend-security-gate.txt

      - name: Exact Ktor HTTP compatibility and performance
        shell: bash
        run: |
          set -euo pipefail
          nohup gradle --no-daemon :server:run > evidence/server.log 2>&1 &
          echo $! > evidence/server.pid
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:8080/ready > evidence/ready.json; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          grep -q '"ready":true' evidence/ready.json
          VELTRIX_API_BASE_URL=http://127.0.0.1:8080 python3 scripts/part2_http_runtime_smoke.py | tee evidence/part2-http-smoke.txt
          grep -q PART2_HTTP_RUNTIME_SMOKE=PASS evidence/part2-http-smoke.txt
          VELTRIX_API_BASE_URL=http://127.0.0.1:8080 python3 scripts/part3_http_runtime_smoke.py | tee evidence/part3-http-smoke.txt
          grep -q PART3_HTTP_RUNTIME_SMOKE=PASS evidence/part3-http-smoke.txt
          VELTRIX_API_BASE_URL=http://127.0.0.1:8080 python3 scripts/part2_performance_smoke.py | tee evidence/performance-smoke.txt
          grep -q PART2_PERFORMANCE_SMOKE=PASS evidence/performance-smoke.txt
          status=$(curl -sS -o evidence/google-disabled.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"idToken":"malformed-token-but-long-enough-1234567890","nonce":"nonce-long-enough-1234567890"}' http://127.0.0.1:8080/v1/auth/google)
          test "$status" = 503
          grep -q 'AUTH_GOOGLE_NOT_CONFIGURED' evidence/google-disabled.json
          echo BACKEND_FINAL_REAL_HTTP=PASS | tee evidence/http-gate.txt
          echo BACKEND_FINAL_PERFORMANCE=PASS | tee evidence/performance-gate.txt

      - name: Build exact Android artifacts
        uses: android-actions/setup-android@v3
      - name: Android compile/package compatibility
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'build-tools;37.0.0' 'platforms;android-37.0' "$IMAGE_PACKAGE"
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0
          gradle --no-daemon -PVELTRIX_API_BASE_URL=http://127.0.0.1:8080 :android:app:testDebugUnitTest :android:app:assembleDebug :android:app:assembleDebugAndroidTest | tee evidence/android-build.txt
          grep -q 'BUILD SUCCESSFUL' evidence/android-build.txt
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find android/app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f -size +0c | head -1)
          test -s "$APK"; test -s "$TEST_APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | tee evidence/apk-badging.txt
          grep -q "targetSdkVersion:'37'" evidence/apk-badging.txt
          sha256sum "$APK" "$TEST_APK" | tee evidence/apk-sha256.txt
          if unzip -p "$APK" 'classes*.dex' | strings | grep -E 'sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'; then
            echo 'Secret-like material detected in APK' >&2
            exit 1
          fi
          echo BACKEND_FINAL_APK_SECRET_SCAN=PASS | tee evidence/apk-secret-gate.txt
          echo BACKEND_FINAL_ANDROID_BUILD=PASS | tee evidence/android-build-gate.txt

      - name: Android16 API36 runtime and process-death
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/runtime
          cp .github/scripts/android-runtime-gate-v15.sh evidence/runtime/helper.sh
          sed -i \
            -e 's#APK="evidence/prior-v10/Veltrix-Hom-VNext-Part1-FINAL.apk"#APK="android/app/build/outputs/apk/debug/app-debug.apk"#' \
            -e 's#TEST_APK="evidence/prior-v10/Veltrix-Hom-VNext-Part1-ANDROID-TEST.apk"#TEST_APK="$(find android/app/build/outputs/apk/androidTest -name '\''*androidTest.apk'\'' -type f -size +0c | head -1)"#' \
            -e '/4a70f76e971ed11a58cd125da050bef23b61223aa148e353994b4912d69342da/d' \
            -e '/a6afe3978740c081edc8b1b1a4de785150cb1e16d8017a3a4e54ff32fe8fcd49/d' \
            -e 's/veltrix_v15_api37_/veltrix_backend_final_api36_/g' \
            -e 's/grep -Fx 17 evidence\/runtime\/android-release.txt/grep -Fx 16 evidence\/runtime\/android-release.txt/' \
            -e 's/grep -Fx 37 evidence\/runtime\/android-api.txt/grep -Fx 36 evidence\/runtime\/android-api.txt/' \
            -e 's/ -feature -Vulkan//g' \
            -e "s/'OK (6 tests)'/'OK ('/" \
            -e 's#echo "$state" | grep -q "$PKG"#grep -q "$PKG" "evidence/runtime/activity-${label}-${attempt}.txt" "evidence/runtime/window-${label}-${attempt}.txt"#' \
            -e "s@run_test shell 'OK (1 test)' 'com.veltrix.hom.vnext.ShellInstrumentedTest' 150@adb reverse --remove tcp:8080 >/dev/null 2>\&1 || true; adb reverse tcp:8080 tcp:8080; run_test shell 'OK (1 test)' 'com.veltrix.hom.vnext.RootResetRuntimeInstrumentedTest#serverValidatedSessionEntersFourWorldsBackReturnsHomeAndSignOutClosesWorld' 240@" \
            -e "s#run_test connected 'OK (' '' 360#run_test connected 'OK (' 'com.veltrix.hom.vnext.ServerIntegrationInstrumentedTest,com.veltrix.hom.vnext.Part2ServerIntegrationInstrumentedTest,com.veltrix.hom.vnext.Part3FinalStateInstrumentedTest,com.veltrix.hom.vnext.Part3ControlIntegrationInstrumentedTest' 420#" \
            evidence/runtime/helper.sh
          chmod +x evidence/runtime/helper.sh
          grep -q 'RootResetRuntimeInstrumentedTest#serverValidatedSessionEntersFourWorldsBackReturnsHomeAndSignOutClosesWorld' evidence/runtime/helper.sh
          grep -q 'Part3ControlIntegrationInstrumentedTest' evidence/runtime/helper.sh
          timeout 1100s bash evidence/runtime/helper.sh
          grep -q V15_ANDROID_RUNTIME_ALL=PASS evidence/runtime/runtime-all.txt
          grep -Fx 16 evidence/runtime/android-release.txt
          grep -Fx 36 evidence/runtime/android-api.txt
          export ANDROID_SERIAL=$(adb devices | awk 'NR>1 && $2=="device" {print $1; exit}')
          test -n "$ANDROID_SERIAL"
          I=$(adb shell pm list instrumentation 2>/dev/null | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.hom.vnext.dev.*/\1/p' | head -1 | tr -d '\r')
          test -n "$I"
          adb reverse --remove tcp:8080 >/dev/null 2>&1 || true
          adb reverse tcp:8080 tcp:8080
          timeout 150s adb shell am instrument -w -e class 'com.veltrix.hom.vnext.Part3ProcessDeathInstrumentedTest#aSeedPart3State' "$I" | tee evidence/process-seed.txt
          grep -q 'OK (1 test)' evidence/process-seed.txt
          adb shell am force-stop com.veltrix.hom.vnext.dev.test || true
          adb shell am force-stop com.veltrix.hom.vnext.dev || true
          sleep 2
          timeout 150s adb shell am instrument -w -e class 'com.veltrix.hom.vnext.Part3ProcessDeathInstrumentedTest#zVerifyPart3StateAfterFreshInstrumentationProcess' "$I" | tee evidence/process-verify.txt
          grep -q 'OK (1 test)' evidence/process-verify.txt
          timeout 300s adb shell am instrument -w -e class 'com.veltrix.hom.vnext.Part3FinalStateInstrumentedTest' "$I" | tee evidence/part3-instrumentation.txt
          grep -q 'OK (2 tests)' evidence/part3-instrumentation.txt
          echo BACKEND_FINAL_ANDROID_RUNTIME=PASS | tee evidence/android-runtime-gate.txt

      - name: Self red-team
        shell: bash
        run: |
          set -euo pipefail
          REDTEAM_TARGETS=(
            core/src/main
            server/src/main
            android/app/src/main
            database/migrations
            contracts
            .env.example
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
            server/build.gradle.kts
            android/app/build.gradle.kts
          )
          for target in "${REDTEAM_TARGETS[@]}"; do test -e "$target"; done
          git grep -nE 'TODO|FIXME|placeholder|fake API|fake citation|loot.?box|client-trusted XP|client-trusted Coins' -- "${REDTEAM_TARGETS[@]}" | tee evidence/red-team-findings.txt || true
          test ! -s evidence/red-team-findings.txt
          ! grep -R --line-number 'continue-on-error: true' .github/workflows/backend-final-closure-*.yml
          echo BACKEND_FINAL_RED_TEAM=PASS | tee evidence/red-team-gate.txt

      - name: Resolve numeric job id
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > evidence/jobs.json
          python3 - <<'PY' > evidence/job-id.txt
          import json
          d=json.load(open('evidence/jobs.json'))
          jobs=[j for j in d.get('jobs',[]) if j.get('name')=='final']
          assert len(jobs)==1, len(jobs)
          print(jobs[0]['id'])
          PY

      - name: Package exact source APKs docs evidence hashes
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find android/app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f -size +0c | head -1)
          git archive --format=zip --output=package/Veltrix-Hom-VNext-BACKEND-FINAL-EXACT-SOURCE.zip "$TESTED_SHA"
          cp "$APK" package/Veltrix-Hom-VNext-BACKEND-FINAL.apk
          cp "$TEST_APK" package/Veltrix-Hom-VNext-BACKEND-FINAL-ANDROID-TEST.apk
          cp contracts/openapi.yaml package/OPENAPI_FINAL.yaml
          cp -R docs/backend-final-closure package/backend-final-closure-docs
          cp -R database/migrations package/database-migrations
          cp -R evidence package/evidence
          JOB_ID=$(cat evidence/job-id.txt)
          printf 'repo=%s\nbranch=%s\ncommit=%s\naccepted_backend=%s\nintegrated_frontend=%s\nrun=%s\njob=%s\nandroid_runtime=Android-16-API36-google_apis-x86_64\ncompile_sdk=37\ntarget_sdk=37\n' "$GITHUB_REPOSITORY" "$GITHUB_HEAD_REF" "$TESTED_SHA" "$ACCEPTED_BACKEND_SHA" "$INTEGRATED_FRONTEND_SHA" "$GITHUB_RUN_ID" "$JOB_ID" > package/PROVENANCE.txt
          (cd package && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          sha256sum package/Veltrix-Hom-VNext-BACKEND-FINAL-EXACT-SOURCE.zip | tee evidence/source-sha256.txt
          sha256sum package/Veltrix-Hom-VNext-BACKEND-FINAL.apk | tee evidence/final-apk-sha256.txt
          sha256sum package/Veltrix-Hom-VNext-BACKEND-FINAL-ANDROID-TEST.apk | tee evidence/final-test-apk-sha256.txt
          (cd package && zip -qr ../artifact/Veltrix-Hom-VNext-BACKEND-FINAL-CLOSURE.zip .)
          sha256sum artifact/Veltrix-Hom-VNext-BACKEND-FINAL-CLOSURE.zip | tee evidence/package-sha256.txt
          cp evidence/*.txt artifact/ 2>/dev/null || true
          echo BACKEND_FINAL_PACKAGE=PASS | tee artifact/FINAL_STATUS.txt

      - name: Upload canonical final artifact
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-hom-backend-final-closure-${{ github.run_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
