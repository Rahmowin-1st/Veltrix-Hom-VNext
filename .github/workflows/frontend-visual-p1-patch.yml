name: Veltrix Frontend Visual P1 Patch

on:
  push:
    branches: [veltrix-hom-frontend-final-closure]
    paths: ['.github/workflows/frontend-visual-p1-patch.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify exact patch parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a61c00c1c4d0f674bb3beea47faf6bf9c30c12b2"
      - name: Apply fail-closed frontend visual fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')

          def replace_once(path, old, new):
              p = root / path
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"required pattern missing in {path}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1))

          path='android/app/src/main/kotlin/com/veltrix/hom/vnext/RootResetShell.kt'
          replace_once(path, 'import androidx.compose.ui.platform.LocalContext\n', 'import androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.platform.LocalDensity\n')
          replace_once(path, '    val itemWidth = 76.dp\n    val index = VeltrixWorld.entries.indexOf(selectedWorld).coerceAtLeast(0)\n', '    val itemWidth = 76.dp\n    val largeText = LocalDensity.current.fontScale >= 1.5f\n    val index = VeltrixWorld.entries.indexOf(selectedWorld).coerceAtLeast(0)\n')
          replace_once(path, '''                            .testTag("world-${item.name}")\n                            .semantics { this.selected = selected; role = Role.Tab },''', '''                            .testTag("world-${item.name}")\n                            .semantics {\n                                this.selected = selected\n                                role = Role.Tab\n                                contentDescription = "${item.name.lowercase().replaceFirstChar { it.uppercase() }} world"\n                            },''')
          replace_once(path, '                        Box(Modifier.size(18.dp), contentAlignment = Alignment.Center) {', '                        Box(Modifier.size(if (largeText) 24.dp else 18.dp), contentAlignment = Alignment.Center) {')
          replace_once(path, '''                        Text(\n                            item.name.lowercase().replaceFirstChar { it.uppercase() },\n                            color = if (selected) KineticColor.Ink else KineticColor.Muted,\n                            style = androidx.compose.material3.MaterialTheme.typography.labelSmall,\n                            fontWeight = if (selected) FontWeight.SemiBold else FontWeight.Normal,\n                        )''', '''                        if (!largeText) {\n                            Text(\n                                item.name.lowercase().replaceFirstChar { it.uppercase() },\n                                modifier = Modifier.testTag("world-label-${item.name}"),\n                                color = if (selected) KineticColor.Ink else KineticColor.Muted,\n                                style = androidx.compose.material3.MaterialTheme.typography.labelSmall,\n                                fontWeight = if (selected) FontWeight.SemiBold else FontWeight.Normal,\n                            )\n                        }''')

          replace_once('android/app/src/main/kotlin/com/veltrix/hom/vnext/RootPersonalStage50.kt', 'Row(Modifier.fillMaxWidth().height(56.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(10.dp)) {', 'Row(Modifier.fillMaxWidth().heightIn(min = 56.dp).testTag("personal-header"), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(10.dp)) {')
          replace_once('android/app/src/main/kotlin/com/veltrix/hom/vnext/RootPersonalStage50.kt', 'Text("WHO YOU\\'RE BECOMING", color = KineticColor.Muted, style = MaterialTheme.typography.labelSmall)', 'Text("WHO YOU\\'RE BECOMING", modifier = Modifier.testTag("personal-header-subtitle"), color = KineticColor.Muted, style = MaterialTheme.typography.labelSmall)')
          replace_once('android/app/src/main/kotlin/com/veltrix/hom/vnext/RootStoreStage70.kt', 'Row(Modifier.fillMaxWidth().height(56.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(10.dp)) {', 'Row(Modifier.fillMaxWidth().heightIn(min = 56.dp).testTag("store-header"), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(10.dp)) {')
          replace_once('android/app/src/main/kotlin/com/veltrix/hom/vnext/RootProjectsStage60.kt', 'Row(Modifier.fillMaxWidth().height(56.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(10.dp)) {', 'Row(Modifier.fillMaxWidth().heightIn(min = 56.dp).testTag("projects-header"), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(10.dp)) {')

          path='android/app/src/main/kotlin/com/veltrix/hom/vnext/RootResetAuth.kt'
          replace_once(path, 'import androidx.compose.ui.platform.LocalContext\n', 'import androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.platform.LocalDensity\n')
          replace_once(path, 'Text("Restoring your world", color = RootInk, style = MaterialTheme.typography.headlineMedium, fontWeight = FontWeight.SemiBold)', 'Text("Restoring your world", modifier = Modifier.testTag("auth-bootstrap-title"), color = RootInk, style = MaterialTheme.typography.headlineMedium, fontWeight = FontWeight.SemiBold)')
          replace_once(path, '    val scope = rememberCoroutineScope()\n    var login by rememberSaveable', '    val scope = rememberCoroutineScope()\n    val largeText = LocalDensity.current.fontScale >= 1.5f\n    var login by rememberSaveable')
          replace_once(path, 'modifier = Modifier.fillMaxWidth().height(56.dp).testTag("continue-google"),', 'modifier = Modifier.fillMaxWidth().heightIn(min = if (largeText) 76.dp else 56.dp).testTag("continue-google"),')
          replace_once(path, '''                            Spacer(Modifier.width(10.dp))\n                            Text("Continue with Google", color = RootInk, fontWeight = FontWeight.SemiBold)\n                            Spacer(Modifier.weight(1f))\n                            Text("→", color = RootSky, fontWeight = FontWeight.Bold)''', '''                            Spacer(Modifier.width(10.dp))\n                            Text(\n                                "Continue with Google",\n                                modifier = Modifier.weight(1f).testTag("continue-google-label"),\n                                color = RootInk,\n                                fontWeight = FontWeight.SemiBold,\n                                maxLines = if (largeText) 2 else 1,\n                            )\n                            if (!largeText) Text("→", color = RootSky, fontWeight = FontWeight.Bold)''')

          path='android/app/src/main/kotlin/com/veltrix/hom/vnext/RootStoreStage70.kt'
          replace_once(path, 'contentDescription = "Preview ${avatarDisplayName70(avatar)}, ${avatar.tier} tier, ${if (avatar.equipped) "equipped" else if (avatar.owned) "owned" else "not owned"}"', 'contentDescription = "Preview ${avatarDisplayName70(avatar)}, ${avatarTierLabel70(avatar.tier)} tier, ${if (avatar.equipped) "equipped" else if (avatar.owned) "owned" else "not owned"}"')
          replace_once(path, 'Text(tier.lowercase().replaceFirstChar(Char::uppercase), Modifier.padding(horizontal = 10.dp, vertical = 7.dp), color = KineticColor.Muted, style = MaterialTheme.typography.labelSmall)', 'Text(avatarTierLabel70(tier), Modifier.padding(horizontal = 10.dp, vertical = 7.dp).testTag("store-tier-label"), color = KineticColor.Muted, style = MaterialTheme.typography.labelSmall)')
          replace_once(path, '''internal fun avatarDisplayName70(avatar: AvatarCatalogUiModel): String {\n    val raw = avatar.name.trim()\n    val skuLike = Regex("^(noob|pro|elite|super|ultra|max|hyperpro|legendary)[ _-]*\\\\d{2,}$", RegexOption.IGNORE_CASE)\n    return when {\n        raw.isBlank() -> "${friendlyType70(avatar.tier)} identity"\n        skuLike.matches(raw) -> "${friendlyType70(avatar.tier)} identity"\n        raw.equals(avatar.avatarId, ignoreCase = true) -> "${friendlyType70(avatar.tier)} identity"\n        else -> raw\n    }\n}\n\nprivate fun friendlyType70(raw: String): String = raw\n    .lowercase()\n    .replace('_', ' ')\n    .split(' ')\n    .joinToString(" ") { it.replaceFirstChar { c -> c.uppercase() } }''', '''internal fun avatarDisplayName70(avatar: AvatarCatalogUiModel): String {\n    val raw = avatar.name.trim()\n    val internalLike = raw.isBlank() ||\n        raw.equals(avatar.avatarId, ignoreCase = true) ||\n        Regex("^(noob|pro|elite|super|ultra|max|hyperpro|legendary)([ _-]+(default|avatar|identity|\\\\d+))?$", RegexOption.IGNORE_CASE).matches(raw)\n    return if (internalLike) avatarFamilyName70(avatar.avatarId) else raw\n}\n\ninternal fun avatarTierLabel70(raw: String): String = when (raw.trim().lowercase()) {\n    "noob", "default", "core" -> "Starter"\n    else -> friendlyType70(raw)\n}\n\nprivate fun avatarFamilyName70(avatarId: String): String {\n    val family = (avatarId.hashCode() and Int.MAX_VALUE) % 5\n    return listOf("Prism", "Sentinel", "Bloom", "Comet", "Atlas")[family]\n}\n\nprivate fun friendlyType70(raw: String): String = raw\n    .lowercase()\n    .replace('_', ' ')\n    .split(' ')\n    .filter { it.isNotBlank() }\n    .joinToString(" ") { it.replaceFirstChar { c -> c.uppercase() } }''')

          path='android/app/src/androidTest/kotlin/com/veltrix/hom/vnext/RootStage90InstrumentedTest.kt'
          replace_once(path, '            compose.onNodeWithTag("world-PERSONAL").assertIsDisplayed()\n            capture("font200-home")', '            compose.onNodeWithTag("world-PERSONAL").assertIsDisplayed()\n            assertLargeTextPrimaryNav()\n            capture("font200-home")')
          replace_once(path, '            compose.onNodeWithTag("personal-identity").assertIsDisplayed()\n            assertPersonalSignalLayout()', '            compose.onNodeWithTag("personal-identity").assertIsDisplayed()\n            assertPersonalHeaderFits()\n            assertPersonalSignalLayout()\n            assertLargeTextPrimaryNav()')
          replace_once(path, '            compose.onNodeWithTag("auth-submit").performScrollTo().assertIsDisplayed()\n            capture("font200-auth")', '            compose.onNodeWithTag("auth-submit").performScrollTo().assertIsDisplayed()\n            assertMinTouchTarget("continue-google", 72f)\n            compose.onNodeWithTag("continue-google-label").assertIsDisplayed()\n            capture("font200-auth")')
          replace_once(path, '        val forbidden = listOf("minLevel", "requirements", "identityMetadataJson")', '        val forbidden = listOf("minLevel", "requirements", "identityMetadataJson", "noob default", "noob identity", "noob tier")')
          replace_once(path, '    private fun assertPersonalSignalLayout(minDp: Float = 220f) {', '''    private fun assertLargeTextPrimaryNav() {\n        listOf("HOME", "PERSONAL", "STORE", "PROJECTS").forEach { world ->\n            assertMinTouchTarget("world-$world")\n            val labels = compose.onAllNodesWithTag("world-label-$world").fetchSemanticsNodes()\n            assertTrue("200% font must switch $world to icon-first navigation instead of colliding text", labels.isEmpty())\n        }\n    }\n\n    private fun assertPersonalHeaderFits() {\n        val density = targetContext.resources.displayMetrics.density\n        val header = compose.onNodeWithTag("personal-header").fetchSemanticsNode().boundsInRoot\n        val subtitle = compose.onNodeWithTag("personal-header-subtitle").fetchSemanticsNode().boundsInRoot\n        assertTrue("Personal subtitle must stay fully inside its adaptive header at 200% font", subtitle.bottom <= header.bottom + density && subtitle.top >= header.top - density)\n        assertTrue("Personal subtitle must retain visible height at 200% font", subtitle.height / density >= 18f)\n    }\n\n    private fun assertPersonalSignalLayout(minDp: Float = 220f) {''')

          path='android/app/src/androidTest/kotlin/com/veltrix/hom/vnext/FrontendFinalAuthInstrumentedTest.kt'
          replace_once(path, 'import androidx.compose.ui.test.onAllNodesWithTag\n', 'import androidx.compose.ui.test.onAllNodesWithTag\nimport androidx.compose.ui.test.onAllNodesWithText\n')
          replace_once(path, '            assertNoTag("home-stage40")\n            capture("auth-signed-out")', '            assertNoTag("home-stage40")\n            awaitTextAbsent("Restoring your world", 10_000L)\n            capture("auth-signed-out", settleMillis = 800L)')
          replace_once(path, '            assertNoTag("home-stage40")\n            capture("signout-auth")', '            assertNoTag("home-stage40")\n            awaitTextAbsent("Restoring your world", 10_000L)\n            capture("signout-auth", settleMillis = 800L)')
          replace_once(path, '            assertNoTag("home-stage40")\n            capture("auth-relaunch-signed-out")', '            assertNoTag("home-stage40")\n            awaitTextAbsent("Restoring your world", 10_000L)\n            capture("auth-relaunch-signed-out", settleMillis = 800L)')
          replace_once(path, '''    private fun capture(name: String) {\n        instrumentation.waitForIdleSync()\n        SystemClock.sleep(220)''', '''    private fun awaitTextAbsent(text: String, timeoutMillis: Long) {\n        compose.waitUntil(timeoutMillis) { compose.onAllNodesWithText(text, substring = false).fetchSemanticsNodes().isEmpty() }\n    }\n\n    private fun capture(name: String, settleMillis: Long = 220L) {\n        instrumentation.waitForIdleSync()\n        SystemClock.sleep(settleMillis)''')

          unit = root / 'android/app/src/test/kotlin/com/veltrix/hom/vnext/StorePresentationUnitTest.kt'
          if unit.exists():
              raise SystemExit('StorePresentationUnitTest.kt unexpectedly exists')
          unit.write_text('''package com.veltrix.hom.vnext\n\nimport org.junit.Assert.assertEquals\nimport org.junit.Assert.assertFalse\nimport org.junit.Test\n\nclass StorePresentationUnitTest {\n    private fun avatar(name: String, id: String = "noob-default-01", tier: String = "NOOB") = AvatarCatalogUiModel(\n        avatarId = id, name = name, assetKey = "avatar/$id", tier = tier, owned = true, equipped = true,\n        storePrice = null, catalogVersion = "test", identityMetadata = "{}",\n    )\n\n    @Test fun internalCatalogNameFallsBackToVeltrixFamilyName() {\n        val shown = avatarDisplayName70(avatar("Noob Default"))\n        assertFalse(shown.contains("noob", ignoreCase = true))\n        assertFalse(shown.contains("default", ignoreCase = true))\n        assertFalse(shown.contains("identity", ignoreCase = true))\n    }\n\n    @Test fun userFacingCatalogNameIsPreserved() {\n        assertEquals("Aurora", avatarDisplayName70(avatar("Aurora", id = "avatar-aurora", tier = "ELITE")))\n    }\n\n    @Test fun internalNoobTierUsesStarterPresentationLabel() {\n        assertEquals("Starter", avatarTierLabel70("NOOB"))\n    }\n}\n''')
          PY
          rm .github/workflows/frontend-visual-p1-patch.yml
          git diff --check
          grep -Fq 'val largeText = LocalDensity.current.fontScale >= 1.5f' android/app/src/main/kotlin/com/veltrix/hom/vnext/RootResetShell.kt
          grep -Fq 'avatarTierLabel70' android/app/src/main/kotlin/com/veltrix/hom/vnext/RootStoreStage70.kt
          test -s android/app/src/test/kotlin/com/veltrix/hom/vnext/StorePresentationUnitTest.kt
      - name: Commit exact frontend patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Veltrix Frontend Master'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(frontend): close manual visual P1 defects'
          git push origin HEAD:veltrix-hom-frontend-final-closure
