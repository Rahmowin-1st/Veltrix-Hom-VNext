name: Veltrix Part 1 Current Product API35 Final

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-product-api35-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_DB: veltrix_vnext_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veltrix_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PRODUCT_SHA: 4e19f719688235b868add5a40f611b77ad909c96
      VELTRIX_ENV: test
      VELTRIX_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
      VELTRIX_DATABASE_USER: postgres
      VELTRIX_DATABASE_PASSWORD: postgres
      VELTRIX_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
      VELTRIX_TEST_DATABASE_USER: postgres
      VELTRIX_TEST_DATABASE_PASSWORD: postgres
      VELTRIX_AI_PROVIDER: disabled
      VELTRIX_TEST_AI_MOCK: "true"
      VELTRIX_EMBEDDING_PROVIDER: disabled
      VELTRIX_TEST_EMBEDDING_MOCK: "true"
      VELTRIX_EMBEDDING_DIMENSIONS: "64"
      VELTRIX_TEST_OCR_MOCK: "true"
      VELTRIX_TEST_TRANSLATE_MOCK: "true"
      VELTRIX_STORAGE_PROVIDER: local
      VELTRIX_WORKERS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Record exact product source and seal source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p final-evidence final-package
          git rev-parse HEAD | tee final-evidence/product-commit.txt
          git archive --format=zip --output=final-package/Veltrix-Hom-VNext-Part1-EXACT-TESTED-SOURCE.zip HEAD
          sha256sum final-package/Veltrix-Hom-VNext-Part1-EXACT-TESTED-SOURCE.zip | tee final-evidence/source-zip-sha256.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - uses: android-actions/setup-android@v3

      - name: Install compile SDK 37 and stable Android 15 API35 image
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo ANDROID_RUNTIME_API35_NORMAL_SYSTEM_IMAGE=PASS | tee final-evidence/runtime-environment.txt

      - name: Start PostgreSQL pgvector and Ktor
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d veltrix_vnext_test -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          nohup gradle --no-daemon :server:run > final-evidence/server-run.txt 2>&1 &
          echo $! > final-evidence/server.pid
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:8080/health > final-evidence/health.json; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          grep -q '"status":"ok"' final-evidence/health.json
          echo CURRENT_PRODUCT_REAL_SERVER=PASS | tee final-evidence/server-gate.txt

      - name: Compile core server APK and instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :core:test :server:test :android:app:assembleDebug :android:app:assembleDebugAndroidTest | tee final-evidence/build-and-tests.txt
          grep -q 'BUILD SUCCESSFUL' final-evidence/build-and-tests.txt
          APP=android/app/build/outputs/apk/debug/app-debug.apk
          TEST=android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s "$APP" && test -s "$TEST"
          sha256sum "$APP" | tee final-evidence/app-apk-sha256.txt
          sha256sum "$TEST" | tee final-evidence/test-apk-sha256.txt
          cp "$APP" final-package/Veltrix-Hom-VNext-Part1-FINAL.apk
          cp "$TEST" final-package/Veltrix-Hom-VNext-Part1-ANDROID-TEST.apk

      - name: Execute normal Android runtime offline process-death reconnect and instrumentation
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            PKG=com.veltrix.hom.vnext.dev
            APP=android/app/build/outputs/apk/debug/app-debug.apk
            TEST=android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p final-evidence/runtime
            adb devices -l | tee final-evidence/runtime/adb.txt
            API=$(adb shell getprop ro.build.version.sdk | tr -d '\r')
            test "$API" = 35
            echo "$API" | tee final-evidence/runtime/device-api.txt
            SYS=$(adb shell pidof system_server | tr -d '\r')
            SF=$(adb shell pidof surfaceflinger | tr -d '\r')
            UI=$(adb shell pidof com.android.systemui | tr -d '\r')
            test -n "$SYS" && test -n "$SF" && test -n "$UI"
            adb shell pm list packages -d | tr -d '\r' | grep -q '^package:com.android.systemui$' && exit 1 || true
            printf 'system_server=%s\nsurfaceflinger=%s\nsystemui=%s\nNORMAL_ESSENTIAL_SYSTEM_SERVICES=PASS\n' "$SYS" "$SF" "$UI" | tee final-evidence/runtime/normal-system-services.txt
            adb install -r -t "$APP" | tee final-evidence/runtime/install-app.txt
            grep -q Success final-evidence/runtime/install-app.txt
            adb install -r -t "$TEST" | tee final-evidence/runtime/install-test.txt
            grep -q Success final-evidence/runtime/install-test.txt
            I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.hom.vnext.dev.*/\1/p' | head -1 | tr -d '\r')
            test -n "$I"
            echo "$I" | tee final-evidence/runtime/instrumentation.txt
            RES=$(adb shell cmd package resolve-activity --brief --user 0 -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p "$PKG" | tr -d '\r')
            echo "$RES" | tee final-evidence/runtime/resolve.txt
            echo "$RES" | grep -q 'com.veltrix.hom.vnext.dev/com.veltrix.hom.vnext.MainActivity'
            adb shell am force-stop "$PKG"
            adb shell am start -W -n "$RES" | tee final-evidence/runtime/cold-launch.txt
            grep -q 'Status: ok' final-evidence/runtime/cold-launch.txt
            adb reverse tcp:8080 tcp:8080
            adb reverse --list | tee final-evidence/runtime/adb-reverse.txt
            adb shell am instrument -w -e class com.veltrix.hom.vnext.ShellInstrumentedTest "$I" | tee final-evidence/runtime/shell-test.txt
            grep -q 'OK (1 test)' final-evidence/runtime/shell-test.txt
            adb shell am instrument -w -e class com.veltrix.hom.vnext.ServerIntegrationInstrumentedTest "$I" | tee final-evidence/runtime/server-device-test.txt
            grep -q 'OK (1 test)' final-evidence/runtime/server-device-test.txt
            adb shell am instrument -w -e class 'com.veltrix.hom.vnext.PersistenceInstrumentedTest#aSeedProjectForProcessRestart' "$I" | tee final-evidence/runtime/process-seed.txt
            grep -q 'OK (1 test)' final-evidence/runtime/process-seed.txt
            adb shell am force-stop "$PKG"
            test -z "$(adb shell pidof "$PKG" 2>/dev/null || true)"
            adb shell am instrument -w -e class 'com.veltrix.hom.vnext.PersistenceInstrumentedTest#zVerifyProjectAfterProcessRestart' "$I" | tee final-evidence/runtime/process-verify.txt
            grep -q 'OK (1 test)' final-evidence/runtime/process-verify.txt
            echo PROCESS_DEATH_PERSISTENCE=PASS | tee final-evidence/runtime/process-death-gate.txt
            adb shell cmd connectivity airplane-mode enable || adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable || true
            sleep 3
            test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = 1
            adb shell am instrument -w -e class 'com.veltrix.hom.vnext.OfflineDataInstrumentedTest#aSeedOfflineDurableState' "$I" | tee final-evidence/runtime/offline-seed.txt
            grep -q 'OK (1 test)' final-evidence/runtime/offline-seed.txt
            adb shell am force-stop "$PKG"
            adb shell am instrument -w -e class 'com.veltrix.hom.vnext.OfflineDataInstrumentedTest#zVerifyOfflineDurableStateAfterProcessRestart' "$I" | tee final-evidence/runtime/offline-verify.txt
            grep -q 'OK (1 test)' final-evidence/runtime/offline-verify.txt
            echo OFFLINE_PROCESS_RESTART=PASS | tee final-evidence/runtime/offline-gate.txt
            adb shell cmd connectivity airplane-mode disable || adb shell settings put global airplane_mode_on 0
            adb shell svc wifi enable || true
            sleep 5
            adb reverse tcp:8080 tcp:8080
            adb shell am instrument -w -e class com.veltrix.hom.vnext.ServerIntegrationInstrumentedTest "$I" | tee final-evidence/runtime/reconnect-test.txt
            grep -q 'OK (1 test)' final-evidence/runtime/reconnect-test.txt
            grep -q 'IDEMPOTENT_REPLAY' final-evidence/server-run.txt || true
            echo RECONNECT_AND_IDEMPOTENT_SERVER_FLOW=PASS | tee final-evidence/runtime/reconnect-gate.txt
            adb shell pm clear "$PKG" | tee final-evidence/runtime/pm-clear.txt
            grep -q Success final-evidence/runtime/pm-clear.txt
            adb install -r -t "$APP" >/dev/null
            adb install -r -t "$TEST" >/dev/null
            I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.hom.vnext.dev.*/\1/p' | head -1 | tr -d '\r')
            adb reverse tcp:8080 tcp:8080
            adb shell am instrument -w "$I" | tee final-evidence/runtime/all-instrumentation.txt
            grep -q 'OK (6 tests)' final-evidence/runtime/all-instrumentation.txt
            gradle --no-daemon --stacktrace :android:app:connectedDebugAndroidTest | tee final-evidence/runtime/connected-gradle.txt
            grep -q 'BUILD SUCCESSFUL' final-evidence/runtime/connected-gradle.txt
            adb install -r -t "$APP" | tee final-evidence/runtime/reinstall.txt
            grep -q Success final-evidence/runtime/reinstall.txt
            adb shell am force-stop "$PKG"
            adb shell am start -W -n com.veltrix.hom.vnext.dev/com.veltrix.hom.vnext.MainActivity | tee final-evidence/runtime/final-launch.txt
            grep -q 'Status: ok' final-evidence/runtime/final-launch.txt
            echo CURRENT_PRODUCT_API35_ANDROID_RUNTIME_ALL=PASS | tee final-evidence/runtime/runtime-all.txt

      - name: Final package hashes and provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-package/evidence
          cp -a final-evidence/. final-package/evidence/ 2>/dev/null || true
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "mission_branch=veltrix-hom-part1-completion"
            echo "exact_product_sha=${PRODUCT_SHA}"
            echo "controller_sha=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runtime=Android_15_API_35_google_apis_x86_64_normal_system_services"
          } | tee final-package/PROVENANCE.txt
          (cd final-package && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veltrix-hom-part1-current-product-api35-final-${{ github.run_id }}
          path: final-package/
          if-no-files-found: error
          retention-days: 30
