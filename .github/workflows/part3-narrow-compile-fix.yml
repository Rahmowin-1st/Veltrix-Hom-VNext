name: Part 3 Narrow Compile Fix

on:
  push:
    branches: [veltrix-hom-frontend-part3-final]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply compile and hygiene repair') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed narrow repair
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .frontend-part3-fix/compile-hygiene.patch.gz.b64 | gunzip > /tmp/part3-fix.patch
          echo 'ee8f45fe040a610ab9cf7f29319b92c851e6ee78ec74238423b90c8ec9081f44  /tmp/part3-fix.patch' | sha256sum -c -
          git apply --check /tmp/part3-fix.patch
          git apply /tmp/part3-fix.patch
          rm -rf .frontend-part3-fix
          git diff --check
          grep -q 'fun MistakesWorldScreen' android/app/src/main/kotlin/com/veltrix/hom/vnext/Part2WorldScreens.kt
          grep -q 'import androidx.compose.foundation.verticalScroll' android/app/src/main/kotlin/com/veltrix/hom/vnext/Part2WorldScreens.kt
          ! grep -Rqs 'TransitionalStoreScreen\|CapabilityBridgeScreen' android/app/src/main/kotlin/com/veltrix/hom/vnext
      - name: Persist narrow source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VELTRIX FRONTEND MASTER'
          git config user.email 'frontend-master@users.noreply.github.com'
          git add -A
          git commit -m 'fix(frontend): apply compile and hygiene repair'
          git push origin HEAD:${{ github.ref_name }}
