# retry v3 after producer and aggregator hunk repairs
name: Part 2 One-Time Integration Apply

on:
  push:
    branches: [veltrix-hom-part2-backend]
    paths: ['.github/workflows/part2-integration-apply-once.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veltrix-hom-part2-backend
          fetch-depth: 0
      - name: Fetch transfer material
        run: git fetch origin veltrix-part2-transfer:refs/remotes/origin/veltrix-part2-transfer
      - name: Apply exact integration patches
        run: |
          set -euo pipefail
          for n in 01-api-dtos 02-chat-notes 03-learning-events 04-main 05-part1-producers 06-aggregators; do
            git show "origin/veltrix-part2-transfer:tools/part2-patches/${n}.patch" > "/tmp/${n}.patch"
            git apply --check "/tmp/${n}.patch"
            git apply "/tmp/${n}.patch"
          done
          mkdir -p server/src/main/kotlin/com/veltrix/hom/vnext/server
          git show origin/veltrix-part2-transfer:server/src/main/kotlin/com/veltrix/hom/vnext/server/Part2ExtraDtos.kt > server/src/main/kotlin/com/veltrix/hom/vnext/server/Part2ExtraDtos.kt
          git diff --check
      - name: Persist cohesive integration
        run: |
          git config user.name 'Veltrix Backend CI'
          git config user.email 'actions@users.noreply.github.com'
          git add server/src/main/kotlin/com/veltrix/hom/vnext/server/ApiDtos.kt \
                  server/src/main/kotlin/com/veltrix/hom/vnext/server/ChatNotesRepositories.kt \
                  server/src/main/kotlin/com/veltrix/hom/vnext/server/LearningRepositories.kt \
                  server/src/main/kotlin/com/veltrix/hom/vnext/server/Main.kt \
                  server/src/main/kotlin/com/veltrix/hom/vnext/server/Repositories.kt \
                  server/src/main/kotlin/com/veltrix/hom/vnext/server/SearchAggregators.kt \
                  server/src/main/kotlin/com/veltrix/hom/vnext/server/TimelinePersonalRepositories.kt \
                  server/src/main/kotlin/com/veltrix/hom/vnext/server/Part2ExtraDtos.kt
          git commit -m 'feat(part2): connect Part 1 events and game APIs'
          git push origin HEAD:veltrix-hom-part2-backend
