name: Veltrix Backend Part 3 Source Audit

on:
  push:
    branches: [veltrix-hom-backend-part3-final, veltrix-hom-backend-final-closure]

permissions:
  contents: write

env:
  INTEGRATED_FRONTEND_SHA: e7a63faf96bccaa1856f4d4b34d52b81e42ea20a

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veltrix-hom-backend-final-closure
          fetch-depth: 0
      - name: Apply final closure payload from verified integrated source
        if: github.ref_name == 'veltrix-hom-backend-final-closure'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$INTEGRATED_FRONTEND_SHA" HEAD
          python3 scripts/apply_backend_final_closure_bootstrap.py
          git checkout "$INTEGRATED_FRONTEND_SHA" -- .github/workflows/part3-source-audit.yml
          git diff --check
          git config user.name veltrix-backend-master
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'feat(backend): close final auth account security contracts'
          git push origin HEAD:veltrix-hom-backend-final-closure
          echo BACKEND_FINAL_CLOSURE_APPLY_PUSH=PASS
