name: Veltrix Part 2 Manager Acceptance

on:
  push:
    branches: [veltrix-hom-part2-backend]
  workflow_dispatch:

concurrency:
  group: veltrix-part2-manager-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  FROZEN_PART1_SHA: fe4b2528a0a7da550351d926d44cc025e49dcafc
  BASE_RUNTIME_SHA: 2e70908f65bb25d23e87a9ddc690b8ea09f3040e
  BASE_RUNTIME_RUN: '31787591097'
  BASE_RUNTIME_JOB: '94726891516'
  BASE_RUNTIME_ARTIFACT_ID: '9214376255'
  BASE_OUTER_ARTIFACT_SHA256: e2653025a38e8b93f66db57f235497b7488a450f0238243108131642f5a5b149
  BASE_INNER_PACKAGE_SHA256: d142dd2ebf65c6261aa17d6cd8324be53528d19450c0ccbddc7f8c5042fa4105
  BASE_APK_SHA256: 7d96d35c17189f150d2e653517481c0cba0221ecb79ab8961e98c1b64a579414
  BASE_ANDROID_TEST_SHA256: 4ebca8778aa658380e1ea3e13d41e15bf1130973a719556b69e6c828fdb02eba
  VELTRIX_ENV: test
  VELTRIX_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
  VELTRIX_DATABASE_USER: postgres
  VELTRIX_DATABASE_PASSWORD: postgres
  VELTRIX_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
  VELTRIX_TEST_DATABASE_USER: postgres
  VELTRIX_TEST_DATABASE_PASSWORD: postgres
  VELTRIX_AI_PROVIDER: disabled
  VELTRIX_TEST_AI_MOCK: 'true'
  VELTRIX_EMBEDDING_PROVIDER: disabled
  VELTRIX_TEST_EMBEDDING_MOCK: 'true'
  VELTRIX_EMBEDDING_DIMENSIONS: '64'
  VELTRIX_TEST_OCR_MOCK: 'true'
  VELTRIX_TEST_TRANSLATE_MOCK: 'true'
  VELTRIX_STORAGE_PROVIDER: local
  VELTRIX_WORKERS_ENABLED: 'true'

jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_DB: veltrix_vnext_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d veltrix_vnext_test"
          --health-interval 5s --health-timeout 5s --health-retries 30

    steps:
      - name: Checkout exact Manager-acceptance source
        uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Prove provenance and unchanged Android runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence package artifact prior-artifact prior-package
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git cat-file -e "$FROZEN_PART1_SHA^{commit}"
          git cat-file -e "$BASE_RUNTIME_SHA^{commit}"
          git merge-base --is-ancestor "$FROZEN_PART1_SHA" "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_RUNTIME_SHA" "$GITHUB_SHA"
          git diff --quiet "$BASE_RUNTIME_SHA" "$GITHUB_SHA" -- android core build.gradle.kts settings.gradle.kts gradle.properties
          git diff --name-only "$BASE_RUNTIME_SHA" "$GITHUB_SHA" | sort | tee evidence/manager-acceptance-delta.txt
          test -s evidence/manager-acceptance-delta.txt
          printf 'repo=%s\nbranch=%s\ncommit=%s\nmanager_base=%s\nfrozen_part1=%s\nrun=%s\njob_name=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$BASE_RUNTIME_SHA" "$FROZEN_PART1_SHA" "$GITHUB_RUN_ID" "$GITHUB_JOB" | tee evidence/provenance.txt
          echo PART2_ANDROID_RUNTIME_INPUTS_UNCHANGED=PASS | tee evidence/android-runtime-reuse-boundary.txt
          echo PART2_PROVENANCE=PASS | tee evidence/provenance-gate.txt

      - name: Setup Java and Gradle
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.5.1'}

      - name: Verify handoff docs, generated OpenAPI, policy and stale truth
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_openapi_contract.py | tee evidence/openapi-generate.txt
          cp contracts/openapi.yaml docs/API_Contract.openapi.yaml
          python3 scripts/verify_part2_manager_handoff.py | tee evidence/handoff-completeness.txt
          python3 scripts/verify_openapi_drift.py | tee evidence/openapi-drift.txt
          python3 scripts/part2_progression_simulation.py --check docs/progression-policy-v1.json | tee evidence/progression-policy.txt
          python3 scripts/check_part1_structure.py | tee evidence/part1-structure.txt
          grep -q PART2_MANAGER_HANDOFF_CHECK=PASS evidence/handoff-completeness.txt
          grep -q OPENAPI_DRIFT=PASS evidence/openapi-drift.txt
          grep -q PART2_PROGRESSION_POLICY_CHECK=PASS evidence/progression-policy.txt
          echo PART2_DOCS_AND_CONTRACTS=PASS | tee evidence/docs-contracts-gate.txt

      - name: Run affected core/server and Manager E2E on real PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :core:test :server:test | tee evidence/backend-tests.txt
          grep -q 'BUILD SUCCESSFUL' evidence/backend-tests.txt
          mkdir -p evidence/test-results/core evidence/test-results/server
          cp -R core/build/test-results/test/. evidence/test-results/core/
          cp -R server/build/test-results/test/. evidence/test-results/server/
          MANAGER_XML=$(find server/build/test-results/test -name '*Part2ManagerAcceptanceIntegrationTest*.xml' -type f | head -1)
          test -s "$MANAGER_XML"
          cp "$MANAGER_XML" evidence/manager-e2e.xml
          python3 - "$MANAGER_XML" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          assert int(root.attrib.get('tests','0')) == 5, root.attrib
          assert int(root.attrib.get('failures','0')) == 0, root.attrib
          assert int(root.attrib.get('errors','0')) == 0, root.attrib
          assert int(root.attrib.get('skipped','0')) == 0, root.attrib
          expected={
            'concurrentPurchaseRaceAllowsNoOverspendAndReconciles',
            'multiDeviceConcurrentAvatarEquipHasSingleWinnerAndConverges',
            'seasonRolloverPreservesLifetimeProgressionCoinsInventoryAndClosesSeasonProgress',
            'part2AccountExportIncludesOwnedGameStateAndDeleteRevokesRelogin',
            'avatarOwnershipEquipSurvivesServerRestartAndRelogin',
          }
          got={x.attrib['name'].removesuffix('()') for x in root.findall('testcase')}
          assert expected <= got, (expected-got, got)
          print('PART2_MANAGER_E2E_5_OF_5=PASS')
          PY
          echo PART2_BACKEND_REAL_POSTGRES=PASS | tee evidence/backend-gate.txt
          echo PART2_MANAGER_E2E=PASS | tee evidence/manager-e2e-gate.txt

      - name: Run exact Ktor account/export/delete and performance smoke
        shell: bash
        run: |
          set -euo pipefail
          nohup gradle --no-daemon :server:run > evidence/server.log 2>&1 &
          echo $! > evidence/server.pid
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:8080/ready > evidence/ready.json; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          grep -q '"ready":true' evidence/ready.json
          VELTRIX_API_BASE_URL=http://127.0.0.1:8080 python3 scripts/part2_http_runtime_smoke.py | tee evidence/http-smoke.txt
          grep -q PART2_HTTP_ACCOUNT_EXPORT_DELETE=PASS evidence/http-smoke.txt
          grep -q PART2_HTTP_RUNTIME_SMOKE=PASS evidence/http-smoke.txt
          VELTRIX_API_BASE_URL=http://127.0.0.1:8080 python3 scripts/part2_performance_smoke.py | tee evidence/performance-smoke.txt
          grep -q PART2_PERFORMANCE_SMOKE=PASS evidence/performance-smoke.txt
          echo PART2_REAL_SERVER=PASS | tee evidence/server-gate.txt

      - name: Import and verify exact preserved Android runtime artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$BASE_RUNTIME_ARTIFACT_ID/zip" -o prior-artifact.zip
          echo "$BASE_OUTER_ARTIFACT_SHA256  prior-artifact.zip" | sha256sum -c -
          unzip -q prior-artifact.zip -d prior-artifact
          PRIOR_INNER=prior-artifact/Veltrix-Hom-VNext-Part2-VERIFIED-PACKAGE.zip
          echo "$BASE_INNER_PACKAGE_SHA256  $PRIOR_INNER" | sha256sum -c -
          unzip -q "$PRIOR_INNER" -d prior-package
          echo "$BASE_APK_SHA256  prior-package/Veltrix-Hom-VNext-Part2-FINAL.apk" | sha256sum -c -
          echo "$BASE_ANDROID_TEST_SHA256  prior-package/Veltrix-Hom-VNext-Part2-ANDROID-TEST.apk" | sha256sum -c -
          grep -q PART2_ANDROID_INSTALL=PASS prior-package/evidence/android-install-gate.txt
          grep -q PART2_PROCESS_DEATH=PASS prior-package/evidence/process-death-gate.txt
          grep -q PART2_ANDROID_RUNTIME=PASS prior-package/evidence/android-runtime-gate.txt
          grep -q 'OK (15 tests)' prior-package/evidence/runtime/connected.txt
          grep -q 'OK (2 tests)' prior-package/evidence/part2-instrumentation.txt
          mkdir -p evidence/preserved-android
          cp prior-package/evidence/android-install-gate.txt evidence/preserved-android/
          cp prior-package/evidence/process-death-gate.txt evidence/preserved-android/
          cp prior-package/evidence/android-runtime-gate.txt evidence/preserved-android/
          cp prior-package/evidence/part2-process-seed.txt evidence/preserved-android/
          cp prior-package/evidence/part2-process-verify.txt evidence/preserved-android/
          cp prior-package/evidence/part2-instrumentation.txt evidence/preserved-android/
          cp prior-package/evidence/runtime/connected.txt evidence/preserved-android/connected-15-tests.txt
          cp prior-package/evidence/runtime/runtime-all.txt evidence/preserved-android/runtime-all.txt
          printf 'source_sha=%s\nrun=%s\njob=%s\nartifact_id=%s\napk_sha256=%s\nandroid_test_sha256=%s\nreason=Android/core/build inputs unchanged on final SHA\n' \
            "$BASE_RUNTIME_SHA" "$BASE_RUNTIME_RUN" "$BASE_RUNTIME_JOB" "$BASE_RUNTIME_ARTIFACT_ID" "$BASE_APK_SHA256" "$BASE_ANDROID_TEST_SHA256" > evidence/preserved-android/PROVENANCE.txt
          echo PART2_PRESERVED_ANDROID_RUNTIME=PASS | tee evidence/preserved-android-gate.txt

      - name: Emit exact A-S closure evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          sha=os.environ['GITHUB_SHA']; run=os.environ['GITHUB_RUN_ID']; job=os.environ['GITHUB_JOB']
          base=os.environ['BASE_RUNTIME_SHA']; brun=os.environ['BASE_RUNTIME_RUN']; bjob=os.environ['BASE_RUNTIME_JOB']
          rows=[
          ('A','Part1 baseline/regression','check_part1_structure + full core/server regression',sha,'Ubuntu24+PostgreSQL17','evidence/part1-structure.txt;evidence/backend-tests.txt',run,job),
          ('B','Meaningful activity exactly-once XP/Coins','Part2PostgresIntegrationTest.meaningfulEventRewardsExactlyOnceAndSemanticDuplicateIsRejected',sha,'real PostgreSQL','evidence/test-results/server',run,job),
          ('C','Anti-farming/caps/duplicates','Part2GameSystemsTest anti-farming cases + Part2PostgresIntegrationTest',sha,'JVM+PostgreSQL','evidence/test-results/core;evidence/test-results/server',run,job),
          ('D','Level curve/simulation','level curve boundary + progression simulation tests',sha,'JVM','evidence/test-results/core;evidence/progression-policy.txt',run,job),
          ('E','Coin ledger/reconcile/refund','Part2CompletionIntegrationTest ledger/refund/reconciliation',sha,'real PostgreSQL','evidence/test-results/server',run,job),
          ('F','Concurrent purchase/no overspend','Part2ManagerAcceptanceIntegrationTest.concurrentPurchaseRaceAllowsNoOverspendAndReconciles',sha,'real PostgreSQL concurrent workers','evidence/manager-e2e.xml',run,job),
          ('G','Achievements/durability','Part2CompletionIntegrationTest derived achievements',sha,'real PostgreSQL','evidence/test-results/server',run,job),
          ('H','Avatar ownership/equip/restart/relogin','Part2ManagerAcceptanceIntegrationTest.avatarOwnershipEquipSurvivesServerRestartAndRelogin',sha,'real PostgreSQL DB restart+login','evidence/manager-e2e.xml',run,job),
          ('I','Personal Map eligibility','personalMapRequiresLevelAndMemoryGate + HTTP smoke',sha,'JVM+Ktor/PostgreSQL','evidence/test-results/core;evidence/http-smoke.txt',run,job),
          ('J','Map generation/fallback','invalidAiMapFallsBackAndAiHasNoEconomicAuthority',sha,'JVM','evidence/test-results/core',run,job),
          ('K','Sequential Map units','mapUnitProgressOnlyExposesTheNextUnit + structural map test',sha,'JVM','evidence/test-results/core',run,job),
          ('L','Consistency semantics','consistencyCountsQualifiedLocalDaysNotAppOpens',sha,'JVM','evidence/test-results/core',run,job),
          ('M','Season rollover/lifetime preservation','Part2ManagerAcceptanceIntegrationTest.seasonRolloverPreservesLifetimeProgressionCoinsInventoryAndClosesSeasonProgress',sha,'real PostgreSQL','evidence/manager-e2e.xml',run,job),
          ('N','Gaming stats/events/notifications','Part2CompletionIntegrationTest statistics/events/notifications',sha,'real PostgreSQL','evidence/test-results/server',run,job),
          ('O','Offline/cache stale revision','Part2GameInstrumentedTest.gameCacheSurvivesDatabaseReopenAndRejectsStaleRevision',base,'Android16/API36','evidence/preserved-android/connected-15-tests.txt',brun,bjob),
          ('P','Process death','Part2GameProcessDeathInstrumentedTest seed+fresh-process verify',base,'Android16/API36','evidence/preserved-android/part2-process-seed.txt;evidence/preserved-android/part2-process-verify.txt',brun,bjob),
          ('Q','Multi-device concurrency consistency','Part2ManagerAcceptanceIntegrationTest.multiDeviceConcurrentAvatarEquipHasSingleWinnerAndConverges',sha,'real PostgreSQL concurrent clients','evidence/manager-e2e.xml',run,job),
          ('R','Part2 account export/delete','Part2ManagerAcceptanceIntegrationTest.part2AccountExportIncludesOwnedGameStateAndDeleteRevokesRelogin + HTTP smoke',sha,'real PostgreSQL+Ktor auth','evidence/manager-e2e.xml;evidence/http-smoke.txt',run,job),
          ('S','Full integration/runtime/package closure','current core/server+HTTP + preserved unchanged Android 15-test runtime',sha,'GitHub CI+preserved API36','evidence/backend-tests.txt;evidence/preserved-android-gate.txt',run,job),
          ]
          with open('evidence/E2E_EXECUTION_STATUS.tsv','w') as f:
              f.write('ID\tbehavior\texact_test_or_gate\tsource_sha\tenvironment\tresult\tevidence\trun\tjob\n')
              for r in rows: f.write('\t'.join((*r[:5],'PASS',*r[5:]))+'\n')
          assert len(rows)==19 and [r[0] for r in rows]==list('ABCDEFGHIJKLMNOPQRS')
          print('PART2_E2E_A_TO_S=PASS')
          PY
          grep -q PART2_MANAGER_E2E=PASS evidence/manager-e2e-gate.txt
          test "$(grep -c $'\tPASS\t' evidence/E2E_EXECUTION_STATUS.tsv)" -eq 19
          echo PART2_E2E_A_TO_S=PASS | tee evidence/e2e-gate.txt

      - name: Resolve numeric job id
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > evidence/current-run-jobs.json
          python3 - <<'PY' > evidence/final-job-id.txt
          import json
          d=json.load(open('evidence/current-run-jobs.json'))
          jobs=[j for j in d.get('jobs',[]) if j.get('name')=='final']
          assert len(jobs)==1, len(jobs)
          print(jobs[0]['id'])
          PY
          test -s evidence/final-job-id.txt

      - name: Package exact source, preserved APKs, current docs and evidence
        shell: bash
        run: |
          set -euo pipefail
          FINAL_JOB_ID=$(cat evidence/final-job-id.txt)
          git archive --format=zip --output=package/Veltrix-Hom-VNext-Part2-EXACT-TESTED-SOURCE.zip "$GITHUB_SHA"
          cp prior-package/Veltrix-Hom-VNext-Part2-FINAL.apk package/Veltrix-Hom-VNext-Part2-FINAL.apk
          cp prior-package/Veltrix-Hom-VNext-Part2-ANDROID-TEST.apk package/Veltrix-Hom-VNext-Part2-ANDROID-TEST.apk
          cp -R docs package/docs
          cp -R contracts package/contracts
          cp -R evidence package/evidence
          cp docs/progression-policy-v1.json package/progression-policy-v1.json
          cp docs/level-curve-v1.json package/level-curve-v1.json
          printf 'repo=%s\nbranch=%s\ncommit=%s\nrun=%s\njob=%s\nfrozen_part1=%s\nmanager_base=%s\nandroid_runtime_source_sha=%s\nandroid_runtime_run=%s\nandroid_runtime_job=%s\nandroid_runtime_artifact_id=%s\nandroid_runtime=Android-16-API36-google_apis-x86_64\ncompile_sdk=37\ntarget_sdk=37\napk_sha256=%s\nandroid_test_sha256=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$FINAL_JOB_ID" "$FROZEN_PART1_SHA" "$BASE_RUNTIME_SHA" "$BASE_RUNTIME_SHA" "$BASE_RUNTIME_RUN" "$BASE_RUNTIME_JOB" "$BASE_RUNTIME_ARTIFACT_ID" "$BASE_APK_SHA256" "$BASE_ANDROID_TEST_SHA256" > package/PROVENANCE.txt
          python3 scripts/verify_part2_manager_handoff.py > package/evidence/final-package-truth-audit.txt
          grep -q PART2_MANAGER_HANDOFF_CHECK=PASS package/evidence/final-package-truth-audit.txt
          mkdir -p source-check
          unzip -q package/Veltrix-Hom-VNext-Part2-EXACT-TESTED-SOURCE.zip -d source-check
          python3 source-check/scripts/generate_openapi_contract.py > package/evidence/source-archive-openapi-generate.txt
          cp source-check/contracts/openapi.yaml source-check/docs/API_Contract.openapi.yaml
          python3 source-check/scripts/verify_part2_manager_handoff.py > package/evidence/source-archive-truth-audit.txt
          grep -q PART2_MANAGER_HANDOFF_CHECK=PASS package/evidence/source-archive-truth-audit.txt
          (cd package && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd package && sha256sum -c SHA256SUMS.txt) | tee evidence/package-sha-recompute.txt
          grep -q './Veltrix-Hom-VNext-Part2-FINAL.apk: OK' evidence/package-sha-recompute.txt
          grep -q './Veltrix-Hom-VNext-Part2-ANDROID-TEST.apk: OK' evidence/package-sha-recompute.txt
          (cd package && zip -qr ../Veltrix-Hom-VNext-Part2-MANAGER-ACCEPTANCE-PACKAGE.zip .)
          sha256sum package/Veltrix-Hom-VNext-Part2-EXACT-TESTED-SOURCE.zip | tee artifact/SOURCE_SHA256.txt
          sha256sum package/Veltrix-Hom-VNext-Part2-FINAL.apk | tee artifact/APK_SHA256.txt
          sha256sum package/Veltrix-Hom-VNext-Part2-ANDROID-TEST.apk | tee artifact/ANDROID_TEST_SHA256.txt
          sha256sum Veltrix-Hom-VNext-Part2-MANAGER-ACCEPTANCE-PACKAGE.zip | tee artifact/PACKAGE_SHA256.txt
          cp Veltrix-Hom-VNext-Part2-MANAGER-ACCEPTANCE-PACKAGE.zip artifact/
          cp package/PROVENANCE.txt artifact/
          cp package/SHA256SUMS.txt artifact/
          cp evidence/E2E_EXECUTION_STATUS.tsv artifact/
          echo PART2_MANAGER_ACCEPTANCE_PACKAGE=PASS | tee artifact/FINAL_STATUS.txt

      - name: Upload canonical Manager-acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-hom-part2-manager-accepted-${{ github.run_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
