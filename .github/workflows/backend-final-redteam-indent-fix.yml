name: Backend Final Red-Team Indent Fix

on:
  pull_request:
    branches: [veltrix-hom-backend-final-closure]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veltrix-hom-backend-final-closure-verify
          fetch-depth: 0
      - name: Repair only red-team YAML indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('.github/workflows/backend-final-closure-final-gate.yml'),
              Path('.github/workflows/backend-final-closure-runtime-package.yml'),
          ]
          bad = '\n'.join([
              '          REDTEAM_TARGETS=(',
              '  core/src/main',
              '  server/src/main',
              '  android/app/src/main',
              '  database/migrations',
              '  contracts',
              '  .env.example',
              '  build.gradle.kts',
              '  settings.gradle.kts',
              '  gradle.properties',
              '  server/build.gradle.kts',
              '  android/app/build.gradle.kts',
              ')',
              'for target in "${REDTEAM_TARGETS[@]}"; do test -e "$target"; done',
              "git grep -nE 'TODO|FIXME|placeholder|fake API|fake citation|loot.?box|client-trusted XP|client-trusted Coins' -- \"${REDTEAM_TARGETS[@]}\" | tee evidence/red-team-findings.txt || true",
          ])
          good = '\n'.join([
              '          REDTEAM_TARGETS=(',
              '            core/src/main',
              '            server/src/main',
              '            android/app/src/main',
              '            database/migrations',
              '            contracts',
              '            .env.example',
              '            build.gradle.kts',
              '            settings.gradle.kts',
              '            gradle.properties',
              '            server/build.gradle.kts',
              '            android/app/build.gradle.kts',
              '          )',
              '          for target in "${REDTEAM_TARGETS[@]}"; do test -e "$target"; done',
              "          git grep -nE 'TODO|FIXME|placeholder|fake API|fake citation|loot.?box|client-trusted XP|client-trusted Coins' -- \"${REDTEAM_TARGETS[@]}\" | tee evidence/red-team-findings.txt || true",
          ])
          for path in paths:
              text = path.read_text()
              if text.count(bad) != 1:
                  raise SystemExit(f'{path}: malformed block count={text.count(bad)}')
              path.write_text(text.replace(bad, good))
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          grep -n -A18 'REDTEAM_TARGETS=(' .github/workflows/backend-final-closure-final-gate.yml
          grep -n -A18 'REDTEAM_TARGETS=(' .github/workflows/backend-final-closure-runtime-package.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/backend-final-closure-final-gate.yml .github/workflows/backend-final-closure-runtime-package.yml
          git commit -m 'ci(final): repair red-team YAML indentation'
          git push origin HEAD:veltrix-hom-backend-final-closure-verify
