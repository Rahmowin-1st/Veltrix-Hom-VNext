name: Veltrix Frontend Root Reset Runtime Gate

on:
  push:
    branches: [veltrix-hom-final-root-reset]
  workflow_dispatch:

concurrency:
  group: veltrix-frontend-root-reset-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  ACCEPTED_BACKEND_SHA: 4ed13cfcf7d4bb1fe6215b231426e0b4f208343a
  ROOT_RESET_BASE_SHA: e8bf2d2ae382c3fadbe66a66431db494156419e9
  VELTRIX_ENV: test
  VELTRIX_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
  VELTRIX_DATABASE_USER: postgres
  VELTRIX_DATABASE_PASSWORD: postgres
  VELTRIX_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
  VELTRIX_TEST_DATABASE_USER: postgres
  VELTRIX_TEST_DATABASE_PASSWORD: postgres
  VELTRIX_AI_PROVIDER: disabled
  VELTRIX_TEST_AI_MOCK: 'true'
  VELTRIX_EMBEDDING_PROVIDER: disabled
  VELTRIX_TEST_EMBEDDING_MOCK: 'true'
  VELTRIX_EMBEDDING_DIMENSIONS: '64'
  VELTRIX_TEST_OCR_MOCK: 'true'
  VELTRIX_TEST_TRANSLATE_MOCK: 'true'
  VELTRIX_STORAGE_PROVIDER: local
  VELTRIX_WORKERS_ENABLED: 'true'

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_DB: veltrix_vnext_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d veltrix_vnext_test"
          --health-interval 5s --health-timeout 5s --health-retries 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact runtime provenance and frontend-only boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/runtime
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$ACCEPTED_BACKEND_SHA^{commit}"
          git cat-file -e "$ROOT_RESET_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$ACCEPTED_BACKEND_SHA" "$GITHUB_SHA"
          git merge-base --is-ancestor "$ROOT_RESET_BASE_SHA" "$GITHUB_SHA"
          if git diff --name-only "$ROOT_RESET_BASE_SHA" "$GITHUB_SHA" | grep -E '^(server/|database/migrations/|core/src/main/)'; then
            echo 'Backend-owned source changed during frontend root reset.' >&2
            exit 1
          fi
          printf 'repo=%s\nbranch=%s\ncommit=%s\naccepted_backend=%s\nrun=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$ACCEPTED_BACKEND_SHA" "$GITHUB_RUN_ID" \
            | tee evidence/runtime/provenance.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build exact target and instrumentation APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon \
            -PVELTRIX_API_BASE_URL=http://127.0.0.1:8080 \
            :android:app:assembleDebug \
            :android:app:assembleDebugAndroidTest | tee evidence/runtime/android-build.txt
          grep -q 'BUILD SUCCESSFUL' evidence/runtime/android-build.txt
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee evidence/runtime/apk-sha256.txt
          sha256sum android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk | tee evidence/runtime/androidtest-apk-sha256.txt

      - name: Start accepted backend runtime
        shell: bash
        run: |
          set -euo pipefail
          nohup gradle --no-daemon :server:run > evidence/runtime/server-runtime.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:8080/ready > evidence/runtime/ready.json; then break; fi
            sleep 2
          done
          grep -q '"ready":true' evidence/runtime/ready.json
          grep -q '"testAiConfigured":true' evidence/runtime/ready.json

      - uses: android-actions/setup-android@v3

      - name: Provision API36 runtime
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-36' 'system-images;android-36;google_apis;x86_64'
          if [ ! -e /dev/kvm ]; then
            echo 'KVM unavailable: API36 runtime proof cannot be accepted.' | tee evidence/runtime/kvm.txt
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm | tee evidence/runtime/kvm.txt

      - name: API36 account shell runtime acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          disable-animations: false
          emulator-options: -no-window -gpu auto -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            mkdir -p evidence/runtime
            adb reverse tcp:8080 tcp:8080
            gradle --no-daemon \
              -PVELTRIX_API_BASE_URL=http://127.0.0.1:8080 \
              -Pandroid.testInstrumentationRunnerArguments.class=com.veltrix.hom.vnext.RootResetRuntimeInstrumentedTest \
              :android:app:connectedDebugAndroidTest | tee evidence/runtime/root-reset-instrumentation.txt
            grep -q 'BUILD SUCCESSFUL' evidence/runtime/root-reset-instrumentation.txt
            python3 - <<'PY' | tee evidence/runtime/root-reset-test-summary.txt
            import glob
            import xml.etree.ElementTree as ET
            files = glob.glob('android/app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True)
            matched = []
            tests = failures = errors = skipped = 0
            for path in files:
                try:
                    root = ET.parse(path).getroot()
                except ET.ParseError:
                    continue
                cases = [c for c in root.iter('testcase') if 'RootResetRuntimeInstrumentedTest' in c.attrib.get('classname', '')]
                if not cases:
                    continue
                matched.append(path)
                tests += len(cases)
                failures += sum(1 for c in cases if c.find('failure') is not None)
                errors += sum(1 for c in cases if c.find('error') is not None)
                skipped += sum(1 for c in cases if c.find('skipped') is not None)
            if tests != 2 or failures or errors or skipped:
                raise SystemExit(f'ROOT_RESET_RUNTIME=FAIL tests={tests} failures={failures} errors={errors} skipped={skipped} files={matched}')
            print(f'ROOT_RESET_RUNTIME=PASS tests={tests} failures=0 errors=0 skipped=0')
            PY
            grep -q 'ROOT_RESET_RUNTIME=PASS tests=2 failures=0 errors=0 skipped=0' evidence/runtime/root-reset-test-summary.txt
            echo 'ACCOUNT_FIRST=PASS' | tee evidence/runtime/stage30-gate.txt
            echo 'NO_GUEST_MODE=PASS' | tee -a evidence/runtime/stage30-gate.txt
            echo 'SERVER_VALIDATED_SESSION=PASS' | tee -a evidence/runtime/stage30-gate.txt
            echo 'FOUR_PRIMARY_WORLDS=PASS' | tee -a evidence/runtime/stage30-gate.txt
            echo 'BACK_TO_HOME=PASS' | tee -a evidence/runtime/stage30-gate.txt
            echo 'SIGN_OUT_RETURNS_AUTH=PASS' | tee -a evidence/runtime/stage30-gate.txt
            adb reverse --remove-all || true

      - name: Fail-closed Stage 30 verification
        shell: bash
        run: |
          set -euo pipefail
          test -s evidence/runtime/stage30-gate.txt
          for marker in \
            ACCOUNT_FIRST=PASS \
            NO_GUEST_MODE=PASS \
            SERVER_VALIDATED_SESSION=PASS \
            FOUR_PRIMARY_WORLDS=PASS \
            BACK_TO_HOME=PASS \
            SIGN_OUT_RETURNS_AUTH=PASS; do
            grep -qx "$marker" evidence/runtime/stage30-gate.txt
          done
          grep -q 'ROOT_RESET_RUNTIME=PASS tests=2 failures=0 errors=0 skipped=0' evidence/runtime/root-reset-test-summary.txt
          echo 'ROOT_RESET_STAGE30_RUNTIME=PASS' | tee evidence/runtime/final.txt

      - name: Upload root-reset runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-frontend-root-reset-runtime-${{ github.run_id }}
          path: evidence/runtime/
          if-no-files-found: error
          retention-days: 30
