name: Fix Part 1 compile defects

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-part1-compile.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veltrix-hom-part1-completion
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Align integration test with completed source APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server/src/test/kotlin/com/veltrix/hom/vnext/server/Part1CompletionIntegrationTest.kt')
          s=p.read_text()
          replacements=[
            ('planned.planned.carry.projectId','planned.planned.projectId'),
            ('globalCtx.planned.carry.projectId','globalCtx.planned.projectId'),
            ('planned.request.systemPrompt.contains("Source grounding is active")','planned.request.systemPrompt?.contains("Source grounding is active") == true'),
            ('chats.appendAssistantContent(a.accountId, assistant.id, "Understood. I will keep explanations concise.")','chats.appendAssistantSegment(a.accountId, assistant.id, "Understood. I will keep explanations concise.")'),
          ]
          for old,new in replacements:
              if old in s:
                  s=s.replace(old,new)
              elif new not in s:
                  raise SystemExit(f'neither old nor expected new test API expression found: {old}')
          p.write_text(s)
          PY
          git diff --check
          git diff -- server/src/test/kotlin/com/veltrix/hom/vnext/server/Part1CompletionIntegrationTest.kt
      - name: Commit integration-test repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Integration test already aligned.'
            exit 0
          fi
          git config user.name 'Veltrix Backend CI'
          git config user.email 'actions@users.noreply.github.com'
          git add server/src/test/kotlin/com/veltrix/hom/vnext/server/Part1CompletionIntegrationTest.kt
          git commit -m 'test: align Part 1 integration flow with completed APIs'
          git push origin HEAD:veltrix-hom-part1-completion
