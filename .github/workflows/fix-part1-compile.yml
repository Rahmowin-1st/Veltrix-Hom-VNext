name: Fix Part 1 compile defects

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-part1-compile.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veltrix-hom-part1-completion
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply compile fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'server/src/main/kotlin/com/veltrix/hom/vnext/server/ChatIntelligenceRepository.kt': [
              ('):List<MessageAttachmentResponse>=', '):List<MessageAttachmentResponse> ='),
              ('):List<MessageCitationResponse>=', '):List<MessageCitationResponse> ='),
            ],
            'server/src/main/kotlin/com/veltrix/hom/vnext/server/GeneratedArtifactService.kt': [
              ('):List<GeneratedArtifactResponse>=', '):List<GeneratedArtifactResponse> ='),
            ],
            'server/src/main/kotlin/com/veltrix/hom/vnext/server/Main.kt': [
              ('private suspend fun <T> blocking(block:()->T):T=withContext(Dispatchers.IO){block()}',
               'private suspend fun <T> blocking(block:suspend ()->T):T=withContext(Dispatchers.IO){block()}'),
            ],
            'server/src/main/kotlin/com/veltrix/hom/vnext/server/learning/DeepPracticeRepository.kt': [
              ('val body=deterministicHint(i.prompt,i.expectedAnswer,count)',
               'val body=deterministicHint(i.prompt,i.expectedAnswer ?: badState(),count)'),
              ('val p=mapSession(rs);insertActivity',
               'val p=mapSession(SessionRow(rs));insertActivity'),
            ],
          }
          for name, reps in replacements.items():
              p=Path(name); s=p.read_text()
              for old,new in reps:
                  if old not in s:
                      raise SystemExit(f'missing expected source pattern in {name}: {old}')
                  s=s.replace(old,new)
              p.write_text(s)
          PY
          git diff --check
          git diff --stat
      - name: Commit compile fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Veltrix Backend CI'
          git config user.email 'actions@users.noreply.github.com'
          git add server/src/main/kotlin/com/veltrix/hom/vnext/server
          git commit -m 'fix: close server compile blockers in Part 1 completion'
          git push origin HEAD:veltrix-hom-part1-completion
