name: Repair completion transport

on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-completion-transport.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v4
        with:
          ref: veltrix-hom-part1-completion
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair exact bad chunks and verify archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, re
          root=pathlib.Path('ci/source-v2')
          manifest=(root/'MANIFEST.txt').read_text()
          alpha=b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          repaired=[]
          for name in ('c02','c09'):
              p=root/(name+'.b64')
              target=bytes.fromhex(re.search(rf'^{name}_sha256=([0-9a-f]{{64}})$',manifest,re.M).group(1))
              data=bytearray(p.read_bytes())
              if hashlib.sha256(data).digest()==target:
                  print(name,'already exact')
                  continue
              found=None
              for i,orig in enumerate(data):
                  for ch in alpha:
                      if ch==orig: continue
                      data[i]=ch
                      if hashlib.sha256(data).digest()==target:
                          found=(i,orig,ch); break
                  if found: break
                  data[i]=orig
              if not found: raise SystemExit(f'{name}: manifest-exact single substitution not found')
              p.write_bytes(data)
              print(name,'repaired',found[0],chr(found[1]),'->',chr(found[2]))
              repaired.append(name)
          PY
          for f in ci/source-v2/c*.b64; do
            n=$(basename "$f" .b64)
            expected=$(sed -n "s/^${n}_sha256=//p" ci/source-v2/MANIFEST.txt)
            actual=$(sha256sum "$f" | awk '{print $1}')
            test "$expected" = "$actual"
          done
          cat ci/source-v2/c*.b64 | base64 -d > /tmp/source.tar.xz
          echo '1b363898c79f8eb7a74f5c279bc7c5f015f18703538c81ae34afc8aca1cdb2dc  /tmp/source.tar.xz' | sha256sum -c -
          xz -t /tmp/source.tar.xz

      - name: Commit repair to completion branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ci/source-v2/c02.b64 ci/source-v2/c09.b64; then
            echo 'Transport already exact; no commit needed.'
            exit 0
          fi
          git config user.name 'Veltrix Backend CI'
          git config user.email 'actions@users.noreply.github.com'
          git add ci/source-v2/c02.b64 ci/source-v2/c09.b64
          git commit -m 'fix: restore manifest-exact sealed completion transport'
          git push origin HEAD:veltrix-hom-part1-completion
