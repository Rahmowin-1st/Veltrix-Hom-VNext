name: Veltrix Hom vNext Part 1 Final Gate V3

on:
  push:
    branches: [veltrix-hom-part1-completion]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  VELTRIX_ENV: test
  VELTRIX_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
  VELTRIX_DATABASE_USER: postgres
  VELTRIX_DATABASE_PASSWORD: postgres
  VELTRIX_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
  VELTRIX_TEST_DATABASE_USER: postgres
  VELTRIX_TEST_DATABASE_PASSWORD: postgres
  VELTRIX_AI_PROVIDER: disabled
  VELTRIX_TEST_AI_MOCK: "true"
  VELTRIX_EMBEDDING_PROVIDER: disabled
  VELTRIX_TEST_EMBEDDING_MOCK: "true"
  VELTRIX_EMBEDDING_DIMENSIONS: "64"
  VELTRIX_TEST_OCR_MOCK: "true"
  VELTRIX_TEST_TRANSLATE_MOCK: "true"
  VELTRIX_STORAGE_PROVIDER: s3
  VELTRIX_S3_ENDPOINT: http://127.0.0.1:9000
  VELTRIX_S3_REGION: us-east-1
  VELTRIX_S3_BUCKET: veltrix-hom-vnext
  VELTRIX_S3_ACCESS_KEY: veltrixci
  VELTRIX_S3_SECRET_KEY: veltrixci-secret-2026
  VELTRIX_S3_PATH_STYLE: "true"
  VELTRIX_WORKERS_ENABLED: "false"
  PORT: "8080"
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android-avd

jobs:
  final-gate-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_DB: veltrix_vnext_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veltrix_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout exact completion commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record clean source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/{provenance,server,contracts,security,android,performance,ci,docs} final
          printf 'repository=%s\nbranch=%s\ncommit=%s\nrun_id=%s\nfoundation_checkpoint=d47d0876eb2ee30a480549a89b42382b4a31d8ed\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" | tee evidence/provenance/repo.txt
          git rev-parse HEAD | tee evidence/provenance/commit.txt
          git status --porcelain=v1 | tee evidence/provenance/checkout-status.txt
          test ! -s evidence/provenance/checkout-status.txt

      - name: Structure gate before any test side effect
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_structure.sh 2>&1 | tee evidence/contracts/structure.txt
          grep -q 'STRUCTURE_VERIFY=PASS' evidence/contracts/structure.txt
          for f in \
            Architecture.md Repository_Map.md Environment_Setup.md Database_Schema.md Migration_Report.md API_OpenAPI.md Android_Domain_Contracts.md \
            AI_Engine.md AI_Provider_Routing.md AI_Context_Pipeline.md Memory_Engine.md Memory_Automation.md Memory_Maturity.md Chat.md Projects.md Project_Brain.md \
            Sources_Library.md Hybrid_RAG.md Object_Storage.md Citation_Retrieval.md Tests_Quizzes_Practice.md Flashcards.md Mistakes_Learning_Signals.md \
            Learning_Modes.md Translate.md Tool_Bridge.md Search.md Offline_Sync.md Notifications_Settings.md Security.md Performance.md Feature_Inventory.md \
            Legacy_Capability_Mapping.md Part2_Integration_Contract.md Part3_Frontend_Handoff.md Test_Report.md Security_Report.md Performance_Report.md \
            Known_Limitations.md VERIFIED_CLAIMED_NOT_VERIFIED.md FINAL_MANAGER_HANDOFF.md; do
            test -s "docs/$f"
          done
          echo 'DOC_STRUCTURE=PASS' | tee evidence/contracts/docs-structure.txt

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Verify PostgreSQL 17 compatible service and pgvector
        shell: bash
        run: |
          set -euo pipefail
          {
            psql --version
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d veltrix_vnext_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d veltrix_vnext_test -Atc "select version(); select extversion from pg_extension where extname='vector';"
          } 2>&1 | tee evidence/server/postgresql-pgvector.txt
          grep -q '^0\.8\.2$' evidence/server/postgresql-pgvector.txt

      - name: Start real S3-compatible MinIO and bucket
        shell: bash
        run: |
          set -euo pipefail
          docker pull minio/minio:RELEASE.2025-04-22T22-12-26Z
          docker run -d --name veltrix-minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER="$VELTRIX_S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$VELTRIX_S3_SECRET_KEY" \
            minio/minio:RELEASE.2025-04-22T22-12-26Z \
            server /data --console-address ':9001' | tee evidence/server/minio-container-id.txt
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:9000/minio/health/ready >/dev/null; then ready=1; break; fi
            if ! docker ps --filter name=veltrix-minio --format '{{.Names}}' | grep -qx veltrix-minio; then
              docker ps -a --filter name=veltrix-minio | tee evidence/server/minio-ps-failed.txt
              docker logs veltrix-minio | tee evidence/server/minio-failed.log
              exit 1
            fi
            sleep 2
          done
          test "$ready" = 1
          curl -fsS http://127.0.0.1:9000/minio/health/ready | tee evidence/server/minio-ready.txt
          docker run --rm --network host --entrypoint /bin/sh minio/mc:RELEASE.2025-04-16T18-13-26Z -c \
            "mc alias set local http://127.0.0.1:9000 '$VELTRIX_S3_ACCESS_KEY' '$VELTRIX_S3_SECRET_KEY' >/dev/null && mc mb --ignore-existing local/$VELTRIX_S3_BUCKET && mc stat local/$VELTRIX_S3_BUCKET" \
            2>&1 | tee evidence/server/minio-bucket.txt

      - name: Apply migrations and run core/server tests on real PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          START=$(date +%s%3N)
          gradle --no-daemon --stacktrace :core:test :server:test 2>&1 | tee evidence/server/gradle-core-server-tests.txt
          END=$(date +%s%3N)
          printf 'core_server_test_ms=%s\n' "$((END-START))" | tee evidence/performance/core-server-test-duration.txt
          grep -q 'BUILD SUCCESSFUL' evidence/server/gradle-core-server-tests.txt
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d veltrix_vnext_test -Atc "select version from schema_migration order by version" 2>/dev/null \
            | tee evidence/server/migration-versions.txt || true

      - name: Deterministic 105 regression
        shell: bash
        run: |
          set -o pipefail
          bash scripts/run_local_regressions.sh 2>&1 | tee evidence/server/deterministic-105.txt
          grep -q 'LOCAL_REGRESSION_GATE=PASS total=105' evidence/server/deterministic-105.txt
          grep -q 'SUMMARY | PASS=48 FAIL=0 TOTAL=48' out/regression-evidence/core-regression-output.txt
          grep -q 'SUMMARY | PASS=57 FAIL=0 TOTAL=57' out/regression-evidence/foundation-regression-output.txt

      - name: Authoritative OpenAPI generation and drift gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          cp contracts/openapi.yaml /tmp/openapi-before.yaml
          python3 scripts/generate_openapi_contract.py 2>&1 | tee evidence/contracts/openapi-generate.txt
          diff -u /tmp/openapi-before.yaml contracts/openapi.yaml | tee evidence/contracts/openapi-generated-diff.txt
          test ! -s evidence/contracts/openapi-generated-diff.txt
          python3 scripts/verify_openapi_drift.py 2>&1 | tee evidence/contracts/openapi-drift.txt
          grep -q 'OPENAPI_DRIFT=PASS' evidence/contracts/openapi-drift.txt
          grep -q 'KTOR_V1_OPERATIONS=106' evidence/contracts/openapi-drift.txt
          grep -q 'OPENAPI_OPERATIONS=106' evidence/contracts/openapi-drift.txt

      - name: Static security and legacy-isolation scan
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'High-signal credential scan of tracked product source.'
            if git grep -nE '(sk-[A-Za-z0-9_-]{24,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' -- \
                android server core contracts database scripts docs ':!.github/workflows/**'; then
              echo 'SOURCE_SECRET_SCAN=FAIL'; exit 1
            fi
            echo 'SOURCE_SECRET_SCAN=PASS'
            if git grep -n 'SYSTEM_ALERT_WINDOW' -- android; then echo 'DANGEROUS_ANDROID_PERMISSION=FAIL'; exit 1; fi
            echo 'DANGEROUS_ANDROID_PERMISSION=PASS'
            if git grep -nE 'android\.webkit\.WebView|\bWebView\b' -- android server core; then echo 'LEGACY_WEBVIEW_SCAN=FAIL'; exit 1; fi
            echo 'LEGACY_WEBVIEW_SCAN=PASS'
          } 2>&1 | tee evidence/security/static-source-scan.txt

      - name: Start real Ktor with durable workers enabled
        shell: bash
        run: |
          set -euo pipefail
          VELTRIX_WORKERS_ENABLED=true nohup gradle --no-daemon :server:run > evidence/server/ktor-runtime.log 2>&1 &
          echo $! > evidence/server/ktor.pid
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:8080/health > evidence/server/health.json; then ready=1; break; fi
            if ! kill -0 "$(cat evidence/server/ktor.pid)" 2>/dev/null; then cat evidence/server/ktor-runtime.log; exit 1; fi
            sleep 2
          done
          test "$ready" = 1
          curl -fsS http://127.0.0.1:8080/health | tee evidence/server/health.json
          curl -fsS http://127.0.0.1:8080/ready | tee evidence/server/ready.json
          jq -e '.status == "ok" and .environment == "test"' evidence/server/health.json
          jq -e '.ready == true and .database == "ok" and .storageConfigured == true and .embeddingConfigured == true and .testAiConfigured == true and .aiConfigured == false' evidence/server/ready.json

      - name: Real Ktor cross-feature runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          START=$(date +%s%3N)
          python3 scripts/http_runtime_smoke.py http://127.0.0.1:8080 2>&1 | tee evidence/server/http-runtime-smoke.txt
          END=$(date +%s%3N)
          grep -q '"HTTP_RUNTIME_SMOKE": "PASS"' evidence/server/http-runtime-smoke.txt
          printf 'http_cross_feature_smoke_ms=%s\n' "$((END-START))" | tee evidence/performance/http-runtime-duration.txt
          docker run --rm --network host --entrypoint /bin/sh minio/mc:RELEASE.2025-04-16T18-13-26Z -c \
            "mc alias set local http://127.0.0.1:9000 '$VELTRIX_S3_ACCESS_KEY' '$VELTRIX_S3_SECRET_KEY' >/dev/null && mc find local/$VELTRIX_S3_BUCKET --type f" \
            2>&1 | tee evidence/server/minio-objects-after-source-smoke.txt
          test -s evidence/server/minio-objects-after-source-smoke.txt

      - name: Runtime hot-query explain evidence
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d veltrix_vnext_test -v ON_ERROR_STOP=1 <<'SQL' | tee evidence/performance/postgresql-explain.txt
          EXPLAIN SELECT id,title,last_active_at FROM project WHERE deleted_at IS NULL ORDER BY last_active_at DESC LIMIT 20;
          EXPLAIN SELECT id,conversation_id,created_at FROM conversation_message ORDER BY created_at DESC LIMIT 50;
          EXPLAIN SELECT source_id,source_version,text_hash FROM source_chunk ORDER BY created_at DESC LIMIT 20;
          EXPLAIN SELECT due_at,card_id FROM flashcard_schedule ORDER BY due_at LIMIT 50;
          SQL

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37 and emulator image
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-37' 'build-tools;36.0.0' 'system-images;android-35;google_apis;x86_64' \
            2>&1 | tee evidence/android/sdk-install.txt

      - name: Build real APK and androidTest APK
        shell: bash
        run: |
          set -o pipefail
          START=$(date +%s%3N)
          gradle --no-daemon --stacktrace :android:app:assembleDebug :android:app:assembleDebugAndroidTest 2>&1 | tee evidence/android/build.txt
          END=$(date +%s%3N)
          printf 'android_build_ms=%s\n' "$((END-START))" | tee evidence/performance/android-build-duration.txt
          grep -q 'BUILD SUCCESSFUL' evidence/android/build.txt
          APP_APK=android/app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find android/app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f -size +0c | head -1)
          test -s "$APP_APK"
          test -n "$TEST_APK" && test -s "$TEST_APK"
          cp "$APP_APK" final/Veltrix-Hom-VNext-Part1-FINAL.apk
          cp "$TEST_APK" final/Veltrix-Hom-VNext-Part1-androidTest.apk
          stat -c 'apk_size_bytes=%s' "$APP_APK" | tee evidence/android/apk-metadata.txt
          sha256sum "$APP_APK" "$TEST_APK" | tee evidence/android/apk-build-sha256.txt

      - name: APK manifest and secret scan
        shell: bash
        run: |
          set -euo pipefail
          APP_APK=final/Veltrix-Hom-VNext-Part1-FINAL.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APP_APK" | tee evidence/android/apk-badging.txt
          grep -q "package: name='com.veltrix.hom.vnext.dev'" evidence/android/apk-badging.txt
          grep -q "versionCode='1'" evidence/android/apk-badging.txt
          grep -q "versionName='0.1.0-part1'" evidence/android/apk-badging.txt
          unzip -p "$APP_APK" classes.dex > /tmp/classes.dex || true
          if strings /tmp/classes.dex | grep -Eq '(sk-[A-Za-z0-9_-]{24,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{20,})'; then
            echo 'APK_SECRET_SCAN=FAIL' | tee evidence/security/apk-secret-scan.txt
            exit 1
          fi
          echo 'APK_SECRET_SCAN=PASS' | tee evidence/security/apk-secret-scan.txt

      - name: Boot deterministic Android emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm 2>/dev/null || true
          mkdir -p "$ANDROID_AVD_HOME"
          export ANDROID_AVD_HOME
          echo no | avdmanager create avd --force --name veltrix_vnext_api35 --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_6' >/dev/null
          avdmanager list avd | tee evidence/android/avd-list.txt
          nohup emulator -avd veltrix_vnext_api35 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect > evidence/android/emulator.log 2>&1 &
          echo $! > evidence/android/emulator.pid
          timeout 240 adb wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb devices -l | tee evidence/android/adb.txt
          adb get-state | tr -d '\r' | grep -Fx device
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Install exact APK and cold launch
        shell: bash
        run: |
          set -euo pipefail
          adb install -r -t final/Veltrix-Hom-VNext-Part1-FINAL.apk 2>&1 | tee evidence/android/install-app.txt
          adb install -r -t final/Veltrix-Hom-VNext-Part1-androidTest.apk 2>&1 | tee evidence/android/install-test.txt
          grep -q 'Success' evidence/android/install-app.txt
          grep -q 'Success' evidence/android/install-test.txt
          START=$(date +%s%3N)
          adb shell am force-stop com.veltrix.hom.vnext.dev
          adb shell am start -W -n com.veltrix.hom.vnext.dev/com.veltrix.hom.vnext.MainActivity 2>&1 | tee evidence/android/cold-launch.txt
          END=$(date +%s%3N)
          grep -q 'Status: ok' evidence/android/cold-launch.txt
          adb shell pidof com.veltrix.hom.vnext.dev | tee -a evidence/android/cold-launch.txt
          printf 'cold_launch_wall_ms=%s\n' "$((END-START))" | tee evidence/performance/android-cold-launch.txt

      - name: Android process-death persistence gate
        shell: bash
        run: |
          set -euo pipefail
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.hom.vnext.dev.*/\1/p' | head -1 | tr -d '\r')
          test -n "$I"
          printf 'instrumentation=%s\n' "$I" | tee evidence/android/instrumentation.txt
          adb shell am instrument -w -r -e class 'com.veltrix.hom.vnext.PersistenceInstrumentedTest#aSeedProjectForProcessRestart' "$I" 2>&1 | tee evidence/android/process-death-seed.txt
          grep -q 'OK (1 test)' evidence/android/process-death-seed.txt
          adb shell am force-stop com.veltrix.hom.vnext.dev
          test -z "$(adb shell pidof com.veltrix.hom.vnext.dev 2>/dev/null || true)"
          adb shell monkey -p com.veltrix.hom.vnext.dev -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1
          adb shell am instrument -w -r -e class 'com.veltrix.hom.vnext.PersistenceInstrumentedTest#zVerifyProjectAfterProcessRestart' "$I" 2>&1 | tee evidence/android/process-death-verify.txt
          grep -q 'OK (1 test)' evidence/android/process-death-verify.txt

      - name: Android offline durable-state gate
        shell: bash
        run: |
          set -euo pipefail
          I=$(cat evidence/android/instrumentation.txt | cut -d= -f2-)
          adb shell am instrument -w -r -e class 'com.veltrix.hom.vnext.OfflineDataInstrumentedTest#aSeedOfflineDurableState' "$I" 2>&1 | tee evidence/android/offline-seed.txt
          grep -q 'OK (1 test)' evidence/android/offline-seed.txt
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          adb shell am force-stop com.veltrix.hom.vnext.dev
          adb shell monkey -p com.veltrix.hom.vnext.dev -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1
          adb shell am instrument -w -r -e class 'com.veltrix.hom.vnext.OfflineDataInstrumentedTest#zVerifyOfflineDurableStateAfterProcessRestart' "$I" 2>&1 | tee evidence/android/offline-verify.txt
          grep -q 'OK (1 test)' evidence/android/offline-verify.txt
          adb shell svc wifi enable || true
          adb shell svc data enable || true
          printf 'NETWORK_RESTORED=YES\nSERVER_EXACTLY_ONCE_SYNC=VERIFIED_BY_KTOR_HTTP_RUNTIME\nANDROID_LOCAL_QUEUE_PROCESS_DEATH=VERIFIED\n' | tee evidence/android/reconnect.txt

      - name: Full connected Android regression and shell routes
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :android:app:connectedDebugAndroidTest 2>&1 | tee evidence/android/connected-tests.txt
          grep -q 'BUILD SUCCESSFUL' evidence/android/connected-tests.txt
          ! grep -q 'FAILURES!!!' evidence/android/connected-tests.txt

      - name: Final APK reinstall and cold relaunch
        shell: bash
        run: |
          set -euo pipefail
          adb uninstall com.veltrix.hom.vnext.dev >/dev/null || true
          adb install -t final/Veltrix-Hom-VNext-Part1-FINAL.apk 2>&1 | tee evidence/android/final-reinstall.txt
          grep -q 'Success' evidence/android/final-reinstall.txt
          adb shell am force-stop com.veltrix.hom.vnext.dev
          adb shell am start -W -n com.veltrix.hom.vnext.dev/com.veltrix.hom.vnext.MainActivity 2>&1 | tee evidence/android/final-cold-launch.txt
          grep -q 'Status: ok' evidence/android/final-cold-launch.txt
          adb shell pidof com.veltrix.hom.vnext.dev | tee -a evidence/android/final-cold-launch.txt

      - name: Package exact tested source, evidence and handoff
        shell: bash
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse HEAD)
          test "$COMMIT" = "$GITHUB_SHA"
          git status --porcelain=v1 | tee evidence/provenance/pre-package-working-tree.txt
          # Generated build/evidence files are intentionally untracked; source archive comes directly from exact Git commit.
          git archive --format=zip --prefix=Veltrix-Hom-VNext-Part1/ -o final/Veltrix-Hom-VNext-Part1-EXACT-TESTED-SOURCE.zip "$COMMIT"
          cp contracts/openapi.yaml final/OpenAPI-Part1-Final.yaml
          cp -a docs/. evidence/docs/
          printf 'repository=%s\nbranch=%s\ncommit=%s\nrun_id=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$COMMIT" "$GITHUB_RUN_ID" > evidence/ci/run.txt
          sha256sum final/Veltrix-Hom-VNext-Part1-FINAL.apk > evidence/provenance/apk_sha256.txt
          sha256sum final/Veltrix-Hom-VNext-Part1-EXACT-TESTED-SOURCE.zip > evidence/provenance/source_sha256.txt
          (cd evidence && zip -qr ../final/Veltrix-Hom-VNext-Part1-EVIDENCE.zip .)
          mkdir -p /tmp/veltrix-handoff
          cp final/Veltrix-Hom-VNext-Part1-FINAL.apk /tmp/veltrix-handoff/
          cp final/Veltrix-Hom-VNext-Part1-androidTest.apk /tmp/veltrix-handoff/
          cp final/Veltrix-Hom-VNext-Part1-EXACT-TESTED-SOURCE.zip /tmp/veltrix-handoff/
          cp final/Veltrix-Hom-VNext-Part1-EVIDENCE.zip /tmp/veltrix-handoff/
          cp final/OpenAPI-Part1-Final.yaml /tmp/veltrix-handoff/
          cp -a docs /tmp/veltrix-handoff/
          (cd /tmp/veltrix-handoff && zip -qr "$GITHUB_WORKSPACE/final/Veltrix-Hom-VNext-Part1-HANDOFF.zip" .)
          (cd final && sha256sum \
            Veltrix-Hom-VNext-Part1-FINAL.apk \
            Veltrix-Hom-VNext-Part1-androidTest.apk \
            Veltrix-Hom-VNext-Part1-EXACT-TESTED-SOURCE.zip \
            Veltrix-Hom-VNext-Part1-EVIDENCE.zip \
            Veltrix-Hom-VNext-Part1-HANDOFF.zip \
            OpenAPI-Part1-Final.yaml > SHA256SUMS.txt)
          cp final/SHA256SUMS.txt evidence/provenance/SHA256SUMS.txt
          cat final/SHA256SUMS.txt
          printf 'FINAL_GATE_COMMIT=%s\nFINAL_GATE_RUN=%s\n' "$COMMIT" "$GITHUB_RUN_ID" | tee final/FINAL_GATE_PROVENANCE.txt

      - name: Upload canonical final handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veltrix-Hom-VNext-Part1-FINAL
          path: final/
          if-no-files-found: error
          retention-days: 30

      - name: Upload red-run evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Veltrix-Hom-VNext-Part1-FAILED-EVIDENCE-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop runtime services
        if: always()
        shell: bash
        run: |
          if [ -f evidence/server/ktor.pid ]; then kill "$(cat evidence/server/ktor.pid)" 2>/dev/null || true; fi
          adb emu kill 2>/dev/null || true
          docker rm -f veltrix-minio 2>/dev/null || true
