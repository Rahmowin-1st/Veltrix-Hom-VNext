name: Veltrix Frontend Final Hotfix Apply
on:
  push:
    branches: [veltrix-hom-frontend-final-closure]
    paths:
      - .github/workflows/frontend-final-hotfix.yml
      - scripts/frontend-final-test-fix.patch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: veltrix-hom-frontend-final-closure
      - name: Apply staged final correction
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c93653d1bb48c9e2ecea9fac570f966a5a878ff0 HEAD
          git apply --check scripts/frontend-final-test-fix.patch
          git apply scripts/frontend-final-test-fix.patch
          rm scripts/frontend-final-test-fix.patch
          rm .github/workflows/frontend-final-test-fix.yml
          rm .github/workflows/frontend-final-hotfix.yml
          git config user.name 'Veltrix Frontend Master'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(frontend): make final auth and visual tests executable'
          git push origin HEAD:veltrix-hom-frontend-final-closure
