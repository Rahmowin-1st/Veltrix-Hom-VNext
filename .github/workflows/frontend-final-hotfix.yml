name: Veltrix Frontend Final Signout Hotfix

on:
  push:
    branches: [veltrix-hom-frontend-final-closure]
    paths:
      - scripts/frontend-final-signout-singleflight.patch
      - .github/workflows/frontend-final-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: veltrix-hom-frontend-final-closure
      - name: Apply sign-out single-flight guard
        shell: bash
        run: |
          set -euo pipefail
          ACCEPTED_BACKEND='c93653d1bb48c9e2ecea9fac570f966a5a878ff0'
          git merge-base --is-ancestor "$ACCEPTED_BACKEND" HEAD
          git apply --check scripts/frontend-final-signout-singleflight.patch
          git apply scripts/frontend-final-signout-singleflight.patch
          rm scripts/frontend-final-signout-singleflight.patch
          rm .github/workflows/frontend-final-hotfix.yml
          git config user.name 'Veltrix Frontend Master'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(frontend): make sign out single-flight'
          git push origin HEAD:veltrix-hom-frontend-final-closure
