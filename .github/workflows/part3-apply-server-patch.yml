name: Veltrix Backend Part 3 Apply Server Patch

on:
  push:
    branches: [veltrix-hom-backend-part3-final]
    paths:
      - scripts/apply_part3_server_patch.py
      - .github/workflows/part3-apply-server-patch.yml

permissions:
  contents: write

concurrency:
  group: veltrix-part3-apply-server-patch
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veltrix-hom-backend-part3-final
          fetch-depth: 0
      - name: Apply deterministic Part 3 server delta
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/apply_part3_server_patch.py
          git diff --check
          git diff --exit-code --quiet && { echo PART3_PATCH_ALREADY_APPLIED=PASS; exit 0; }
          git config user.name "veltrix-backend-master"
          git config user.email "actions@users.noreply.github.com"
          git add server/src/main/kotlin/com/veltrix/hom/vnext/server/Main.kt \
                  server/src/main/kotlin/com/veltrix/hom/vnext/server/Part2GameRepository.kt \
                  core/src/main/kotlin/com/veltrix/hom/vnext/core/Part3FinalSystems.kt \
                  database/migrations/V007__part3_final_capability_expansion.sql
          git commit -m "feat(part3): wire final capability routes and effective progression"
          git push origin HEAD:veltrix-hom-backend-part3-final
          echo PART3_SERVER_PATCH_PUSH=PASS
