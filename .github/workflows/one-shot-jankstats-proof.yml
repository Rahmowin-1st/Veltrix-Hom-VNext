name: One-shot JankStats proof integration

on:
  push:
    branches: [veltrix-hom-frontend-part3-final]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veltrix-hom-frontend-part3-final
          fetch-depth: 0
      - name: Replace emulator gfxinfo acceptance with JankStats UI CPU gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pth=Path('.github/scripts/frontend-part3-final-proof.sh')
          p=pth.read_text()
          old_comment='# screenrecord-free gfxinfo summary on the real MainActivity interaction sequence below.'
          new_comment='# screenrecord-free JankStats UI/CPU timing on the real MainActivity interaction sequence below.'
          if old_comment not in p: raise SystemExit('motion probe comment anchor missing')
          p=p.replace(old_comment,new_comment,1)

          start='# Frame pacing is measured in a second, screenrecord-free replay so capture overhead cannot\n'
          end='# Clip 3: Part 3 production tools/control worlds.\n'
          if start not in p or end not in p: raise SystemExit('frame-pacing block anchors missing')
          a=p.index(start); b=p.index(end,a)
          new_block='''# Frame pacing is measured separately from screenrecord with AndroidX JankStats on the\n# production MainActivity window. API31+ exposes UI-thread and non-GPU CPU frame durations;\n# total/GPU/jank classification remains diagnostic on CI emulators and is not a physical claim.\nrun_test 'com.veltrix.hom.vnext.JankStatsPerformanceInstrumentedTest#warmedPrimaryNavigationKeepsUiAndCpuWithinEmulatorSanityBudget' evidence/performance/jankstats-ui-cpu-test.txt 'OK (1 test)'\nadb shell run-as "$PACKAGE" cat files/jankstats-ui-cpu.txt > evidence/performance/jankstats-ui-cpu.txt\ncat evidence/performance/jankstats-ui-cpu.txt\ngrep -q 'JANKSTATS_UI_CPU_EMULATOR=PASS' evidence/performance/jankstats-ui-cpu.txt\ngrep -q 'PHYSICAL_DEVICE_PF=NOT_VERIFIED' evidence/performance/jankstats-ui-cpu.txt\n# Retain gfxinfo as diagnostic evidence only. It is intentionally not an acceptance threshold\n# because emulator GPU/fence timing can be non-representative and physical-device PF is separate.\nadb shell dumpsys gfxinfo "$PACKAGE" > evidence/performance/gfxinfo-after-jankstats.txt || true\nprintf 'MOTION_FRAME_PACING_EMULATOR=PASS source=jankstats_ui_cpu screenrecord_free=1\\n' | tee evidence/motion/shell-motion-jankstats-gate.txt\n\n'''
          p=p[:a]+new_block+p[b:]

          replacements={
            "printf 'MOTION_TEMPORAL_EVIDENCE=PASS clips=3 vfr_safe=1\\nMOTION_FRAME_PACING_EMULATOR=PASS source=gfxinfo_summary screenrecord_free=1\\nPHYSICAL_TOUCH_FEEL=NOT_VERIFIED\\n' | tee -a evidence/motion/motion-gate.txt":
            "printf 'MOTION_TEMPORAL_EVIDENCE=PASS clips=3 vfr_safe=1\\nMOTION_FRAME_PACING_EMULATOR=PASS source=jankstats_ui_cpu screenrecord_free=1\\nPHYSICAL_TOUCH_FEEL=NOT_VERIFIED\\n' | tee -a evidence/motion/motion-gate.txt",
            '- Motion: 3 runtime MP4 clips are ffprobe-gated for decodability, duration, resolution and temporal frames. Encoded screenrecord VFR is not treated as render FPS; MainActivity direct-manipulation frame pacing is replayed without screenrecord and fail-closed separately from Android gfxinfo summary.':
            '- Motion: 3 runtime MP4 clips are ffprobe-gated for decodability, duration, resolution and temporal frames. Encoded screenrecord VFR is not treated as render FPS; MainActivity frame pacing is fail-closed separately with AndroidX JankStats UI-thread/non-GPU CPU timing, while total/GPU emulator timing remains diagnostic.',
            '- Motion clips + ffprobe metadata + screenrecord-free MainActivity gfxinfo gate: evidence/motion/':
            '- Motion clips + ffprobe metadata: evidence/motion/; JankStats UI/CPU + gfxinfo diagnostics: evidence/performance/',
            'MOTION_FRAME_PACING_EMULATOR=PASS source=gfxinfo_summary screenrecord_free=1':
            'MOTION_FRAME_PACING_EMULATOR=PASS source=jankstats_ui_cpu screenrecord_free=1',
          }
          for old,new in replacements.items():
            if old not in p: raise SystemExit('required marker missing: '+old[:90])
            p=p.replace(old,new)
          if 'source=gfxinfo_summary screenrecord_free=1' in p:
            raise SystemExit('stale gfxinfo acceptance marker remains')
          pth.write_text(p)
          PY
          bash -n .github/scripts/frontend-part3-final-proof.sh
          git diff --check
          grep -Fq 'JankStatsPerformanceInstrumentedTest#warmedPrimaryNavigationKeepsUiAndCpuWithinEmulatorSanityBudget' .github/scripts/frontend-part3-final-proof.sh
          grep -Fq 'MOTION_FRAME_PACING_EMULATOR=PASS source=jankstats_ui_cpu screenrecord_free=1' .github/scripts/frontend-part3-final-proof.sh
          grep -Fq 'JANKSTATS_UI_CPU_EMULATOR=PASS' .github/scripts/frontend-part3-final-proof.sh
          if grep -Fq 'source=gfxinfo_summary screenrecord_free=1' .github/scripts/frontend-part3-final-proof.sh; then exit 1; fi
      - name: Push JankStats proof integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/frontend-part3-final-proof.sh
          git commit -m 'test(frontend): gate emulator UI CPU cost with JankStats'
          git push origin HEAD:veltrix-hom-frontend-part3-final
