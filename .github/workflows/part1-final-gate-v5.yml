name: Veltrix Part 1 FINAL Gate V5

on:
  push:
    branches: [veltrix-hom-part1-completion]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  final-gate-v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_DB: veltrix_vnext_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veltrix_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      VELTRIX_ENV: test
      VELTRIX_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
      VELTRIX_DATABASE_USER: postgres
      VELTRIX_DATABASE_PASSWORD: postgres
      VELTRIX_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
      VELTRIX_TEST_DATABASE_USER: postgres
      VELTRIX_TEST_DATABASE_PASSWORD: postgres
      VELTRIX_AI_PROVIDER: disabled
      VELTRIX_TEST_AI_MOCK: "true"
      VELTRIX_EMBEDDING_PROVIDER: disabled
      VELTRIX_TEST_EMBEDDING_MOCK: "true"
      VELTRIX_EMBEDDING_DIMENSIONS: "64"
      VELTRIX_TEST_OCR_MOCK: "true"
      VELTRIX_TEST_TRANSLATE_MOCK: "true"
      VELTRIX_STORAGE_PROVIDER: s3
      VELTRIX_S3_ENDPOINT: http://127.0.0.1:9000
      VELTRIX_S3_REGION: us-east-1
      VELTRIX_S3_BUCKET: veltrix-hom-vnext
      VELTRIX_S3_ACCESS_KEY: veltrixci
      VELTRIX_S3_SECRET_KEY: veltrixci-secret-2026
      VELTRIX_S3_PATH_STYLE: "true"
      VELTRIX_WORKERS_ENABLED: "false"
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android-avd

    steps:
      - name: Checkout exact normal source tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record clean exact provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p evidence/provenance
          printf 'repository=Rahmowin-1st/Veltrix-Hom-VNext\nbranch=%s\ncommit=%s\nrun_id=%s\nfoundation_checkpoint=d47d0876eb2ee30a480549a89b42382b4a31d8ed\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" | tee evidence/provenance/source.txt

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Start exact S3-compatible MinIO and bucket
        shell: bash
        run: |
          set -euo pipefail
          SERVER_IMAGE='minio/minio:RELEASE.2025-04-22T22-12-26Z'
          MC_IMAGE='minio/mc:RELEASE.2025-04-16T18-13-26Z'
          docker pull "$SERVER_IMAGE"
          docker pull "$MC_IMAGE"
          docker run -d --name veltrix-minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER="$VELTRIX_S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$VELTRIX_S3_SECRET_KEY" \
            "$SERVER_IMAGE" server /data --console-address ':9001'
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:9000/minio/health/ready
          docker run --rm --network host --entrypoint /bin/sh "$MC_IMAGE" -c \
            "mc alias set local '$VELTRIX_S3_ENDPOINT' '$VELTRIX_S3_ACCESS_KEY' '$VELTRIX_S3_SECRET_KEY' >/dev/null && mc mb --ignore-existing local/$VELTRIX_S3_BUCKET"
          docker inspect veltrix-minio --format '{{json .Config.Image}} {{json .Image}}' | tee evidence/minio-image.txt
          docker ps --filter name=veltrix-minio | tee evidence/minio.txt

      - name: PostgreSQL 17 pgvector readiness
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d veltrix_vnext_test -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d veltrix_vnext_test -c "SELECT version(); SELECT extversion FROM pg_extension WHERE extname='vector';" | tee evidence/postgres-pgvector.txt
          grep -q '0.8.2' evidence/postgres-pgvector.txt

      - name: Core and PostgreSQL server integration regression
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :core:test :server:test | tee evidence/gradle-server-tests.txt
          grep -q 'BUILD SUCCESSFUL' evidence/gradle-server-tests.txt

      - name: Deterministic 105 structure and OpenAPI drift gates
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_local_regressions.sh | tee evidence/deterministic-105.txt
          grep -q 'LOCAL_REGRESSION_GATE=PASS total=105' evidence/deterministic-105.txt
          bash scripts/verify_structure.sh | tee evidence/structure.txt
          grep -q 'STRUCTURE_VERIFY=PASS' evidence/structure.txt
          python3 -m pip install --quiet pyyaml
          python3 scripts/verify_openapi_drift.py | tee evidence/openapi-drift.txt
          grep -q 'OPENAPI_DRIFT=PASS' evidence/openapi-drift.txt

      - name: Static security and legacy isolation scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --exclude-dir=.git --exclude-dir=build --exclude='*.md' -nE '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' .
          ! grep -R --exclude-dir=build -n 'SYSTEM_ALERT_WINDOW' android
          echo 'STATIC_SECURITY_GATE=PASS' | tee evidence/security-static.txt

      - name: Start real Ktor with workers and prove health
        env:
          VELTRIX_WORKERS_ENABLED: "true"
        shell: bash
        run: |
          set -euo pipefail
          nohup gradle --no-daemon :server:run > evidence/server-run.txt 2>&1 &
          echo $! > evidence/server.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health > evidence/health.json; then break; fi
            sleep 2
          done
          cat evidence/health.json
          grep -q '"status":"ok"' evidence/health.json
          curl -fsS http://127.0.0.1:8080/ready | tee evidence/ready.json
          grep -q '"ready":true' evidence/ready.json
          grep -q '"database":"ok"' evidence/ready.json
          grep -q '"storageConfigured":true' evidence/ready.json
          grep -q '"embeddingConfigured":true' evidence/ready.json
          grep -q '"testAiConfigured":true' evidence/ready.json

      - name: Strong real HTTP cross-feature runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/http_runtime_smoke.py http://127.0.0.1:8080 | tee evidence/http-runtime-smoke.json
          grep -q '"HTTP_RUNTIME_SMOKE": "PASS"' evidence/http-runtime-smoke.json
          docker run --rm --network host --entrypoint /bin/sh minio/mc:RELEASE.2025-04-16T18-13-26Z -c \
            "mc alias set local '$VELTRIX_S3_ENDPOINT' '$VELTRIX_S3_ACCESS_KEY' '$VELTRIX_S3_SECRET_KEY' >/dev/null && mc ls --recursive local/$VELTRIX_S3_BUCKET" | tee evidence/minio-objects.txt
          test -s evidence/minio-objects.txt

      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install exact Android 17.0 platform build tools and emulator image
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-37.0' \
            'build-tools;37.0.0' \
            'platform-tools' \
            'emulator' \
            'system-images;android-37.0;google_apis;x86_64'
          sdkmanager --list_installed | tee evidence/android-sdk-installed.txt
          grep -q 'platforms;android-37.0' evidence/android-sdk-installed.txt
          grep -q 'system-images;android-37.0;google_apis;x86_64' evidence/android-sdk-installed.txt

      - name: Prepare Android emulator host runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libpulse0
          "$ANDROID_HOME/emulator/emulator" -version 2>&1 | tee evidence/emulator-version.txt
          grep -q 'Android emulator version' evidence/emulator-version.txt
          echo 'ANDROID_EMULATOR_HOST_RUNTIME_GATE=PASS' | tee evidence/emulator-host-runtime.txt

      - name: Build exact Android app and instrumentation APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :android:app:assembleDebug :android:app:assembleDebugAndroidTest | tee evidence/android-build.txt
          grep -q 'BUILD SUCCESSFUL' evidence/android-build.txt
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find android/app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f -size +0c | head -1)
          test -s "$APK"
          test -n "$TEST_APK" && test -s "$TEST_APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | tee evidence/android-badging.txt
          grep -q "package: name='com.veltrix.hom.vnext.dev'" evidence/android-badging.txt
          ! "$ANDROID_HOME/build-tools/37.0.0/aapt" dump permissions "$APK" | grep -q 'SYSTEM_ALERT_WINDOW'
          sha256sum "$APK" "$TEST_APK" | tee evidence/android-apk-build-sha256.txt

      - name: Boot Android 17.0 deterministic emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          test -e /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd \
            -n veltrix_vnext_api37 \
            -k 'system-images;android-37.0;google_apis;x86_64' -f
          avdmanager list avd | tee evidence/avd-list.txt
          grep -q 'Name: veltrix_vnext_api37' evidence/avd-list.txt
          AVD_CONFIG="$ANDROID_AVD_HOME/veltrix_vnext_api37.avd/config.ini"
          grep -q '^hw.ramSize=' "$AVD_CONFIG" && sed -i 's/^hw.ramSize=.*/hw.ramSize=4096/' "$AVD_CONFIG" || echo 'hw.ramSize=4096' >> "$AVD_CONFIG"
          grep -q '^hw.cpu.ncore=' "$AVD_CONFIG" && sed -i 's/^hw.cpu.ncore=.*/hw.cpu.ncore=2/' "$AVD_CONFIG" || echo 'hw.cpu.ncore=2' >> "$AVD_CONFIG"
          free -h | tee evidence/emulator-host-memory.txt
          nproc | tee evidence/emulator-host-cpus.txt
          cat "$AVD_CONFIG" | tee evidence/avd-config.txt

          adb kill-server || true
          adb start-server
          adb devices -l | tee evidence/adb-before-emulator.txt

          nohup "$ANDROID_HOME/emulator/emulator" @veltrix_vnext_api37 \
            -port 5554 -memory 4096 -cores 2 \
            -no-window -gpu software -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on \
            > evidence/emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" | tee evidence/emulator.pid

          SERIAL=''
          for i in $(seq 1 180); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo 'EMULATOR_PROCESS_EXITED_BEFORE_ADB=1' | tee evidence/emulator-boot-failure.txt
              break
            fi
            SERIAL=$(adb devices | awk 'NR>1 && $2 == "device" {print $1; exit}')
            if [ -n "$SERIAL" ]; then break; fi
            if [ "$i" -ge 15 ]; then adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true; fi
            if [ $((i % 15)) -eq 0 ]; then
              printf 'ADB_WAIT_ITERATION=%s\n' "$i" | tee -a evidence/emulator-boot-progress.txt
              adb devices -l | tee -a evidence/emulator-boot-progress.txt
              ss -ltnp 2>/dev/null | grep -E ':(5554|5555|8554)\b' | tee -a evidence/emulator-boot-progress.txt || true
              tail -100 evidence/emulator.log | tee evidence/emulator-log-tail.txt
            fi
            sleep 2
          done
          if [ -z "$SERIAL" ]; then
            adb devices -l | tee evidence/adb-failure.txt || true
            ss -ltnp 2>/dev/null | tee evidence/listening-ports-failure.txt || true
            ps -ef | grep -E '[e]mulator|[q]emu-system|[a]db' | tee evidence/emulator-processes-failure.txt || true
            cat evidence/emulator.log
            exit 1
          fi
          export ANDROID_SERIAL="$SERIAL"
          printf 'ANDROID_SERIAL=%s\n' "$SERIAL" | tee evidence/android-serial.txt

          BOOT_COMPLETED=0
          for i in $(seq 1 180); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ]; then
              BOOT_COMPLETED=1
              break
            fi
            if [ $((i % 15)) -eq 0 ]; then
              printf 'BOOT_WAIT_ITERATION=%s\n' "$i" | tee -a evidence/emulator-boot-progress.txt
              adb shell getprop ro.boot.bootreason 2>/dev/null | tee -a evidence/emulator-boot-progress.txt || true
              tail -100 evidence/emulator.log | tee evidence/emulator-log-tail.txt
            fi
            sleep 2
          done
          if [ "$BOOT_COMPLETED" -ne 1 ]; then
            adb shell getprop | tee evidence/emulator-getprop-failure.txt || true
            cat evidence/emulator.log
            exit 1
          fi

          adb devices -l | tee evidence/adb.txt
          adb shell getprop ro.build.version.release | tee evidence/emulator-release.txt
          adb shell getprop ro.build.version.sdk | tee evidence/emulator-api.txt
          grep -Fx '17' evidence/emulator-release.txt
          grep -Fx '37' evidence/emulator-api.txt
          echo 'ANDROID_API37_RUNTIME_BOOT_GATE=PASS' | tee evidence/android-runtime-boot.txt

      - name: Install exact APKs and cold launch
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find android/app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f -size +0c | head -1)
          adb install -r -t "$APK" | tee evidence/install-app.txt
          grep -q Success evidence/install-app.txt
          adb install -r -t "$TEST_APK" | tee evidence/install-test.txt
          grep -q Success evidence/install-test.txt
          adb shell am force-stop com.veltrix.hom.vnext.dev
          adb shell am start -W -n com.veltrix.hom.vnext.dev/com.veltrix.hom.vnext.MainActivity | tee evidence/cold-launch.txt
          grep -q 'Status: ok' evidence/cold-launch.txt

      - name: Android shell and real server integration instrumentation
        shell: bash
        run: |
          set -euo pipefail
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.hom.vnext.dev.*/\1/p' | head -1 | tr -d '\r')
          test -n "$I"
          adb shell am instrument -w -e class 'com.veltrix.hom.vnext.ShellInstrumentedTest' "$I" | tee evidence/shell-instrumentation.txt
          grep -q 'OK (1 test)' evidence/shell-instrumentation.txt
          adb shell am instrument -w -e class 'com.veltrix.hom.vnext.ServerIntegrationInstrumentedTest' "$I" | tee evidence/server-instrumentation.txt
          grep -q 'OK (1 test)' evidence/server-instrumentation.txt

      - name: Android process-death persistence runtime
        shell: bash
        run: |
          set -euo pipefail
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.hom.vnext.dev.*/\1/p' | head -1 | tr -d '\r')
          adb shell am instrument -w -e class 'com.veltrix.hom.vnext.PersistenceInstrumentedTest#aSeedProjectForProcessRestart' "$I" | tee evidence/process-seed.txt
          grep -q 'OK (1 test)' evidence/process-seed.txt
          adb shell am force-stop com.veltrix.hom.vnext.dev
          test -z "$(adb shell pidof com.veltrix.hom.vnext.dev 2>/dev/null || true)"
          adb shell am instrument -w -e class 'com.veltrix.hom.vnext.PersistenceInstrumentedTest#zVerifyProjectAfterProcessRestart' "$I" | tee evidence/process-verify.txt
          grep -q 'OK (1 test)' evidence/process-verify.txt

      - name: Android offline persistence runtime
        shell: bash
        run: |
          set -euo pipefail
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.hom.vnext.dev.*/\1/p' | head -1 | tr -d '\r')
          adb shell cmd connectivity airplane-mode enable || adb shell settings put global airplane_mode_on 1
          adb shell svc wifi disable || true
          sleep 2
          test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = '1'
          adb shell am instrument -w -e class 'com.veltrix.hom.vnext.OfflineDataInstrumentedTest#aSeedOfflineDurableState' "$I" | tee evidence/offline-seed.txt
          grep -q 'OK (1 test)' evidence/offline-seed.txt
          adb shell am force-stop com.veltrix.hom.vnext.dev
          adb shell am instrument -w -e class 'com.veltrix.hom.vnext.OfflineDataInstrumentedTest#zVerifyOfflineDurableStateAfterProcessRestart' "$I" | tee evidence/offline-verify.txt
          grep -q 'OK (1 test)' evidence/offline-verify.txt
          adb shell cmd connectivity airplane-mode disable || adb shell settings put global airplane_mode_on 0
          adb shell svc wifi enable || true

      - name: Full connected Android regression and final relaunch
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :android:app:connectedDebugAndroidTest | tee evidence/android-connected.txt
          grep -q 'BUILD SUCCESSFUL' evidence/android-connected.txt
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t "$APK" | tee evidence/reinstall.txt
          grep -q Success evidence/reinstall.txt
          adb shell am force-stop com.veltrix.hom.vnext.dev
          adb shell am start -W -n com.veltrix.hom.vnext.dev/com.veltrix.hom.vnext.MainActivity | tee evidence/final-launch.txt
          grep -q 'Status: ok' evidence/final-launch.txt

      - name: Package exact tested source APK evidence and hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final/evidence final/provenance
          cp -a evidence/. final/evidence/ 2>/dev/null || true
          git archive --format=zip --output=final/Veltrix-Hom-VNext-Part1-EXACT-TESTED-SOURCE.zip HEAD
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find android/app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f -size +0c 2>/dev/null | head -1 || true)
          if [ -s "$APK" ]; then cp "$APK" final/Veltrix-Hom-VNext-Part1-FINAL.apk; fi
          if [ -n "$TEST_APK" ] && [ -s "$TEST_APK" ]; then cp "$TEST_APK" final/Veltrix-Hom-VNext-Part1-ANDROID-TEST.apk; fi
          sha256sum final/Veltrix-Hom-VNext-Part1-EXACT-TESTED-SOURCE.zip | tee final/provenance/source_sha256.txt
          if [ -s final/Veltrix-Hom-VNext-Part1-FINAL.apk ]; then sha256sum final/Veltrix-Hom-VNext-Part1-FINAL.apk | tee final/provenance/apk_sha256.txt; fi
          if [ -s final/Veltrix-Hom-VNext-Part1-ANDROID-TEST.apk ]; then sha256sum final/Veltrix-Hom-VNext-Part1-ANDROID-TEST.apk | tee final/provenance/test_apk_sha256.txt; fi
          cp evidence/provenance/source.txt final/provenance/runtime.txt

      - name: Upload canonical V5 final handoff artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-hom-part1-final-v5-${{ github.run_id }}
          path: final/
          if-no-files-found: error
          retention-days: 30
