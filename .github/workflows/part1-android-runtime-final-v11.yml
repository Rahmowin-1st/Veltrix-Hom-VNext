name: Veltrix Part 1 Android Runtime Finalizer V11

on:
  push:
    branches: [veltrix-hom-part1-completion]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android-runtime-final-v11:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_DB: veltrix_vnext_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d veltrix_vnext_test"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      VELTRIX_ENV: test
      VELTRIX_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
      VELTRIX_DATABASE_USER: postgres
      VELTRIX_DATABASE_PASSWORD: postgres
      VELTRIX_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
      VELTRIX_TEST_DATABASE_USER: postgres
      VELTRIX_TEST_DATABASE_PASSWORD: postgres
      VELTRIX_AI_PROVIDER: disabled
      VELTRIX_TEST_AI_MOCK: "true"
      VELTRIX_EMBEDDING_PROVIDER: disabled
      VELTRIX_TEST_EMBEDDING_MOCK: "true"
      VELTRIX_EMBEDDING_DIMENSIONS: "64"
      VELTRIX_TEST_OCR_MOCK: "true"
      VELTRIX_TEST_TRANSLATE_MOCK: "true"
      VELTRIX_STORAGE_PROVIDER: s3
      VELTRIX_S3_ENDPOINT: http://127.0.0.1:9000
      VELTRIX_S3_REGION: us-east-1
      VELTRIX_S3_BUCKET: veltrix-hom-vnext
      VELTRIX_S3_ACCESS_KEY: veltrixci
      VELTRIX_S3_SECRET_KEY: veltrixci-secret-2026
      VELTRIX_S3_PATH_STYLE: "true"
      VELTRIX_WORKERS_ENABLED: "true"
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android-avd
      V10_BASE_SHA: dd6defbab6165a1cf3942e7032160509884f8ee3
      V10_RUN_ID: "31594099599"
      V10_ARTIFACT: veltrix-hom-part1-final-v10-31594099599

    steps:
      - name: Checkout and prove product equivalence import V10 evidence and APKs
        uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Import exact prior evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/prior-v10 evidence/provenance
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --name-only "$V10_BASE_SHA" HEAD | tee evidence/v11-product-diff.txt
          test "$(wc -l < evidence/v11-product-diff.txt | tr -d ' ')" -eq 1
          grep -Fx '.github/workflows/part1-android-runtime-final-v11.yml' evidence/v11-product-diff.txt
          gh run download "$V10_RUN_ID" -n "$V10_ARTIFACT" -D evidence/prior-v10
          grep -q BACKEND_EVIDENCE_REUSED_WITH_PRODUCT_EQUIVALENCE=PASS evidence/prior-v10/evidence/backend-equivalence-gate.txt
          grep -q V10_REAL_SERVER=PASS evidence/prior-v10/evidence/v10-server-gate.txt
          grep -q V10_ANDROID_BUILD=PASS evidence/prior-v10/evidence/v10-build-gate.txt
          grep -q V10_API37_BOOT=PASS evidence/prior-v10/evidence/v10-boot-gate.txt
          grep -q V10_INSTALL=PASS evidence/prior-v10/evidence/v10-install-gate.txt
          test -s evidence/prior-v10/Veltrix-Hom-VNext-Part1-FINAL.apk
          test -s evidence/prior-v10/Veltrix-Hom-VNext-Part1-ANDROID-TEST.apk
          sha256sum evidence/prior-v10/Veltrix-Hom-VNext-Part1-FINAL.apk evidence/prior-v10/Veltrix-Hom-VNext-Part1-ANDROID-TEST.apk | tee evidence/v11-imported-apk-sha256.txt
          echo V11_PRODUCT_EQUIVALENCE=PASS | tee evidence/v11-equivalence-gate.txt

      - name: Setup JDK Gradle real PostgreSQL MinIO and Ktor
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.5.1'}
      - name: Start real runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          S='minio/minio:RELEASE.2025-04-22T22-12-26Z'; M='minio/mc:RELEASE.2025-04-16T18-13-26Z'
          docker pull "$S"; docker pull "$M"
          docker run -d --name veltrix-minio-v11 -p 9000:9000 -p 9001:9001 -e MINIO_ROOT_USER="$VELTRIX_S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$VELTRIX_S3_SECRET_KEY" "$S" server /data --console-address ':9001'
          for i in $(seq 1 60); do curl -fsS --max-time 2 http://127.0.0.1:9000/minio/health/ready >/dev/null && break || sleep 2; done
          curl -fsS http://127.0.0.1:9000/minio/health/ready
          docker run --rm --network host --entrypoint /bin/sh "$M" -c "mc alias set local '$VELTRIX_S3_ENDPOINT' '$VELTRIX_S3_ACCESS_KEY' '$VELTRIX_S3_SECRET_KEY' >/dev/null && mc mb --ignore-existing local/$VELTRIX_S3_BUCKET"
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d veltrix_vnext_test -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d veltrix_vnext_test -c "SELECT extversion FROM pg_extension WHERE extname='vector';" | tee evidence/v11-pgvector.txt
          grep -q 0.8.2 evidence/v11-pgvector.txt
          nohup gradle --no-daemon :server:run > evidence/v11-server-run.txt 2>&1 &
          echo $! > evidence/v11-server.pid
          ready=0
          for i in $(seq 1 90); do if curl -fsS --max-time 3 http://127.0.0.1:8080/health > evidence/v11-health.json; then ready=1; break; fi; sleep 2; done
          test "$ready" -eq 1; grep -q '"status":"ok"' evidence/v11-health.json
          curl -fsS --max-time 3 http://127.0.0.1:8080/ready | tee evidence/v11-ready.json; grep -q '"ready":true' evidence/v11-ready.json
          ss -ltnp | grep ':8080' | tee evidence/v11-server-listener.txt
          echo V11_REAL_SERVER=PASS | tee evidence/v11-server-gate.txt

      - name: Setup Android 17 API 37
        uses: android-actions/setup-android@v3
      - name: Install exact emulator runtime
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'build-tools;37.0.0' 'platforms;android-37.0' 'system-images;android-37.0;google_apis;x86_64'
          sudo apt-get update; sudo apt-get install -y libpulse0
          "$ANDROID_HOME/emulator/emulator" -version 2>&1 | tee evidence/v11-emulator-version.txt

      - name: Boot API37 with swangle and stable framework
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm; test -r /dev/kvm && test -w /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n veltrix_v11_api37 -k 'system-images;android-37.0;google_apis;x86_64' -f
          C="$ANDROID_AVD_HOME/veltrix_v11_api37.avd/config.ini"
          grep -q '^hw.ramSize=' "$C" && sed -i 's/^hw.ramSize=.*/hw.ramSize=4096/' "$C" || echo hw.ramSize=4096 >> "$C"
          grep -q '^hw.cpu.ncore=' "$C" && sed -i 's/^hw.cpu.ncore=.*/hw.cpu.ncore=4/' "$C" || echo hw.cpu.ncore=4 >> "$C"
          grep -q '^disk.dataPartition.size=' "$C" && sed -i 's/^disk.dataPartition.size=.*/disk.dataPartition.size=4G/' "$C" || echo disk.dataPartition.size=4G >> "$C"
          adb kill-server || true; adb start-server
          nohup "$ANDROID_HOME/emulator/emulator" @veltrix_v11_api37 -port 5554 -memory 4096 -cores 4 -partition-size 4096 -no-window -gpu swangle -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > evidence/v11-emulator.log 2>&1 &
          EPID=$!; echo "$EPID" > evidence/v11-emulator.pid
          SERIAL=''
          for i in $(seq 1 180); do
            kill -0 "$EPID" 2>/dev/null || break
            SERIAL=$(adb devices | awk 'NR>1 && $2=="device" {print $1; exit}')
            [ -n "$SERIAL" ] && break
            [ "$i" -ge 15 ] && adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            sleep 2
          done
          test -n "$SERIAL"; export ANDROID_SERIAL="$SERIAL"; echo "ANDROID_SERIAL=$SERIAL" | tee evidence/v11-serial.txt
          for i in $(seq 1 180); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break || sleep 2; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          grep -Fx 17 <(adb shell getprop ro.build.version.release | tr -d '\r'); grep -Fx 37 <(adb shell getprop ro.build.version.sdk | tr -d '\r')
          AVAIL=$(adb shell df -Pk /data | awk 'NR==2 {print $4}' | tr -d '\r'); echo "DATA_AVAILABLE_KB=$AVAIL" | tee evidence/v11-data.txt; test "$AVAIL" -ge 524288
          echo V11_API37_BOOT=PASS | tee evidence/v11-boot-gate.txt

      - name: Install and execute resilient launch plus all device gates
        shell: bash
        run: |
          set -euo pipefail
          APK=evidence/prior-v10/Veltrix-Hom-VNext-Part1-FINAL.apk
          TEST_APK=evidence/prior-v10/Veltrix-Hom-VNext-Part1-ANDROID-TEST.apk
          PKG=com.veltrix.hom.vnext.dev; CMP=com.veltrix.hom.vnext.dev/com.veltrix.hom.vnext.MainActivity
          wait_framework() {
            local label="$1" stable=0 prev_s='' prev_f='' s f a p
            : > "evidence/v11-framework-${label}.txt"
            for i in $(seq 1 36); do
              adb wait-for-device >/dev/null 2>&1 || true
              s=$(adb shell pidof system_server 2>/dev/null | tr -d '\r' || true); f=$(adb shell pidof surfaceflinger 2>/dev/null | tr -d '\r' || true)
              a=$(adb shell service check activity 2>&1 | tr -d '\r' || true); p=$(adb shell service check package 2>&1 | tr -d '\r' || true)
              printf 'sample=%s system=%s surface=%s activity=%s package=%s\n' "$i" "$s" "$f" "$a" "$p" | tee -a "evidence/v11-framework-${label}.txt"
              if [ -n "$s" ] && [ -n "$f" ] && [ "$s" = "$prev_s" ] && [ "$f" = "$prev_f" ] && echo "$a" | grep -q found && echo "$p" | grep -q found; then stable=$((stable+1)); else stable=0; fi
              prev_s="$s"; prev_f="$f"; [ "$stable" -ge 3 ] && return 0; sleep 5
            done
            return 1
          }
          wait_framework pre-install
          adb push "$APK" /data/local/tmp/veltrix.apk | tee evidence/v11-push-app.txt
          adb shell pm install -r -t /data/local/tmp/veltrix.apk 2>&1 | tee evidence/v11-install-app.txt; grep -q '^Success$' evidence/v11-install-app.txt
          wait_framework after-app-install
          adb push "$TEST_APK" /data/local/tmp/veltrix-test.apk | tee evidence/v11-push-test.txt
          adb shell pm install -r -t /data/local/tmp/veltrix-test.apk 2>&1 | tee evidence/v11-install-test.txt; grep -q '^Success$' evidence/v11-install-test.txt
          wait_framework after-test-install
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.hom.vnext.dev.*/\1/p' | head -1 | tr -d '\r'); test -n "$I"; echo "$I" | tee evidence/v11-instrumentation.txt
          adb shell pm path "$PKG" | tee evidence/v11-package-path.txt; grep -q '^package:' evidence/v11-package-path.txt
          echo V11_INSTALL=PASS | tee evidence/v11-install-gate.txt

          LAUNCH_OK=0; : > evidence/v11-launch-attempts.txt
          for attempt in $(seq 1 6); do
            wait_framework "pre-launch-${attempt}"
            SB=$(adb shell pidof system_server 2>/dev/null | tr -d '\r' || true); FB=$(adb shell pidof surfaceflinger 2>/dev/null | tr -d '\r' || true)
            adb logcat -c || true; adb shell am force-stop "$PKG" || true
            OUT=$(adb shell am start -S -n "$CMP" 2>&1 || true); printf 'attempt=%s before_system=%s before_surface=%s command=%s\n' "$attempt" "$SB" "$FB" "$OUT" | tee -a evidence/v11-launch-attempts.txt
            sleep 4; wait_framework "post-launch-${attempt}"
            SA=$(adb shell pidof system_server 2>/dev/null | tr -d '\r' || true); FA=$(adb shell pidof surfaceflinger 2>/dev/null | tr -d '\r' || true); PID=$(adb shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)
            adb shell dumpsys activity activities > "evidence/v11-activity-${attempt}.txt"; adb shell dumpsys window windows > "evidence/v11-window-${attempt}.txt"
            STATE="$((grep -m1 -E 'mResumedActivity|topResumedActivity|ResumedActivity' "evidence/v11-activity-${attempt}.txt" || true; grep -m1 -E 'mCurrentFocus|mFocusedApp' "evidence/v11-window-${attempt}.txt" || true) | tr '\n' ' ')"
            printf 'attempt=%s after_system=%s after_surface=%s app_pid=%s state=%s\n' "$attempt" "$SA" "$FA" "$PID" "$STATE" | tee -a evidence/v11-launch-attempts.txt
            if [ -n "$PID" ] && echo "$STATE" | grep -q "$PKG"; then LAUNCH_OK=1; break; fi
            adb logcat -d -b all -t 1200 > "evidence/v11-logcat-launch-${attempt}.txt" 2>&1 || true
          done
          test "$LAUNCH_OK" -eq 1
          echo V11_COLD_LAUNCH=PASS | tee evidence/v11-cold-gate.txt

          adb shell am instrument -w -e class com.veltrix.hom.vnext.ShellInstrumentedTest "$I" | tee evidence/v11-shell-test.txt; grep -q 'OK (1 test)' evidence/v11-shell-test.txt
          curl -fsS --max-time 3 http://127.0.0.1:8080/health | tee evidence/v11-pre-server-health.json; grep -q '"status":"ok"' evidence/v11-pre-server-health.json
          adb reverse --remove tcp:8080 >/dev/null 2>&1 || true; adb reverse tcp:8080 tcp:8080
          adb reverse --list | tee evidence/v11-adb-reverse.txt; grep -Eq 'tcp:8080.*tcp:8080' evidence/v11-adb-reverse.txt
          wait_framework before-server-test
          adb shell am instrument -w -e class com.veltrix.hom.vnext.ServerIntegrationInstrumentedTest "$I" | tee evidence/v11-server-device-test.txt; grep -q 'OK (1 test)' evidence/v11-server-device-test.txt
          echo V11_SERVER_DEVICE=PASS | tee evidence/v11-server-device-gate.txt

          adb shell am instrument -w -e class 'com.veltrix.hom.vnext.PersistenceInstrumentedTest#aSeedProjectForProcessRestart' "$I" | tee evidence/v11-process-seed.txt; grep -q 'OK (1 test)' evidence/v11-process-seed.txt
          adb shell am force-stop "$PKG"; test -z "$(adb shell pidof "$PKG" 2>/dev/null || true)"
          adb shell am instrument -w -e class 'com.veltrix.hom.vnext.PersistenceInstrumentedTest#zVerifyProjectAfterProcessRestart' "$I" | tee evidence/v11-process-verify.txt; grep -q 'OK (1 test)' evidence/v11-process-verify.txt
          echo V11_PROCESS_DEATH=PASS | tee evidence/v11-process-gate.txt

          adb shell cmd connectivity airplane-mode enable || adb shell settings put global airplane_mode_on 1; adb shell svc wifi disable || true; sleep 2
          test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = 1
          adb shell am instrument -w -e class 'com.veltrix.hom.vnext.OfflineDataInstrumentedTest#aSeedOfflineDurableState' "$I" | tee evidence/v11-offline-seed.txt; grep -q 'OK (1 test)' evidence/v11-offline-seed.txt
          adb shell am force-stop "$PKG"
          adb shell am instrument -w -e class 'com.veltrix.hom.vnext.OfflineDataInstrumentedTest#zVerifyOfflineDurableStateAfterProcessRestart' "$I" | tee evidence/v11-offline-verify.txt; grep -q 'OK (1 test)' evidence/v11-offline-verify.txt
          echo V11_OFFLINE=PASS | tee evidence/v11-offline-gate.txt
          adb shell cmd connectivity airplane-mode disable || adb shell settings put global airplane_mode_on 0; adb shell svc wifi enable || true
          for i in $(seq 1 30); do [ "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = 0 ] && break || sleep 1; done
          wait_framework after-network-restore; adb reverse tcp:8080 tcp:8080

          adb shell pm clear "$PKG" | tee evidence/v11-pre-full-clear.txt; grep -q Success evidence/v11-pre-full-clear.txt
          adb shell am instrument -w "$I" 2>&1 | tee evidence/v11-connected.txt
          grep -q 'OK (6 tests)' evidence/v11-connected.txt
          echo V11_CONNECTED_6_TESTS=PASS | tee evidence/v11-connected-gate.txt
          echo V11_ANDROID_RUNTIME_ALL=PASS | tee evidence/v11-runtime-all.txt

      - name: Final all-green marker
        shell: bash
        run: |
          set -euo pipefail
          for marker in \
            'V11_PRODUCT_EQUIVALENCE=PASS:evidence/v11-equivalence-gate.txt' \
            'V11_REAL_SERVER=PASS:evidence/v11-server-gate.txt' \
            'V11_API37_BOOT=PASS:evidence/v11-boot-gate.txt' \
            'V11_INSTALL=PASS:evidence/v11-install-gate.txt' \
            'V11_COLD_LAUNCH=PASS:evidence/v11-cold-gate.txt' \
            'V11_SERVER_DEVICE=PASS:evidence/v11-server-device-gate.txt' \
            'V11_PROCESS_DEATH=PASS:evidence/v11-process-gate.txt' \
            'V11_OFFLINE=PASS:evidence/v11-offline-gate.txt' \
            'V11_CONNECTED_6_TESTS=PASS:evidence/v11-connected-gate.txt' \
            'V11_ANDROID_RUNTIME_ALL=PASS:evidence/v11-runtime-all.txt'; do
              text=${marker%%:*}; file=${marker#*:}; grep -q "$text" "$file"
          done
          printf '%s\n' 'VELTRIX HOM vNEXT PART 1 BACKEND / CORE / INTELLIGENCE FOUNDATION: ACCEPTANCE CANDIDATE — FINAL GATE GREEN' | tee evidence/FINAL_STATUS.txt
          echo FINAL_COMBINED_GATE_V11=PASS | tee evidence/v11-final-gate.txt

      - name: Package exact current source tested APKs combined evidence and hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final; mkdir -p final/evidence final/provenance final/handoff/docs final/handoff/contracts
          cp -a evidence/. final/evidence/ 2>/dev/null || true
          git archive --format=zip --output=final/Veltrix-Hom-VNext-Part1-EXACT-TESTED-SOURCE.zip HEAD
          cp evidence/prior-v10/Veltrix-Hom-VNext-Part1-FINAL.apk final/Veltrix-Hom-VNext-Part1-FINAL.apk
          cp evidence/prior-v10/Veltrix-Hom-VNext-Part1-ANDROID-TEST.apk final/Veltrix-Hom-VNext-Part1-ANDROID-TEST.apk
          cp docs/FINAL_MANAGER_HANDOFF.md docs/Test_Report.md docs/Security_Report.md docs/Performance_Report.md docs/Known_Limitations.md docs/VERIFIED_CLAIMED_NOT_VERIFIED.md final/
          cp contracts/openapi.yaml final/OpenAPI-final.yaml; cp docs/Migration_Report.md final/DB_Migration_Report.md
          cp docs/Part2_Integration_Contract.md final/Part2_Integration_Contract.md; cp docs/Part3_Frontend_Handoff.md final/Part3_Frontend_Handoff.md
          cp -a docs/. final/handoff/docs/; cp -a contracts/. final/handoff/contracts/; cp README.md CHECKPOINT_IMPORT_PROVENANCE.md final/handoff/
          [ -s evidence/FINAL_STATUS.txt ] && cp evidence/FINAL_STATUS.txt final/ || true
          printf 'repository=Rahmowin-1st/Veltrix-Hom-VNext\nbranch=%s\ncommit=%s\nrun_id=%s\napk_built_in_product_equivalent_run=%s\napk_product_equivalent_commit=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$V10_RUN_ID" "$V10_BASE_SHA" | tee final/provenance/runtime.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          for src,dst in [('final/evidence','final/Veltrix-Hom-VNext-Part1-EVIDENCE.zip'),('final/handoff','final/Veltrix-Hom-VNext-Part1-HANDOFF.zip')]:
              with zipfile.ZipFile(dst,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for f in sorted(Path(src).rglob('*')):
                      if f.is_file(): z.write(f,f.relative_to(src))
          PY
          (cd final && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat final/SHA256SUMS

      - name: Upload V11 final artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-hom-part1-final-v11-${{ github.run_id }}
          path: final/
          if-no-files-found: error
          retention-days: 30
