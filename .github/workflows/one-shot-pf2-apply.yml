name: One-shot apply validated PF2 patch

on:
  push:
    branches: [veltrix-hom-frontend-part3-final]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veltrix-hom-frontend-part3-final
          fetch-depth: 0
      - name: Extract and apply already-reviewed PF2 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/one-shot-pf2-hardening.yml').read_text()
          start="          cat > /tmp/pf2.patch <<'PATCH'\n"
          end="          PATCH\n"
          if start not in src: raise SystemExit('PF2 patch start missing')
          body=src.split(start,1)[1].split(end,1)[0]
          # YAML block scalar contributes ten leading spaces to every embedded patch line.
          lines=[]
          for line in body.splitlines():
              if not line.startswith('          '): raise SystemExit(f'unexpected patch indentation: {line!r}')
              lines.append(line[10:])
          Path('/tmp/pf2.patch').write_text('\n'.join(lines)+'\n')
          PY
          git apply --check /tmp/pf2.patch
          git apply /tmp/pf2.patch
          bash -n .github/scripts/frontend-part3-final-proof.sh
          git diff --check
          grep -Fq 'source=gfxinfo_summary screenrecord_free=1' .github/scripts/frontend-part3-final-proof.sh
          grep -Fq 'EDGE=$((32*DENSITY/160))' .github/scripts/frontend-part3-final-proof.sh
          if grep -Fq 'source=gfxinfo_framestats' .github/scripts/frontend-part3-final-proof.sh; then exit 1; fi
      - name: Push proof-script PF2 hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/frontend-part3-final-proof.sh
          git commit -m 'test(frontend): isolate motion capture from frame pacing'
          git push origin HEAD:veltrix-hom-frontend-part3-final
