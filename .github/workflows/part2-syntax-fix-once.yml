name: Part 2 One-Time Syntax Repair

on:
  push:
    branches: [veltrix-hom-part2-backend]
    paths: ['.github/workflows/part2-syntax-fix-once.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veltrix-hom-part2-backend
          fetch-depth: 0
      - name: Apply exact lexer repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server/src/main/kotlin/com/veltrix/hom/vnext/server/Part2GameRepository.kt')
          s=p.read_text()
          replacements={
            ':List<GameStateEventResponse>=db.tx': ':List<GameStateEventResponse> = db.tx',
            ':List<MapUnitResponse>=c.prepareStatement': ':List<MapUnitResponse> = c.prepareStatement',
            ':Triple<Long,Int,Long>=c.prepareStatement': ':Triple<Long,Int,Long> = c.prepareStatement',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'expected token missing: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          git diff --exit-code --quiet && { echo 'no repair produced'; exit 1; } || true
      - name: Persist repair
        run: |
          git config user.name 'Veltrix Backend CI'
          git config user.email 'actions@users.noreply.github.com'
          git add server/src/main/kotlin/com/veltrix/hom/vnext/server/Part2GameRepository.kt
          git commit -m 'fix(part2): repair Kotlin generic lexer spacing'
          git push origin HEAD:veltrix-hom-part2-backend
