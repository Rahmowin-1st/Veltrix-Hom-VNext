name: Part 2 One-Time Game Event SQL Repair

on:
  push:
    branches: [veltrix-hom-part2-backend]
    paths: ['.github/workflows/part2-emit-fix-once.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veltrix-hom-part2-backend
          fetch-depth: 0
      - name: Repair game state event parameter layout and remove obsolete bridge/controller
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server/src/main/kotlin/com/veltrix/hom/vnext/server/Part2GameRepository.kt')
          s=p.read_text()
          old='VALUES (?::uuid,?,?,?,?,?::uuid,?,?::jsonb,?) ON CONFLICT(account_id,idempotency_key) DO NOTHING'
          new='VALUES (?::uuid,?,?,?,?::uuid,?,?::jsonb,?) ON CONFLICT(account_id,idempotency_key) DO NOTHING'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one broken game_state_event placeholder layout, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f database/migrations/V006__part2_activity_event_bridge.sql
          rm -f .github/workflows/part2-integration-apply-once.yml
          git diff --check
          grep -F 'VALUES (?::uuid,?,?,?,?::uuid,?,?::jsonb,?) ON CONFLICT(account_id,idempotency_key) DO NOTHING' server/src/main/kotlin/com/veltrix/hom/vnext/server/Part2GameRepository.kt
          test ! -e database/migrations/V006__part2_activity_event_bridge.sql
          test ! -e .github/workflows/part2-integration-apply-once.yml
      - name: Persist root-cause repair
        run: |
          git config user.name 'Veltrix Backend CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(part2): repair game state event persistence'
          git push origin HEAD:veltrix-hom-part2-backend
