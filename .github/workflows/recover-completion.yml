name: Recover completion archive

on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-completion.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v4
        with:
          ref: veltrix-hom-part1-completion

      - name: Repair corrupted transport chunks by manifest hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered/repaired recovered/source recovered/diagnostics
          cp ci/source-v2/c*.b64 recovered/repaired/
          python3 - <<'PY' | tee recovered/diagnostics/repair.txt
          import hashlib, pathlib, re
          root=pathlib.Path('ci/source-v2')
          out=pathlib.Path('recovered/repaired')
          manifest=(root/'MANIFEST.txt').read_text()
          alpha=b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          bad=[]
          for p in sorted(root.glob('c*.b64')):
              name=p.stem
              m=re.search(rf'^{name}_sha256=([0-9a-f]{{64}})$',manifest,re.M)
              target=bytes.fromhex(m.group(1))
              data=bytearray(p.read_bytes())
              current=hashlib.sha256(data).digest()
              if current==target:
                  print(name,'PASS')
                  continue
              print(name,'MISMATCH','searching_single_substitution')
              found=None
              for i,orig in enumerate(data):
                  for ch in alpha:
                      if ch==orig: continue
                      data[i]=ch
                      if hashlib.sha256(data).digest()==target:
                          found=(i,orig,ch)
                          break
                  if found: break
                  data[i]=orig
              if found:
                  i,orig,ch=found
                  print(name,'REPAIRED',f'offset={i}',f'{chr(orig)}->{chr(ch)}')
                  (out/p.name).write_bytes(data)
                  assert hashlib.sha256(data).digest()==target
              else:
                  data=bytearray(p.read_bytes())
                  bad.append(name)
                  print(name,'NO_SINGLE_SUBSTITUTION_MATCH')
          print('UNREPAIRED',','.join(bad) if bad else 'NONE')
          pathlib.Path('recovered/diagnostics/unrepaired.txt').write_text('\n'.join(bad))
          PY

          echo '=== repaired chunk integrity ===' | tee recovered/diagnostics/repaired-integrity.txt
          BAD=0
          for f in recovered/repaired/c*.b64; do
            n="$(basename "$f" .b64)"
            expected="$(sed -n "s/^${n}_sha256=//p" ci/source-v2/MANIFEST.txt)"
            actual="$(sha256sum "$f" | awk '{print $1}')"
            if [ "$expected" = "$actual" ]; then state=PASS; else state=FAIL; BAD=$((BAD+1)); fi
            echo "$n $state expected=$expected actual=$actual" | tee -a recovered/diagnostics/repaired-integrity.txt
          done
          echo "bad_after_repair=$BAD" | tee -a recovered/diagnostics/repaired-integrity.txt

          cat recovered/repaired/c*.b64 > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.xz
          expected_archive="$(sed -n 's/^archive_sha256=//p' ci/source-v2/MANIFEST.txt)"
          actual_archive="$(sha256sum /tmp/source.tar.xz | awk '{print $1}')"
          printf 'expected_archive=%s\nactual_archive=%s\n' "$expected_archive" "$actual_archive" | tee recovered/diagnostics/archive-integrity.txt

          if [ "$BAD" -eq 0 ] && [ "$expected_archive" = "$actual_archive" ]; then
            xz -t /tmp/source.tar.xz
            tar -xJf /tmp/source.tar.xz -C recovered/source
            find recovered/source -type f | sort > recovered/file-list.txt
            echo "archive_exact=YES" | tee recovered/summary.txt
            echo "file_count=$(wc -l < recovered/file-list.txt)" | tee -a recovered/summary.txt
            du -sh recovered/source | tee -a recovered/summary.txt
            ROOT=recovered/source
            if [ "$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ] && [ ! -d "$ROOT/android" ]; then
              ONE="$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | head -1)"
              if [ -d "$ONE/android" ] || [ -d "$ONE/server" ]; then ROOT="$ONE"; fi
            fi
            echo "source_root=$ROOT" | tee -a recovered/summary.txt
            for p in android server core contracts database docs scripts .github; do
              if [ -e "$ROOT/$p" ]; then echo "FOUND $p"; else echo "MISSING $p"; fi
            done | tee recovered/structure.txt
            grep -RIl --exclude-dir=.git 'PromptPolicyComposer\|S3CompatibleStorageAdapter\|MemoryCandidate\|HybridRetrieval\|pgvector' "$ROOT" | sort | head -300 > recovered/completion-markers.txt || true
          else
            echo "archive_exact=NO" | tee recovered/summary.txt
          fi

      - name: Upload recovery result
        uses: actions/upload-artifact@v4
        with:
          name: recovered-completion-source
          path: recovered
          if-no-files-found: error
