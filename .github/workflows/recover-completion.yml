name: Recover completion archive

on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-completion.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v4
        with:
          ref: veltrix-hom-part1-completion

      - name: Reassemble and inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered/source
          cat ci/source-v2/c*.b64 > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.xz
          xz -t /tmp/source.xz
          xz -dc /tmp/source.xz > /tmp/source.payload
          file /tmp/source.payload | tee recovered/payload-type.txt
          sha256sum /tmp/source.xz /tmp/source.payload | tee recovered/hashes.txt
          tar -tf /tmp/source.payload > recovered/tar-list.txt
          tar -xf /tmp/source.payload -C recovered/source
          find recovered/source -type f | sort > recovered/file-list.txt
          echo "file_count=$(wc -l < recovered/file-list.txt)" | tee recovered/summary.txt
          du -sh recovered/source | tee -a recovered/summary.txt
          ROOT=recovered/source
          if [ "$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ] && [ ! -d "$ROOT/android" ]; then
            ONE="$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | head -1)"
            if [ -d "$ONE/android" ] || [ -d "$ONE/server" ]; then ROOT="$ONE"; fi
          fi
          echo "source_root=$ROOT" | tee -a recovered/summary.txt
          for p in android server core contracts database docs scripts .github; do
            if [ -e "$ROOT/$p" ]; then echo "FOUND $p"; else echo "MISSING $p"; fi
          done | tee recovered/structure.txt
          grep -RIl --exclude-dir=.git 'PromptPolicyComposer\|S3CompatibleStorageAdapter\|MemoryCandidate\|HybridRetrieval\|pgvector' "$ROOT" | sort | head -200 > recovered/completion-markers.txt || true

      - name: Upload recovered source
        uses: actions/upload-artifact@v4
        with:
          name: recovered-completion-source
          path: recovered
          if-no-files-found: error
