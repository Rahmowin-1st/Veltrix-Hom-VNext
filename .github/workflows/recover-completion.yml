name: Recover completion archive

on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-completion.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v4
        with:
          ref: veltrix-hom-part1-completion

      - name: Diagnose and reassemble sealed source
        shell: bash
        run: |
          set -u
          mkdir -p recovered/source recovered/diagnostics
          ls -l ci/source-v2/c*.b64 | tee recovered/diagnostics/chunks.txt
          : > recovered/diagnostics/chunk-details.txt
          for f in ci/source-v2/c*.b64; do
            printf '%s chars=%s tail=' "$f" "$(wc -c < "$f")" >> recovered/diagnostics/chunk-details.txt
            tail -c 24 "$f" >> recovered/diagnostics/chunk-details.txt
            printf ' decoded=' >> recovered/diagnostics/chunk-details.txt
            if base64 -d "$f" > "/tmp/$(basename "$f").bin" 2>/tmp/b64.err; then
              wc -c < "/tmp/$(basename "$f").bin" | tr -d '\n' >> recovered/diagnostics/chunk-details.txt
            else
              printf 'FAIL:' >> recovered/diagnostics/chunk-details.txt
              tr '\n' ' ' < /tmp/b64.err >> recovered/diagnostics/chunk-details.txt
            fi
            printf '\n' >> recovered/diagnostics/chunk-details.txt
          done
          cat recovered/diagnostics/chunk-details.txt

          # Strategy A: concatenate encoded chunks then decode once.
          cat ci/source-v2/c*.b64 > /tmp/source-a.b64
          base64 -d /tmp/source-a.b64 > /tmp/source-a.xz 2>recovered/diagnostics/a-base64.err || true
          echo "strategy_a_size=$(wc -c < /tmp/source-a.xz)" | tee recovered/diagnostics/strategy-a.txt
          sha256sum /tmp/source-a.xz | tee -a recovered/diagnostics/strategy-a.txt
          xxd -l 16 /tmp/source-a.xz | tee -a recovered/diagnostics/strategy-a.txt
          tail -c 32 /tmp/source-a.xz | xxd | tee -a recovered/diagnostics/strategy-a.txt
          if xz -t /tmp/source-a.xz 2>recovered/diagnostics/a-xz.err; then echo 'strategy_a_xz=PASS' | tee -a recovered/diagnostics/strategy-a.txt; else echo 'strategy_a_xz=FAIL' | tee -a recovered/diagnostics/strategy-a.txt; cat recovered/diagnostics/a-xz.err; fi

          # Strategy B: decode every chunk independently, then concatenate bytes.
          : > /tmp/source-b.xz
          for f in ci/source-v2/c*.b64; do
            base64 -d "$f" >> /tmp/source-b.xz 2>>recovered/diagnostics/b-base64.err || true
          done
          echo "strategy_b_size=$(wc -c < /tmp/source-b.xz)" | tee recovered/diagnostics/strategy-b.txt
          sha256sum /tmp/source-b.xz | tee -a recovered/diagnostics/strategy-b.txt
          xxd -l 16 /tmp/source-b.xz | tee -a recovered/diagnostics/strategy-b.txt
          tail -c 32 /tmp/source-b.xz | xxd | tee -a recovered/diagnostics/strategy-b.txt
          if xz -t /tmp/source-b.xz 2>recovered/diagnostics/b-xz.err; then echo 'strategy_b_xz=PASS' | tee -a recovered/diagnostics/strategy-b.txt; else echo 'strategy_b_xz=FAIL' | tee -a recovered/diagnostics/strategy-b.txt; cat recovered/diagnostics/b-xz.err; fi

          SOURCE=''
          if xz -t /tmp/source-a.xz 2>/dev/null; then SOURCE=/tmp/source-a.xz; fi
          if [ -z "$SOURCE" ] && xz -t /tmp/source-b.xz 2>/dev/null; then SOURCE=/tmp/source-b.xz; fi
          if [ -n "$SOURCE" ]; then
            xz -dc "$SOURCE" > /tmp/source.payload
            file /tmp/source.payload | tee recovered/payload-type.txt
            sha256sum "$SOURCE" /tmp/source.payload | tee recovered/hashes.txt
            if tar -tf /tmp/source.payload > recovered/tar-list.txt 2>recovered/diagnostics/tar.err; then
              tar -xf /tmp/source.payload -C recovered/source
              find recovered/source -type f | sort > recovered/file-list.txt
              echo "file_count=$(wc -l < recovered/file-list.txt)" | tee recovered/summary.txt
              du -sh recovered/source | tee -a recovered/summary.txt
              ROOT=recovered/source
              if [ "$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ] && [ ! -d "$ROOT/android" ]; then
                ONE="$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | head -1)"
                if [ -d "$ONE/android" ] || [ -d "$ONE/server" ]; then ROOT="$ONE"; fi
              fi
              echo "source_root=$ROOT" | tee -a recovered/summary.txt
              for p in android server core contracts database docs scripts .github; do
                if [ -e "$ROOT/$p" ]; then echo "FOUND $p"; else echo "MISSING $p"; fi
              done | tee recovered/structure.txt
              grep -RIl --exclude-dir=.git 'PromptPolicyComposer\|S3CompatibleStorageAdapter\|MemoryCandidate\|HybridRetrieval\|pgvector' "$ROOT" | sort | head -200 > recovered/completion-markers.txt || true
            fi
          else
            echo 'NO_VALID_XZ_STREAM' | tee recovered/summary.txt
          fi

      - name: Upload diagnostics and recovered source
        uses: actions/upload-artifact@v4
        with:
          name: recovered-completion-source
          path: recovered
          if-no-files-found: error
