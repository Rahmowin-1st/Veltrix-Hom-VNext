name: Veltrix Part 3 Final Verification

on:
  push:
    branches: [veltrix-hom-backend-part3-final]
  workflow_dispatch:

concurrency:
  group: veltrix-part3-final-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  FROZEN_PART1_SHA: fe4b2528a0a7da550351d926d44cc025e49dcafc
  VERIFIED_PART2_SHA: 2e70908f65bb25d23e87a9ddc690b8ea09f3040e
  IMAGE_PACKAGE: system-images;android-36;google_apis;x86_64
  GPU_MODE: swiftshader_indirect
  VELTRIX_ENV: test
  VELTRIX_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
  VELTRIX_DATABASE_USER: postgres
  VELTRIX_DATABASE_PASSWORD: postgres
  VELTRIX_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/veltrix_vnext_test
  VELTRIX_TEST_DATABASE_USER: postgres
  VELTRIX_TEST_DATABASE_PASSWORD: postgres
  VELTRIX_AI_PROVIDER: disabled
  VELTRIX_TEST_AI_MOCK: 'true'
  VELTRIX_EMBEDDING_PROVIDER: disabled
  VELTRIX_TEST_EMBEDDING_MOCK: 'true'
  VELTRIX_EMBEDDING_DIMENSIONS: '64'
  VELTRIX_TEST_OCR_MOCK: 'true'
  VELTRIX_TEST_TRANSLATE_MOCK: 'true'
  VELTRIX_STORAGE_PROVIDER: local
  VELTRIX_WORKERS_ENABLED: 'true'
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android-avd

jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_DB: veltrix_vnext_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d veltrix_vnext_test"
          --health-interval 5s --health-timeout 5s --health-retries 30

    steps:
      - name: Checkout exact Part 3 source
        uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Prove source and ancestry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence package artifact
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git cat-file -e "$FROZEN_PART1_SHA^{commit}"
          git cat-file -e "$VERIFIED_PART2_SHA^{commit}"
          git merge-base --is-ancestor "$FROZEN_PART1_SHA" "$GITHUB_SHA"
          git merge-base --is-ancestor "$VERIFIED_PART2_SHA" "$GITHUB_SHA"
          git diff --name-only "$VERIFIED_PART2_SHA" "$GITHUB_SHA" | sort > evidence/part3-delta.txt
          test -s evidence/part3-delta.txt
          printf 'repo=%s\nbranch=%s\ncommit=%s\nfrozen_part1=%s\nverified_part2=%s\nrun=%s\njob_name=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$FROZEN_PART1_SHA" "$VERIFIED_PART2_SHA" "$GITHUB_RUN_ID" "$GITHUB_JOB" | tee evidence/provenance.txt
          echo PART3_PROVENANCE=PASS | tee evidence/provenance-gate.txt

      - name: Setup Java and Gradle
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.5.1'}

      - name: Real PostgreSQL, migrations, regressions and authority
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d veltrix_vnext_test -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          gradle --no-daemon :core:test :server:test | tee evidence/backend-tests.txt
          grep -q 'BUILD SUCCESSFUL' evidence/backend-tests.txt
          bash scripts/run_local_regressions.sh | tee evidence/frozen-regressions.txt
          psql -h 127.0.0.1 -U postgres -d veltrix_vnext_test -Atc "SELECT script||':'||success FROM flyway_schema_history WHERE script IN ('V007__part3_final_capability_expansion.sql','V008__part3_final_depth.sql') ORDER BY script" | tee evidence/part3-migrations.txt
          grep -q 'V007__part3_final_capability_expansion.sql:t' evidence/part3-migrations.txt
          grep -q 'V008__part3_final_depth.sql:t' evidence/part3-migrations.txt
          test "$(psql -h 127.0.0.1 -U postgres -d veltrix_vnext_test -Atc "SELECT count(*) FROM avatar_catalog WHERE active")" = 135
          test "$(psql -h 127.0.0.1 -U postgres -d veltrix_vnext_test -Atc "SELECT count(*) FROM learning_mode_definition WHERE state='ACTIVE'")" = 9
          test "$(psql -h 127.0.0.1 -U postgres -d veltrix_vnext_test -Atc "SELECT count(*) FROM map_unit WHERE map_definition_id='foundation-map' AND map_version=2")" = 10
          test "$(psql -h 127.0.0.1 -U postgres -d veltrix_vnext_test -Atc "SELECT part3_max_level_for_days(89)||','||part3_max_level_for_days(90)")" = '49,50'
          test -s android/app/schemas/com.veltrix.hom.vnext.Part3LocalDatabase/1.json
          test -s android/app/schemas/com.veltrix.hom.vnext.VeltrixLocalDatabase/2.json
          ! grep -R --line-number -E 'xpAmount.*call.receive|coinAmount.*call.receive|priceCoins.*call.receive' server/src/main/kotlin
          echo PART3_BACKEND_REAL_POSTGRES=PASS | tee evidence/backend-gate.txt
          echo PART3_PART1_PART2_REGRESSION=PASS | tee evidence/regression-gate.txt
          echo PART3_DB_AUTHORITY=PASS | tee evidence/db-authority-gate.txt

      - name: Start exact Ktor and run Part 2 compatibility plus Part 3 HTTP
        shell: bash
        run: |
          set -euo pipefail
          nohup gradle --no-daemon :server:run > evidence/server.log 2>&1 &
          echo $! > evidence/server.pid
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:8080/ready > evidence/ready.json; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          grep -q '"ready":true' evidence/ready.json
          VELTRIX_API_BASE_URL=http://127.0.0.1:8080 python3 scripts/part2_http_runtime_smoke.py | tee evidence/part2-http-smoke.txt
          grep -q PART2_HTTP_RUNTIME_SMOKE=PASS evidence/part2-http-smoke.txt
          VELTRIX_API_BASE_URL=http://127.0.0.1:8080 python3 scripts/part3_http_runtime_smoke.py | tee evidence/part3-http-smoke.txt
          grep -q PART3_HTTP_RUNTIME_SMOKE=PASS evidence/part3-http-smoke.txt
          grep -q PART3_HTTP_PART2_EXPORT_COMPAT=PASS evidence/part3-http-smoke.txt
          VELTRIX_API_BASE_URL=http://127.0.0.1:8080 python3 scripts/part2_performance_smoke.py | tee evidence/performance-smoke.txt
          grep -q PART2_PERFORMANCE_SMOKE=PASS evidence/performance-smoke.txt
          echo PART3_REAL_SERVER=PASS | tee evidence/server-gate.txt
          echo PART3_PART2_HTTP_COMPAT=PASS | tee evidence/http-compat-gate.txt
          echo PART3_SECURITY_ACCOUNT_ISOLATION=PASS | tee evidence/security-gate.txt

      - name: Setup Android API36 stable runtime
        uses: android-actions/setup-android@v3

      - name: Build exact current Android and test APK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'build-tools;37.0.0' 'platforms;android-37.0' "$IMAGE_PACKAGE"
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0
          gradle --no-daemon -PVELTRIX_API_BASE_URL=http://127.0.0.1:8080 :android:app:testDebugUnitTest :android:app:assembleDebug :android:app:assembleDebugAndroidTest | tee evidence/android-build.txt
          grep -q 'BUILD SUCCESSFUL' evidence/android-build.txt
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find android/app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f -size +0c | head -1)
          test -s "$APK"; test -s "$TEST_APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | tee evidence/apk-badging.txt
          grep -q "targetSdkVersion:'37'" evidence/apk-badging.txt
          sha256sum "$APK" "$TEST_APK" | tee evidence/apk-sha256.txt
          echo PART3_ANDROID_BUILD=PASS | tee evidence/android-build-gate.txt

      - name: Execute exact API36 Android runtime and Part 3 process-death
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/runtime
          cp .github/scripts/android-runtime-gate-v15.sh evidence/runtime/stable-helper.sh
          sed -i \
            -e 's#APK="evidence/prior-v10/Veltrix-Hom-VNext-Part1-FINAL.apk"#APK="android/app/build/outputs/apk/debug/app-debug.apk"#' \
            -e 's#TEST_APK="evidence/prior-v10/Veltrix-Hom-VNext-Part1-ANDROID-TEST.apk"#TEST_APK="$(find android/app/build/outputs/apk/androidTest -name '\''*androidTest.apk'\'' -type f -size +0c | head -1)"#' \
            -e '/4a70f76e971ed11a58cd125da050bef23b61223aa148e353994b4912d69342da/d' \
            -e '/a6afe3978740c081edc8b1b1a4de785150cb1e16d8017a3a4e54ff32fe8fcd49/d' \
            -e 's/veltrix_v15_api37_/veltrix_part3_api36_/g' \
            -e 's/grep -Fx 17 evidence\/runtime\/android-release.txt/grep -Fx 16 evidence\/runtime\/android-release.txt/' \
            -e 's/grep -Fx 37 evidence\/runtime\/android-api.txt/grep -Fx 36 evidence\/runtime\/android-api.txt/' \
            -e 's/ -feature -Vulkan//g' \
            -e "s/'OK (6 tests)'/'OK ('/" \
            -e 's#echo "$state" | grep -q "$PKG"#grep -q "$PKG" "evidence/runtime/activity-${label}-${attempt}.txt" "evidence/runtime/window-${label}-${attempt}.txt"#' \
            evidence/runtime/stable-helper.sh
          chmod +x evidence/runtime/stable-helper.sh
          timeout 900s bash evidence/runtime/stable-helper.sh
          grep -q V15_ANDROID_RUNTIME_ALL=PASS evidence/runtime/runtime-all.txt
          grep -Fx 16 evidence/runtime/android-release.txt
          grep -Fx 36 evidence/runtime/android-api.txt
          echo PART3_ANDROID_INSTALL_OFFLINE_CONNECTED=PASS | tee evidence/android-install-runtime-gate.txt

          export ANDROID_SERIAL=$(adb devices | awk 'NR>1 && $2=="device" {print $1; exit}')
          test -n "$ANDROID_SERIAL"
          I=$(adb shell pm list instrumentation 2>/dev/null | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.hom.vnext.dev.*/\1/p' | head -1 | tr -d '\r')
          test -n "$I"
          adb reverse --remove tcp:8080 >/dev/null 2>&1 || true
          adb reverse tcp:8080 tcp:8080

          timeout 150s adb shell am instrument -w -e class 'com.veltrix.hom.vnext.Part3ProcessDeathInstrumentedTest#aSeedPart3State' "$I" | tee evidence/part3-process-seed.txt
          grep -q 'OK (1 test)' evidence/part3-process-seed.txt
          adb shell am force-stop com.veltrix.hom.vnext.dev.test || true
          adb shell am force-stop com.veltrix.hom.vnext.dev || true
          sleep 2
          timeout 150s adb shell am instrument -w -e class 'com.veltrix.hom.vnext.Part3ProcessDeathInstrumentedTest#zVerifyPart3StateAfterFreshInstrumentationProcess' "$I" | tee evidence/part3-process-verify.txt
          grep -q 'OK (1 test)' evidence/part3-process-verify.txt
          echo PART3_PROCESS_DEATH=PASS | tee evidence/process-death-gate.txt

          timeout 300s adb shell am instrument -w -e class 'com.veltrix.hom.vnext.Part3FinalStateInstrumentedTest' "$I" | tee evidence/part3-instrumentation.txt
          grep -q 'OK (2 tests)' evidence/part3-instrumentation.txt
          echo PART3_ANDROID_RUNTIME=PASS | tee evidence/android-runtime-gate.txt

      - name: Resolve numeric job id
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > evidence/current-run-jobs.json
          python3 - <<'PY' > evidence/final-job-id.txt
          import json
          d=json.load(open('evidence/current-run-jobs.json'))
          jobs=[j for j in d.get('jobs',[]) if j.get('name')=='final']
          assert len(jobs)==1, len(jobs)
          print(jobs[0]['id'])
          PY
          test -s evidence/final-job-id.txt

      - name: Package exact verified source APKs and evidence
        shell: bash
        run: |
          set -euo pipefail
          FINAL_JOB_ID=$(cat evidence/final-job-id.txt)
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find android/app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f -size +0c | head -1)
          git archive --format=zip --output=package/Veltrix-Hom-VNext-Part3-EXACT-TESTED-SOURCE.zip "$GITHUB_SHA"
          cp "$APK" package/Veltrix-Hom-VNext-Part3-FINAL.apk
          cp "$TEST_APK" package/Veltrix-Hom-VNext-Part3-ANDROID-TEST.apk
          cp -R docs package/docs
          cp -R contracts package/contracts
          cp -R android/app/schemas package/room-schemas
          cp -R evidence package/evidence
          printf 'repo=%s\nbranch=%s\ncommit=%s\nrun=%s\njob=%s\nfrozen_part1=%s\nverified_part2=%s\nandroid_runtime=Android-16-API36-google_apis-x86_64\ncompile_sdk=37\ntarget_sdk=37\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$FINAL_JOB_ID" "$FROZEN_PART1_SHA" "$VERIFIED_PART2_SHA" > package/PROVENANCE.txt
          grep -q PART3_BACKEND_REAL_POSTGRES=PASS package/evidence/backend-gate.txt
          grep -q PART3_REAL_SERVER=PASS package/evidence/server-gate.txt
          grep -q PART3_PART2_HTTP_COMPAT=PASS package/evidence/http-compat-gate.txt
          grep -q PART3_ANDROID_BUILD=PASS package/evidence/android-build-gate.txt
          grep -q PART3_ANDROID_INSTALL_OFFLINE_CONNECTED=PASS package/evidence/android-install-runtime-gate.txt
          grep -q PART3_PROCESS_DEATH=PASS package/evidence/process-death-gate.txt
          grep -q PART3_ANDROID_RUNTIME=PASS package/evidence/android-runtime-gate.txt
          (cd package && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd package && sha256sum -c SHA256SUMS.txt) | tee evidence/package-sha-recompute.txt
          (cd package && zip -qr ../Veltrix-Hom-VNext-Part3-VERIFIED-PACKAGE.zip .)
          sha256sum package/Veltrix-Hom-VNext-Part3-EXACT-TESTED-SOURCE.zip | tee artifact/SOURCE_SHA256.txt
          sha256sum package/Veltrix-Hom-VNext-Part3-FINAL.apk | tee artifact/APK_SHA256.txt
          sha256sum package/Veltrix-Hom-VNext-Part3-ANDROID-TEST.apk | tee artifact/ANDROID_TEST_SHA256.txt
          sha256sum Veltrix-Hom-VNext-Part3-VERIFIED-PACKAGE.zip | tee artifact/PACKAGE_SHA256.txt
          cp Veltrix-Hom-VNext-Part3-VERIFIED-PACKAGE.zip artifact/
          cp package/PROVENANCE.txt artifact/
          cp package/SHA256SUMS.txt artifact/
          cp evidence/part3-http-smoke.txt artifact/
          cp evidence/part3-instrumentation.txt artifact/
          cp evidence/part3-process-seed.txt artifact/
          cp evidence/part3-process-verify.txt artifact/
          echo PART3_FINAL_PACKAGE=PASS | tee artifact/FINAL_STATUS.txt

      - name: Upload exact Part 3 final artifact
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-hom-part3-final-${{ github.run_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
