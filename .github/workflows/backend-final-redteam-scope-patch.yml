name: Backend Final Red-Team Scope Patch

on:
  pull_request:
    branches: [veltrix-hom-backend-final-closure]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veltrix-hom-backend-final-closure-verify
          fetch-depth: 0
      - name: Patch final red-team classifier only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('.github/workflows/backend-final-closure-final-gate.yml'),
              Path('.github/workflows/backend-final-closure-runtime-package.yml'),
          ]
          old = "          git grep -nE 'TODO|FIXME|placeholder|fake API|fake citation|loot.?box|client-trusted XP|client-trusted Coins' -- ':!docs/**' ':!server/src/test/**' ':!android/app/src/androidTest/**' ':!.github/**' ':!scripts/CoreRegression.kt' > evidence/red-team-findings.txt || true"
          new = """          REDTEAM_TARGETS=(
            core/src/main
            server/src/main
            android/app/src/main
            database/migrations
            contracts
            .env.example
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
            server/build.gradle.kts
            android/app/build.gradle.kts
          )
          for target in \"${REDTEAM_TARGETS[@]}\"; do test -e \"$target\"; done
          git grep -nE 'TODO|FIXME|placeholder|fake API|fake citation|loot.?box|client-trusted XP|client-trusted Coins' -- \"${REDTEAM_TARGETS[@]}\" | tee evidence/red-team-findings.txt || true"""
          for path in files:
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one old classifier, found {text.count(old)}')
              path.write_text(text.replace(old, new))
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --name-only | sort
          git diff -- .github/workflows/backend-final-closure-final-gate.yml .github/workflows/backend-final-closure-runtime-package.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/backend-final-closure-final-gate.yml .github/workflows/backend-final-closure-runtime-package.yml
          git commit -m 'ci(final): scan shipping source in red-team gate'
          git push origin HEAD:veltrix-hom-backend-final-closure-verify
