name: Android 17 API 37 Install Probe

on:
  push:
    branches: [veltrix-hom-part1-completion]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  api37-install-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android-avd
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact Android runtime and host dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'emulator' \
            'build-tools;37.0.0' \
            'platforms;android-37.0' \
            'system-images;android-37.0;google_apis;x86_64'
          sudo apt-get update
          sudo apt-get install -y libpulse0
          adb version | tee evidence/adb-version.txt
          "$ANDROID_HOME/emulator/emulator" -version 2>&1 | tee evidence/emulator-version.txt

      - name: Build and statically inspect exact APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :android:app:assembleDebug | tee evidence/android-build.txt
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee evidence/apk-sha256.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | tee evidence/apk-badging.txt
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 -v 4 "$APK" > evidence/zipalign-16k.txt 2>&1
          tail -80 evidence/zipalign-16k.txt
          grep -q 'Verification successful' evidence/zipalign-16k.txt
          unzip -l "$APK" | grep '\.so$' | tee evidence/native-libraries.txt || true

      - name: Boot exact API 37 emulator with durable data capacity
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          test -e /dev/kvm && test -r /dev/kvm && test -w /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd \
            -n veltrix_install_probe \
            -k 'system-images;android-37.0;google_apis;x86_64' -f
          AVD_CONFIG="$ANDROID_AVD_HOME/veltrix_install_probe.avd/config.ini"
          grep -q '^hw.ramSize=' "$AVD_CONFIG" && sed -i 's/^hw.ramSize=.*/hw.ramSize=4096/' "$AVD_CONFIG" || echo 'hw.ramSize=4096' >> "$AVD_CONFIG"
          grep -q '^hw.cpu.ncore=' "$AVD_CONFIG" && sed -i 's/^hw.cpu.ncore=.*/hw.cpu.ncore=2/' "$AVD_CONFIG" || echo 'hw.cpu.ncore=2' >> "$AVD_CONFIG"
          grep -q '^disk.dataPartition.size=' "$AVD_CONFIG" && sed -i 's/^disk.dataPartition.size=.*/disk.dataPartition.size=4G/' "$AVD_CONFIG" || echo 'disk.dataPartition.size=4G' >> "$AVD_CONFIG"
          cat "$AVD_CONFIG" | tee evidence/avd-config.txt
          adb kill-server || true
          adb start-server
          nohup "$ANDROID_HOME/emulator/emulator" @veltrix_install_probe \
            -port 5554 -memory 4096 -cores 2 -partition-size 4096 \
            -no-window -gpu software -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on \
            > evidence/emulator.log 2>&1 &
          EMULATOR_PID=$!
          SERIAL=''
          for i in $(seq 1 180); do
            kill -0 "$EMULATOR_PID" 2>/dev/null || break
            SERIAL=$(adb devices | awk 'NR>1 && $2 == "device" {print $1; exit}')
            [ -n "$SERIAL" ] && break
            [ "$i" -ge 15 ] && adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            sleep 2
          done
          test -n "$SERIAL"
          export ANDROID_SERIAL="$SERIAL"
          printf 'ANDROID_SERIAL=%s\n' "$SERIAL" | tee evidence/android-serial.txt
          for i in $(seq 1 180); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          PM_READY=0
          for i in $(seq 1 90); do
            if adb shell pm path android > evidence/pm-ready.txt 2>&1; then PM_READY=1; break; fi
            sleep 2
          done
          test "$PM_READY" -eq 1
          adb shell getprop ro.build.version.release | tee evidence/android-release.txt
          adb shell getprop ro.build.version.sdk | tee evidence/android-api.txt
          adb shell getconf PAGE_SIZE | tee evidence/page-size.txt || true
          adb shell df -h /data | tee evidence/data-disk.txt
          AVAILABLE_KB=$(adb shell df -Pk /data | awk 'NR==2 {print $4}' | tr -d '\r')
          printf 'DATA_AVAILABLE_KB=%s\n' "$AVAILABLE_KB" | tee evidence/data-available-kb.txt
          test "$AVAILABLE_KB" -ge 524288
          adb shell dumpsys package | grep -m1 -E 'Packages:|Package Changes' | tee evidence/package-service.txt || true
          adb devices -l | tee evidence/adb-final.txt
          echo 'ANDROID_API37_DATA_CAPACITY_GATE=PASS' | tee evidence/data-capacity-gate.txt

      - name: Install APK through Package Manager
        shell: bash
        run: |
          set -uo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          set +e
          adb push "$APK" /data/local/tmp/veltrix-app.apk > evidence/push-app.txt 2>&1
          PUSH_RC=$?
          if [ "$PUSH_RC" -eq 0 ]; then
            adb shell pm install -r -t /data/local/tmp/veltrix-app.apk > evidence/install-app.txt 2>&1
            RC=$?
          else
            RC=$PUSH_RC
            printf 'PUSH_FAILED_RC=%s\n' "$PUSH_RC" > evidence/install-app.txt
          fi
          set -e
          cat evidence/push-app.txt || true
          cat evidence/install-app.txt
          printf 'APK_INSTALL_RC=%s\n' "$RC" | tee evidence/install-rc.txt
          if [ "$RC" -ne 0 ]; then
            adb shell logcat -d -b all -t 1500 > evidence/logcat-install-failure.txt 2>&1 || true
            adb shell dumpsys package > evidence/dumpsys-package-failure.txt 2>&1 || true
            adb shell df -h > evidence/df-failure.txt 2>&1 || true
            exit "$RC"
          fi
          grep -q 'Success' evidence/install-app.txt
          adb shell pm path com.veltrix.hom.vnext.dev | tee evidence/installed-package-path.txt
          echo 'ANDROID_API37_INSTALL_PROBE=PASS' | tee evidence/result.txt

      - name: Cold launch installed APK with service stability gate
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE=com.veltrix.hom.vnext.dev
          COMPONENT=com.veltrix.hom.vnext.dev/com.veltrix.hom.vnext.MainActivity

          SERVICE_READY=0
          for i in $(seq 1 60); do
            adb wait-for-device
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            ACTIVITY=$(adb shell service check activity 2>&1 | tr -d '\r' || true)
            PACKAGE_SERVICE=$(adb shell service check package 2>&1 | tr -d '\r' || true)
            printf 'try=%s boot=%s activity=%s package=%s\n' "$i" "$BOOT" "$ACTIVITY" "$PACKAGE_SERVICE" | tee -a evidence/launch-service-readiness.txt
            if [ "$BOOT" = '1' ] && echo "$ACTIVITY" | grep -q 'found' && echo "$PACKAGE_SERVICE" | grep -q 'found'; then
              SERVICE_READY=1
              break
            fi
            sleep 2
          done
          test "$SERVICE_READY" -eq 1
          adb shell pm path "$PACKAGE" | tee evidence/launch-package-path.txt
          adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$PACKAGE" 2>&1 | tee evidence/launch-resolve.txt || true
          adb logcat -c || true

          LAUNCH_OK=0
          : > evidence/cold-launch.txt
          for i in $(seq 1 5); do
            printf '\nLAUNCH_ATTEMPT=%s\n' "$i" | tee -a evidence/cold-launch.txt
            adb shell am force-stop "$PACKAGE" >> evidence/cold-launch.txt 2>&1 || true
            set +e
            OUT=$(adb shell am start -W -S -n "$COMPONENT" 2>&1)
            RC=$?
            set -e
            printf '%s\n' "$OUT" | tee -a evidence/cold-launch.txt
            printf 'LAUNCH_RC=%s\n' "$RC" | tee -a evidence/cold-launch.txt
            if [ "$RC" -eq 0 ] && echo "$OUT" | grep -q 'Status: ok'; then
              sleep 3
              PID=$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r' || true)
              printf 'APP_PID=%s\n' "$PID" | tee -a evidence/cold-launch.txt
              if [ -n "$PID" ]; then
                LAUNCH_OK=1
                break
              fi
            fi
            adb get-state 2>&1 | tee -a evidence/cold-launch.txt || true
            adb shell getprop sys.boot_completed 2>&1 | tee -a evidence/cold-launch.txt || true
            adb shell service check activity 2>&1 | tee -a evidence/cold-launch.txt || true
            adb shell pidof system_server 2>&1 | tee -a evidence/cold-launch.txt || true
            sleep 3
          done

          adb logcat -d -b all -t 2500 > evidence/logcat-cold-launch.txt 2>&1 || true
          adb shell dumpsys activity activities > evidence/dumpsys-activity.txt 2>&1 || true
          adb shell dumpsys package "$PACKAGE" > evidence/dumpsys-app-package.txt 2>&1 || true
          if [ "$LAUNCH_OK" -ne 1 ]; then
            grep -E -i 'FATAL EXCEPTION|AndroidRuntime|Process: com.veltrix.hom.vnext|system_server|Watchdog|lowmemory|am_crash' evidence/logcat-cold-launch.txt | tail -300 | tee evidence/cold-launch-failure-summary.txt || true
            exit 1
          fi
          grep -q 'Status: ok' evidence/cold-launch.txt
          echo 'ANDROID_API37_COLD_LAUNCH_PROBE=PASS' | tee -a evidence/result.txt

      - name: Upload install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api37-install-probe-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
